# このファイルは SSK-TBD/git-security の org-workflows/ から配布している。
# 直接編集しても日次の sync で上書き PR が作成されるため、変更は git-security 側で行うこと。
name: zizmor
on:
  pull_request:
  push:
    branches: [main, master]
permissions: {}
jobs:
  zizmor:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # private repo は GitHub Advanced Security が無く SARIF を upload できないため、
          # annotation で結果を表示する。
          advanced-security: false
          annotations: true
          # online audit は参照先 action の取得に API を使う。private の SSK-TBD/... action を参照する
          # repo では default の GITHUB_TOKEN に権限が無く、検出の有無に関係なく fatal になるため無効にする。
          online-audits: false
          # low / informational の指摘では fail させない。
          min-severity: medium
          # repo に .zizmor.yml (ignore ルール) があれば読み込む。
          # .github/zizmor.yml と zizmor.yml は zizmor が自動で見つけるため指定不要。
          config: ${{ hashFiles('.zizmor.yml') != '' && '.zizmor.yml' || '' }}

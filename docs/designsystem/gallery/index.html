r.content.secondary` 近傍） |\n| エラーボーダー | `color.semantic.error`(#e93766) |\n| 警告ボーダー | `color.semantic.warning`(#ee8c29) |\n| disabled テキスト / 背景 | `color.content.disabled`(#a1afc0) / `color.surface.base` |\n| Required マーク | `color.semantic.error`(#e93766) |\n| 角丸 | `radius.sm`（→ `rounded-[2px]` で適用） |\n| シェブロン色 | `color.content.secondary`(#5a6c7f) / disabled 時は `color.content.disabled`(#a1afc0) |\n| シェブロン右余白 / 一辺 / 右パディング | `spacing.2`(8px) / `spacing.5`(20px) / `spacing.8`(32px) |\n\n---\n\n## 7. Accessibility\n- `<label for=\"id\">` と `<select id=\"id\">` を一致させる（ラベルなし禁止）\n- 必須: `required` + `aria-required=\"true\"` + 視覚的 `*`\n- エラー: テキストに `id` + `role=\"alert\"`、`<select>` に `aria-describedby` と `aria-invalid=\"true\"`\n- Disabled: `disabled` 属性\n- キーボード: Tab フォーカス・Space/Enter で開閉・矢印キーで選択肢移動・Home/End・先頭一致ジャンプ（ネイティブ標準）\n- コントラスト: ラベル・選択テキスト 4.5:1 以上\n\n## 8. Content Guidelines\n- プレースホルダーは「選択してください」または「[項目名]を選択」\n- ラベルは何を選ぶかを端的に。Helper は1行で制約や用途を補足\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 必須 + ヘルパー（appearance-none + カスタム chevron） -->\n<div class=\"flex flex-col gap-[4px] items-start\">\n  <div class=\"leading-normal text-[12px] font-medium tracking-[0.24px]\" style=\"color:#3e5062;\">\n    役割<span class=\"text-[#e93766] ml-0.5\">*</span>\n  </div>\n  <div class=\"relative w-full\">\n    <select id=\"select-role\" name=\"role\" required aria-required=\"true\" aria-describedby=\"select-role-helper\"\n      class=\"w-full h-[36px] appearance-none pl-[8px] pr-8 text-[12px] font-medium tracking-[0.24px] border border-[#c4cdd9] rounded-[2px] bg-white outline-none focus:border-[#2661cf] hover:bg-[#f7f9fb] transition-colors cursor-pointer\" style=\"color:#3e5062;\">\n      <option value=\"\" disabled selected>選択してください</option>\n      <option value=\"admin\">管理者</option>\n      <option value=\"editor\">編集者</option>\n    </select>\n    <svg class=\"pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5\" style=\"color:#3e5062;\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\">\n      <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"/>\n    </svg>\n  </div>\n  <p id=\"select-role-helper\" class=\"text-[11px] text-[#5a6c7f]\">プロジェクト内での権限を決定します</p>\n</div>\n\n<!-- Do: グループ付き（optgroup） -->\n<select class=\"w-full h-[36px] appearance-none pl-[8px] pr-8 text-[12px] font-medium tracking-[0.24px] border border-[#c4cdd9] rounded-[2px] bg-white outline-none focus:border-[#2661cf] hover:bg-[#f7f9fb] cursor-pointer\" style=\"color:#3e5062;\">\n  <option value=\"\" disabled selected>選択してください</option>\n  <optgroup label=\"関東\"><option>東京</option><option>神奈川</option></optgroup>\n  <optgroup label=\"関西\"><option>大阪</option><option>京都</option></optgroup>\n</select>\n```\n\n**Don't**: ネイティブ矢印表示（→ `appearance-none` + カスタム SVG）/ `rounded-lg`（→ `rounded-[2px]`）/ `focus:ring-*`（→ `focus:border-[#2661cf]` のみ）/ `<label>` 省略 / `py-2 text-base`（→ `h-[36px] text-[12px]`）/ 選択変更だけで遷移・送信。\n\n---\n\n## 10. Implementation Notes\n- アイコンは Lucide（chevron-down）。エラーアイコンは circle-alert（`w-3.5 h-3.5`）\n- カスタムドロップダウン（検索付き）にする場合は Combobox 相当のキーボード・ARIA を満たす（Trigger `role=\"combobox\"` / List `role=\"listbox\"` / 各項目 `role=\"option\"` `aria-selected`）\n- トークン参照は `guidelines/TOKEN_GUIDE.md`。フォーム全体のレイアウトは `Form.md` を参照\n", "base/form/Checkbox.md": "# Component Guideline: Checkbox\n\n> NestUI Checkbox 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` / `color.border.*` 等）を正とし、以下の class はその適用例。ネイティブ `<input type=\"checkbox\">` に `appearance-none` を当て、SVG オーバーレイで描画する。\n\n## 1. Component Identity\n- **Name**: Checkbox\n- **Variants**: 単一（`default`）/ グループ（`<fieldset>`）/ 不確定（Indeterminate）\n- **Responsibility**:\n  - する: 選択肢群から0個以上を選ぶ。単一の ON/OFF 切り替え（送信で確定）\n  - しない: 排他的単一選択（→ Radio）、即時反映の ON/OFF（→ Toggle）、選択肢が多数・動的増減（→ Dropdown）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: チェックの切り替えだけでは確定しない（送信/確認ボタンで反映）/ 即時反映は Toggle / ラベルは能動的な肯定文。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 説明 |\n|---------|------|\n| 単一 | 利用規約同意・メール購読など ON/OFF の2値 |\n| グループ | `<fieldset>` + `<legend>` で複数選択肢をまとめる（縦並び推奨） |\n| Indeterminate | 親子関係で子の一部のみ選択時に親が不確定（ダッシュ表示） |\n\n**States**\n\n| State | 変化 |\n|-------|------|\n| Unchecked | `border border-[#c4cdd9] bg-white` |\n| Hover | `hover:bg-primary-50`（チェック時 `checked:hover:bg-primary-600`） |\n| Checked | `checked:bg-primary-700 checked:border-primary-700` + SVG チェックマーク（`peer-checked:opacity-100`） |\n| Indeterminate | `indeterminate:bg-primary-700 indeterminate:border-primary-700` + ダッシュ SVG（`peer-indeterminate:opacity-100`）。JS: `el.indeterminate = true` |\n| Focus | `focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1` |\n| Error | `border-[#e93766] checked:bg-[#e93766] checked:border-[#e93766]` + `aria-invalid=\"true\"` + エラーメッセージ |\n| Disabled（未チェック） | `bg-white border-2 border-[#dde3eb] cursor-not-allowed`（`opacity-50` 禁止） |\n| Disabled（チェック済み） | `bg-[#c4cdd9] border-[#c4cdd9] cursor-not-allowed` |\n\n---\n\n## 3. サイズ / Anatomy\n\n| サイズ | 外側コンテナ | ボックス | チェック SVG | ラベル |\n|--------|-------------|---------|-------------|--------|\n| Medium（既定） | `w-6 h-6`（24px） | `w-5 h-5`（20px） | `w-3.5 h-3.5` | `text-[14px] tracking-[0.28px]` |\n| Small | `w-6 h-6`（24px） | `w-3.5 h-3.5`（14px） | `w-2.5 h-2.5` | `text-[12px] tracking-[0.24px]` |\n\n共通: ボックス `appearance-none rounded-[2px]`、ラベル `font-medium leading-[1.3] text-body`。`gap-1`（M）/ `gap-0.5`（S）。\n\n**Anatomy**: Box + Checkmark（選択時）+ Indeterminate Mark（条件付き）+ Label + Group Label（`<legend>`）+ Helper / Error Text。\n\n> **行間の注意**: `body { line-height: 2.0 }` 環境では、チェックボックスグループの包含 `<div>` に `leading-normal` を付与して行間をリセットする。\n\n---\n\n## 4. Composition Rules\n\n許可: テキストノード（ラベル）/ グループは `<fieldset>` + `<legend>` / Helper・Error テキスト。\n禁止: `<label>` の省略 / Checkbox 内に Checkbox を入れること（中間状態は `indeterminate` で表現）/ カード直下に `<fieldset>` を見出し代わりに使うこと。\nAnti-pattern: 確認が必要なアクションに単体 Checkbox（「削除に同意」はチェックボックス + ボタンのセット）/ 排他的単一選択に Checkbox（→ Radio）。\n\n---\n\n## 5. Layout & Spacing\n\n- ボックス-ラベル gap: `gap-1`（M, 4px）/ `gap-0.5`（S, 2px）\n- グループ内の行間: `space-y-2`（包含 div に `leading-normal`）\n- エラーメッセージはボックス幅分インデント（`ml-7`）+ `mt-1`\n- 角丸 `rounded-[2px]`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| 未チェック ボーダー / 背景 | `color.border.default`(#c4cdd9) / `color.surface.input`(#fff) |\n| チェック済み 背景・ボーダー | `color.primary.700`（hover `.600`） |\n| チェックマーク | `color.content.inverse`（white） |\n| hover 背景（未チェック） | `color.primary.50` |\n| エラー ボーダー・背景 | `color.semantic.error`(#e93766) |\n| focus ring | `color.border.focus`(= primary-700) |\n| disabled ボーダー（未チェック）/ 背景（チェック済み） | `color.border.subtle`(#dde3eb) / `color.border.default`(#c4cdd9) |\n| disabled ラベル | `color.content.disabled`(#a1afc0) |\n| 角丸 | `radius.sm`（→ `rounded-[2px]`） |\n\n---\n\n## 7. Accessibility\n- `<label>` を各チェックボックスに関連付ける（`for` 属性 or ラッピング）\n- グループは `<fieldset>` + `<legend>`\n- `role=\"checkbox\"`（ネイティブ input なら不要）。`aria-checked`: `true`/`false`/`mixed`（Indeterminate）\n- キーボード: Tab フォーカス・Space で切り替え。Disabled はキーボードからも操作不可\n- エラー: 色だけでなくテキスト + アイコン併用。`aria-describedby` で関連付け\n- コントラスト: ラベル 4.5:1 以上、Box（ボーダー/背景）3:1 以上。テキスト200%拡大でクリッピングしない\n\n## 8. Content Guidelines\n- ラベルは能動的な肯定文（「メール通知を受け取る」「自動保存を有効にする」）\n- 否定文ラベルは避ける（「通知を無効にする」→ Toggle を検討）\n- Helper は1行以内\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 単一チェックボックス（Medium） -->\n<label class=\"inline-flex items-center gap-1 cursor-pointer\">\n  <span class=\"relative flex-shrink-0 w-6 h-6 flex items-center justify-center\">\n    <input type=\"checkbox\"\n      class=\"peer appearance-none w-5 h-5 rounded-[2px] border border-[#c4cdd9] bg-white\n             checked:bg-primary-700 checked:border-primary-700 hover:bg-primary-50 checked:hover:bg-primary-600\n             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\n             cursor-pointer transition-colors duration-150\">\n    <svg class=\"absolute pointer-events-none opacity-0 peer-checked:opacity-100 w-3.5 h-3.5 text-white\"\n         viewBox=\"0 0 14 11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n      <polyline points=\"1.5,5.5 5,9 12.5,1.5\"/>\n    </svg>\n  </span>\n  <span class=\"text-[14px] font-medium tracking-[0.28px] leading-[1.3] text-body\">メール通知</span>\n</label>\n\n<!-- Do: Indeterminate（ダッシュ SVG を重ねる） -->\n<label class=\"inline-flex items-center gap-1 cursor-pointer\">\n  <span class=\"relative flex-shrink-0 w-6 h-6 flex items-center justify-center\">\n    <input type=\"checkbox\" id=\"cb-all\"\n      class=\"peer appearance-none w-5 h-5 rounded-[2px] border border-[#c4cdd9] bg-white\n             checked:bg-primary-700 checked:border-primary-700 indeterminate:bg-primary-700 indeterminate:border-primary-700\n             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1 cursor-pointer transition-colors\">\n    <svg class=\"absolute pointer-events-none opacity-0 peer-indeterminate:opacity-100 w-2.5 h-0.5 text-white\"\n         viewBox=\"0 0 10 2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><line x1=\"1\" y1=\"1\" x2=\"9\" y2=\"1\"/></svg>\n  </span>\n  <span class=\"text-[14px] font-medium tracking-[0.28px] leading-[1.3] text-body\">すべて選択</span>\n</label>\n<script>document.getElementById('cb-all').indeterminate = true;<\/script>\n```\n\n**Don't**: `accent-primary-500`（→ `appearance-none` + カスタム SVG）/ `<label>` 省略 / `focus:ring-primary-500/50`（→ `focus-visible:ring-primary-700 ring-offset-1`）/ エラーを色だけで伝える / Disabled に `opacity-50`（→ 専用配色 `border-[#dde3eb]` / `bg-[#c4cdd9]`）/ 単一選択に Checkbox（→ Radio）。\n\n---\n\n## 10. Implementation Notes\n- チェックマークは `peer-checked:opacity-100`、ダッシュは `peer-indeterminate:opacity-100` の SVG オーバーレイで制御\n- `CheckboxGroup` 相当は `value` 配列を管理し、各 `checked` を計算して渡す\n- アイコンは Lucide。エラーアイコンは circle-alert（`w-3.5 h-3.5`）\n- トークン参照は `guidelines/TOKEN_GUIDE.md`\n", "base/form/Radio.md": "# Component Guideline: Radio\n\n> NestUI Radio Button 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` 等）を正とし、以下の class / CSS はその適用例。`appearance: none` でネイティブ表示を完全リセットし、ボーダー色変更 + 内側ドットで選択を表す。\n\n## 1. Component Identity\n- **Name**: Radio\n- **Variants**: 縦並び / 横並び / 説明付き（カードスタイル）\n- **Responsibility**:\n  - する: 選択肢群から排他的に1つを選ぶ。全選択肢を常時表示して比較させる\n  - しない: 複数選択（→ Checkbox）、選択肢が多い（→ Dropdown）、ON/OFF の2値（→ Checkbox / Toggle）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 選択肢は2〜5つ / 全選択肢を同時表示して比較可能に / 切り替えだけでは確定しない（送信で反映）/ 原則1つを初期選択にする / 単一の Radio は使わない（2つ以上必須。ON/OFF は Checkbox か Toggle）。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 説明 | 用途 |\n|---------|------|------|\n| 縦並び | 標準。選択肢を縦に並べる | 支払い方法など |\n| 横並び | 2〜3つで短いラベル | 性別など |\n| 説明付き（カード） | 各選択肢に補足説明 + `has-[:checked]` で選択強調 | プラン選択など |\n\n**States**\n\n| State | 変化 |\n|-------|------|\n| Unselected | `border: 2px solid #cbd5e1`（≒ `color.border.default`）/ `bg-white` |\n| Selected | `border-color: #2b70ef`（primary-500）+ 内側ドット `::after`（`bg #2b70ef`） |\n| Focus | `box-shadow: 0 0 0 2px rgba(59,130,246,0.3)`（`focus-visible:ring-2 ring-primary-700 ring-offset-1` と等価運用） |\n| Error | `border-[#e93766]` + `aria-invalid=\"true\"`（選択時は内側ドットも `#ef4444`）+ エラーメッセージ |\n| Disabled | `opacity: 0.5; cursor: not-allowed` |\n\n> 選択解除は不可（同グループの別選択肢を選ぶまで Selected を維持）。Checkbox と異なりクリックで解除されない。\n\n---\n\n## 3. サイズ / Anatomy\n\n| 項目 | 値 |\n|------|-----|\n| Radio Circle | `1.125rem`（18px）`border-radius: 9999px` |\n| 内側ドット | `0.5rem`（8px）`border-radius: 9999px` |\n| Circle-ラベル gap | `gap-2`（8px） |\n| ラベル | `text-sm`（行 + 説明含む div は `leading-normal`） |\n\n**Anatomy**: Radio Circle + Selected Indicator（内側ドット）+ Label + Group Label（`<legend>`）+ Description（任意）+ Helper / Error Text。\n\n---\n\n## 4. Composition Rules\n\n許可: テキストノード（ラベル）/ Description / グループは `<fieldset>` + `<legend>`。\n禁止: `<fieldset>` ラッパーの省略（ラジオグループに必須）/ `<label>` の省略 / 単一の Radio。\n配置: レイアウトは選択肢数と文字数に合わせる（縦並び推奨、3つ以下で短ければ横並びも可）。同一 `name` が1グループとして動作。\n\n---\n\n## 5. Layout & Spacing\n\n- 縦並び: `flex flex-col gap-4`\n- 横並び: `flex flex-wrap gap-6`\n- 説明付きカード: `space-y-3`、各カード `p-4 border border-slate-200 rounded-lg`、説明含む div に `leading-normal`\n- エラーメッセージ `mt-1`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| 未選択ボーダー | `color.border.default`（#c4cdd9 ≒ サンプルの #cbd5e1） |\n| 選択ボーダー・内側ドット | `color.primary.500`（#2b70ef） |\n| 背景 | `color.surface.input`（white） |\n| エラーボーダー・ドット | `color.semantic.error`(#e93766 / サンプル #ef4444) |\n| focus ring | `color.border.focus`(= primary-700) |\n| ラベル | `color.content.primary` / Description は `color.content.secondary` |\n| Required マーク | `color.semantic.error`(#e93766) |\n\n---\n\n## 7. Accessibility\n- `<fieldset>` + `<legend>` でグループを構成（必須）\n- `<label>` を各ラジオに関連付ける（`for` or ラッピング）\n- キーボード: Tab でグループにフォーカス、ArrowUp/Left で前・ArrowDown/Right で次へ移動して選択、Space で選択\n- エラー: 色だけでなくテキスト + アイコン併用。`aria-describedby` で `<fieldset>` に関連付け、`aria-invalid=\"true\"`\n- コントラスト: ラベル 4.5:1 以上、Circle（ボーダー/背景）3:1 以上。Disabled はキーボードからも操作不可\n\n## 8. Content Guidelines\n- グループ見出し（`<legend>`）で何を選ぶか明示\n- ラベルは選択肢を端的に。Description はプラン差分など比較情報を1〜2行で\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 基本（縦並び） -->\n<fieldset>\n  <legend class=\"text-sm font-medium text-slate-700 mb-3\">お支払い方法</legend>\n  <div class=\"flex flex-col gap-4\">\n    <label class=\"flex items-center gap-2 cursor-pointer\">\n      <input type=\"radio\" name=\"payment\" value=\"credit\" checked\n        class=\"text-primary-500 border-slate-300 focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">\n      <span class=\"text-sm text-slate-700\">クレジットカード</span>\n    </label>\n    <label class=\"flex items-center gap-2 cursor-pointer\">\n      <input type=\"radio\" name=\"payment\" value=\"bank\"\n        class=\"text-primary-500 border-slate-300 focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">\n      <span class=\"text-sm text-slate-700\">銀行振込</span>\n    </label>\n  </div>\n</fieldset>\n\n<!-- Do: 説明付き（カードスタイル・has-[:checked] で選択強調） -->\n<label class=\"flex items-start gap-3 cursor-pointer p-4 border border-slate-200 rounded-lg hover:bg-gray-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50 transition-colors\">\n  <input type=\"radio\" name=\"plan\" value=\"pro\"\n    class=\"mt-[3px] text-primary-500 border-slate-300 focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1 flex-shrink-0\">\n  <div class=\"leading-normal\">\n    <span class=\"text-sm font-medium text-slate-900\">プロ</span>\n    <p class=\"text-sm text-body mt-0.5\">全機能が利用可能。月額 &yen;980</p>\n  </div>\n</label>\n```\n\n**必須カスタム CSS**（ネイティブ表示の完全リセット）:\n\n```css\ninput[type=\"radio\"]{ -webkit-appearance:none; appearance:none; width:1.125rem; height:1.125rem;\n  border:2px solid #cbd5e1; border-radius:9999px; background:#fff; outline:none!important; box-shadow:none!important;\n  cursor:pointer; flex-shrink:0; position:relative; }\ninput[type=\"radio\"]:checked{ border-color:#2b70ef; }\ninput[type=\"radio\"]:checked::after{ content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);\n  width:.5rem; height:.5rem; border-radius:9999px; background:#2b70ef; }\ninput[type=\"radio\"]:focus{ box-shadow:0 0 0 2px rgba(59,130,246,.3)!important; }\ninput[type=\"radio\"]:disabled{ opacity:.5; cursor:not-allowed; }\ninput[type=\"radio\"][aria-invalid=\"true\"]{ border-color:#ef4444; }\ninput[type=\"radio\"][aria-invalid=\"true\"]:checked::after{ background:#ef4444; }\n```\n\n**Don't**: `<fieldset>` ラッパー省略 / `<label>` 省略 / `border-red-500`・`text-red-500`（→ `#e93766`）/ `focus:ring-primary-500/50`（→ `focus-visible:ring-primary-700 ring-offset-1`）/ 単一の Radio 使用。\n\n---\n\n## 10. Implementation Notes\n- `appearance: none` で完全リセットし、選択表示（ボーダー色 + 内側ドット）はすべて CSS で制御\n- エラーアイコンは circle-alert（Lucide `w-3.5 h-3.5`）\n- トークン参照は `guidelines/TOKEN_GUIDE.md`。フォーム全体は `Form.md` を参照\n", "base/form/Toggle.md": "# Component Guideline: Toggle\n\n> NestUI Toggle Switch 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` / slate スケール等）を正とし、以下の class はその適用例。`role=\"switch\"` の `<button>` で実装する（`<input type=\"checkbox\">` のスタイリングで代替しない）。\n\n## 1. Component Identity\n- **Name**: Toggle（Switch）\n- **Variants**: 基本 / 説明付き / ステータス表示付き\n- **Responsibility**:\n  - する: ON/OFF の2値設定を即時反映する（確定ボタン不要）\n  - しない: フォーム送信で確定する設定（→ Checkbox）、3状態以上の選択（→ Radio）、破壊的操作（確認ダイアログを併用）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 操作と同時に反映（楽観的更新→失敗時はロールバック + エラートースト）/ Checkbox との使い分け（送信確定=Checkbox、即時反映=Toggle）/ 副作用をラベルと補足で明示 / 色だけで ON/OFF を伝えない（Thumb の位置変化を必ず併用）。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 説明 | 用途 |\n|---------|------|------|\n| 基本 | ラベル + トグル | 設定画面の各項目 |\n| 説明付き | ラベル + 補足テキスト + トグル | 影響範囲を補足 |\n| ステータス表示付き | トグル横に「ON/OFF」テキスト | 状態を明示したい場合 |\n\n**States**（Track / Thumb）\n\n| State | Track | Thumb |\n|-------|-------|-------|\n| OFF | `bg-slate-200` | 左寄せ・白（`translate-x-0.5`） |\n| ON | `bg-primary-500` | 右寄せ・白（`translate-x-[22px]`、Small `translate-x-[14px]`）+ `aria-checked=\"true\"` |\n| OFF + Hover | `hover:bg-slate-300` | 左寄せ |\n| ON + Hover | `hover:bg-primary-700` | 右寄せ |\n| Focus | `focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1` | — |\n| Disabled OFF | `bg-slate-100 opacity-50 cursor-not-allowed` | 左寄せ + `aria-disabled=\"true\"` |\n| Disabled ON | `bg-primary-300 opacity-50 cursor-not-allowed` | 右寄せ + `aria-disabled=\"true\"` |\n\n---\n\n## 3. サイズ / Anatomy\n\n| サイズ | Track | Thumb | Thumb 移動量 | 用途 |\n|--------|-------|-------|-------------|------|\n| Medium（既定） | `w-11 h-6` | `w-5 h-5` | `translate-x-[22px]` | 標準設定画面 |\n| Small | `w-8 h-5` | `w-3.5 h-3.5` | `translate-x-[14px]` | テーブル内・密なレイアウト |\n\n共通: Track `relative inline-flex items-center rounded-full transition-colors`、Thumb `inline-block rounded-full bg-white shadow-sm transition-transform`。\n\n**Anatomy**: Track + Thumb + Label + Description（任意）+ Status Text（任意）。\n\n> **行間の注意**: `body { line-height: 2.0 }` 環境では、ラベル + 説明を含む `<div>` に `leading-normal` を付与する。\n\n---\n\n## 4. Composition Rules\n\n許可: ラベル（`<label>` or `aria-labelledby`）/ Description / Status Text。\n禁止: `<label>` の省略 / `<input type=\"checkbox\">` をスタイリングでトグルに見せること（`role=\"switch\"` の `<button>` を使う）/ 確定ボタンが必要な操作への使用（→ Checkbox）/ 確認なしでの破壊的操作。\n配置: ラベル左・トグル右の `flex items-center justify-between` が標準。設定リストは `divide-y divide-slate-100` で各行 `py-4`。\n\n---\n\n## 5. Layout & Spacing\n\n- 行レイアウト: `flex items-center justify-between`（説明付きは `items-start gap-4`、トグルに `flex-shrink-0`）\n- 設定リスト: `divide-y divide-slate-100`、各項目 `py-4`\n- Small + Status Text は `flex items-center gap-3`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| ON Track / hover | `color.primary.500` / `color.primary.700` |\n| OFF Track / hover | slate-200 / slate-300（`color.surface.sunken` 近傍のグレースケール） |\n| Thumb | `color.content.inverse`（white） |\n| Disabled ON Track | `color.primary.300` |\n| Disabled OFF Track | slate-100 |\n| focus ring | `color.border.focus`(= primary-700) |\n| ラベル / 説明 | `color.content.primary` 系 / `color.content.secondary`(#5a6c7f) |\n\n---\n\n## 7. Accessibility\n- `role=\"switch\"` を `<button>` に付与。`aria-checked`: `\"true\"` / `\"false\"`（省略禁止）\n- ラベル: `aria-labelledby` でラベルの `id` を参照、または `aria-label` を直接付与\n- Description は `aria-describedby` で紐付け\n- キーボード: Tab でフォーカス、Space / Enter で切り替え\n- Disabled: `aria-disabled=\"true\"` + 操作無効化\n- モーション: `prefers-reduced-motion` 時は Thumb のスライドアニメーションを無効化\n- コントラスト: Track の ON/OFF 状態の色差 3:1 以上\n\n## 8. Content Guidelines\n- ラベルは設定対象を端的に（「メール通知」「二段階認証」）\n- Description で副作用・影響範囲を補足（「ログイン時に認証コードが必要になります」）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 基本（OFF） -->\n<div class=\"flex items-center justify-between\">\n  <label id=\"toggle-label\" class=\"text-sm font-medium text-slate-700\">メール通知</label>\n  <button type=\"button\" role=\"switch\" aria-checked=\"false\" aria-labelledby=\"toggle-label\"\n    class=\"relative inline-flex h-6 w-11 items-center rounded-full bg-slate-200 hover:bg-slate-300\n           focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1 transition-colors\"\n    onclick=\"this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true')\">\n    <span class=\"inline-block h-5 w-5 rounded-full bg-white shadow-sm translate-x-0.5 transition-transform\n                 [[aria-checked=true]_&]:translate-x-[22px]\"></span>\n  </button>\n</div>\n\n<!-- Do: 説明付き（ON） -->\n<div class=\"flex items-start justify-between gap-4\">\n  <div class=\"leading-normal\">\n    <label id=\"t-desc-label\" class=\"text-sm font-medium text-slate-700\">二段階認証</label>\n    <p id=\"t-desc\" class=\"text-sm text-slate-500 mt-1\">ログイン時に認証コードの入力が必要になります</p>\n  </div>\n  <button type=\"button\" role=\"switch\" aria-checked=\"true\" aria-labelledby=\"t-desc-label\" aria-describedby=\"t-desc\"\n    class=\"relative inline-flex h-6 w-11 items-center rounded-full bg-primary-500 flex-shrink-0 hover:bg-primary-700\n           focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1 transition-colors\">\n    <span class=\"inline-block h-5 w-5 rounded-full bg-white shadow-sm translate-x-[22px] transition-transform\"></span>\n  </button>\n</div>\n\n<!-- Do: Small -->\n<button type=\"button\" role=\"switch\" aria-checked=\"true\" aria-label=\"有効\"\n  class=\"relative inline-flex h-5 w-8 items-center rounded-full bg-primary-500 hover:bg-primary-700\n         focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1 transition-colors\">\n  <span class=\"inline-block h-3.5 w-3.5 rounded-full bg-white shadow-sm translate-x-[14px] transition-transform\"></span>\n</button>\n```\n\n**Don't**: `aria-checked` 省略 / Space キー操作未実装 / `<label>` 省略 / 破壊的操作に確認なしで使用 / OFF Track を `bg-slate-200` 以外に変える（Figma 準拠の slate を維持）/ `<input type=\"checkbox\">` で代替。\n\n---\n\n## 10. Implementation Notes\n- 反映処理: ①操作 → ②UI 即時更新（楽観的更新）→ ③バックエンドへ送信 → ④成功は何もしない / 失敗は UI を戻しエラートースト\n- トークン参照は `guidelines/TOKEN_GUIDE.md`。設定画面のレイアウトは Form / secondary-nav パターンを参照\n", "base/form/Date Picker.md": "# Component Guideline: Date Picker\n\n> NestUI Date Picker 仕様。Tailwind CSS。テキストフィールド風トリガー + カレンダーポップアップ。値は `tokens/`（色は `color.primary.*` / `color.border.*` 等）を正とし、以下の class はその適用例。`<input type=\"date\">` は使わずカスタム実装する。\n\n## 1. Component Identity\n- **Name**: Date Picker\n- **Variants**: 単一日付（既定）\n- **Responsibility**:\n  - する: カレンダーUIで日付を選択し `YYYY-MM-DD`（ISO 8601）で格納する\n  - しない: 時刻選択（Date Time Picker として別途）、期間の数値入力（→ Input Number / Text field）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: Dropdown パターン踏襲（テキストフィールド風トリガー + ポップアップ。同じ z-index・shadow 体系）/ `YYYY-MM-DD` 固定（表示・格納とも ISO 8601）/ キーボード完全対応（矢印で日付ナビ、Enter で選択、Escape で閉じる）/ ネイティブ不使用（ブラウザ間で表示が不統一）。\n\n---\n\n## 2. Variants & States\n\n**トリガー状態**\n\n| 状態 | 変化 |\n|------|------|\n| Default | 未選択時はプレースホルダー（`text-[#a1afc0]`） |\n| Hover | `hover:border-[#a1afc0]` |\n| Focus / Open | `focus-visible:ring-2 ring-primary-700/20 border-primary-700` |\n| Error | `border-[#e93766] ring-2 ring-[#e93766]/20` + エラーメッセージ |\n| Disabled | `opacity-50 cursor-not-allowed` |\n\n**日付セル状態**\n\n| 状態 | 背景 | テキスト |\n|------|------|----------|\n| Default（今月・平日） | `bg-white` | `#3e5062` |\n| Default（今月・日曜） | `bg-white` | `#e93766` |\n| Default（今月・土曜） | `bg-white` | `#2661cf` |\n| Hover / Press（今月） | `#f7f9fb` / `#dde3eb` | 同上 |\n| Selected | `#f0f7fe`（hover `#ddedfc` / press `#c2e0fb`） | `#2661cf` |\n| Today（未選択） | Default に準拠 | `#3e5062` bold + 下線インジケーター（`#3e5062`） |\n| Today（選択済み） | `#f0f7fe` | `#2661cf` bold + 下線インジケーター（`#2661cf`） |\n| 他月 | `bg-white` | `#a1afc0`（クリック不可） |\n| Disabled | `#edf0f3` | `#c4cdd9` |\n| Focus | Selected/Default BG | + FocusRing（`absolute inset-[-3px] border-2 border-[#2661cf]`） |\n\n---\n\n## 3. サイズ / Anatomy\n\n| パーツ | 寸法 / class |\n|--------|------|\n| Trigger | `w-full h-[36px] px-3 rounded border border-[#c4cdd9]`（`h-10`/`py-2` 禁止） |\n| Calendar Icon（左） | `w-4 h-4 text-[#5a6c7f]`（Lucide calendar） |\n| Trigger Text | `flex-1 text-[14px] font-medium tracking-[0.28px]`（選択済 `#081a27` / 未選択 `#a1afc0`） |\n| Chevron（右） | `w-4 h-4 text-[#5a6c7f]`（chevron-down） |\n| Popup | `absolute mt-1 w-[312px] rounded-[4px] border border-[#c4cdd9] p-[16px] z-20` + 指定 shadow |\n| Day Cell | `w-[40px] h-[32px] rounded-[3px]` テキスト `text-[14px]`（Today `font-bold`） |\n| Nav Button | `w-[28px] h-[28px] rounded-[2px] hover:bg-[#edf0f3] active:bg-[#dde3eb]` |\n\n**Anatomy**: Trigger + Hidden Input（`type=\"hidden\"`、フォーム送信用）+ Calendar Popup（Month Header〔前年/前月/年月ラベル/次月/次年〕+ Day-of-Week Header〔日〜土〕+ Day Grid）。Popup shadow: `shadow-[0px_4px_10px_0px_rgba(10,10,10,0.1),0px_2px_5px_0px_rgba(10,10,10,0.05)]`。\n\n---\n\n## 4. Composition Rules\n\n許可: Trigger 上に `<label>` / Hidden Input / Popup 内のカレンダー構造。\n禁止: `<input type=\"date\">` のネイティブ表示 / Selected セルに `bg-primary-500 text-white` 等の塗りつぶし（→ `bg-[#f0f7fe]`）/ MonthHeader を2ボタン（前月/次月のみ）にすること（前年/次年も必須）/ 曜日ヘッダーの省略 / キーボードナビ省略。\n配置: 年月ラベルは「N月　YYYY」全角スペース区切り。曜日カラーは日=赤 / 土=青 / 月〜金=グレー。\n\n---\n\n## 5. Layout & Spacing\n\n- Popup 幅 `w-[312px]`（`w-[320px]` 禁止）、内側 `p-[16px]`\n- Month Header `pb-[12px]`、Day-of-Week Header `h-[32px] w-[280px]`、Day Grid `w-[280px]`\n- 各週 `flex items-start`、各セル `w-[40px] h-[32px]`\n- Today インジケーター `absolute bottom-[4px] left-[4px] right-[4px] h-[2px]`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| トリガー / Popup ボーダー | `color.border.default`(#c4cdd9) |\n| フォーカスボーダー | `color.border.focus`(#2661cf = primary-700) |\n| トリガーアイコン | `color.content.secondary`(#5a6c7f) |\n| 日曜テキスト / エラー | `color.semantic.error`(#e93766) |\n| 土曜・選択テキスト | `color.primary.700`(#2661cf) |\n| 平日テキスト | `#3e5062`（content 補助） |\n| Selected 背景 / hover / press | `color.primary.50`(#f0f7fe) / `#ddedfc`(primary-100) / `color.primary.200`(#c2e0fb) |\n| 他月テキスト | `color.content.disabled`(#a1afc0) |\n| Disabled 背景 / テキスト | `color.surface.sunken`(#edf0f3) / `color.border.default`(#c4cdd9) |\n| Popup shadow | `elevation.shadow.md` 近傍（指定値を使用） |\n| z-index | `elevation.z.dropdown`(20) |\n| 角丸（Popup / セル / Nav） | `radius.sm` 近傍（`rounded-[4px]` / `rounded-[3px]` / `rounded-[2px]`） |\n\n---\n\n## 7. Accessibility\n- Trigger: `role=\"combobox\" aria-haspopup=\"dialog\" aria-expanded` + `aria-controls`\n- Popup: `role=\"dialog\" aria-label=\"カレンダー\"` / Week Row `role=\"row\"` / Day Cell `role=\"gridcell\"` + `tabindex`（フォーカス対象のみ）\n- Selected: `aria-selected=\"true\"` / Today: `aria-current=\"date\"` / Disabled: `aria-disabled=\"true\"`\n- Nav ボタン: `aria-label=\"前の年/前の月/次の月/次の年\"`\n- Trigger 上に `<label>`（`for` で関連付け）\n- キーボード: Enter/Space（開閉・選択）、Escape（閉じてトリガーへ）、Arrow（前日/翌日/前週/翌週）、PageUp/PageDown（前月/翌月）\n\n## 8. Content Guidelines\n- プレースホルダーは「日付を選択」\n- 表示・格納は `YYYY-MM-DD` 固定\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: トリガー（calendar アイコン + プレースホルダー + chevron） -->\n<div class=\"relative\" id=\"dp-wrapper\">\n  <label for=\"dp-trigger\" class=\"block text-[14px] font-medium text-[#081a27] tracking-[0.28px] mb-1 leading-normal\">日付</label>\n  <button id=\"dp-trigger\" type=\"button\" role=\"combobox\" aria-haspopup=\"dialog\" aria-expanded=\"false\" aria-controls=\"dp-popup\"\n    onclick=\"toggleDatePicker()\"\n    class=\"w-full flex items-center gap-2 rounded border border-[#c4cdd9] bg-white px-3 h-[36px] hover:border-[#a1afc0] transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700/20 focus-visible:border-primary-700\">\n    <svg class=\"w-4 h-4 text-[#5a6c7f] flex-shrink-0\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\" ry=\"2\"/><line x1=\"16\" x2=\"16\" y1=\"2\" y2=\"6\"/><line x1=\"8\" x2=\"8\" y1=\"2\" y2=\"6\"/><line x1=\"3\" x2=\"21\" y1=\"10\" y2=\"10\"/>\n    </svg>\n    <span id=\"dp-display\" class=\"flex-1 text-left text-[14px] font-medium tracking-[0.28px] text-[#a1afc0]\">日付を選択</span>\n    <svg class=\"w-4 h-4 text-[#5a6c7f] flex-shrink-0\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"/></svg>\n  </button>\n  <input type=\"hidden\" id=\"dp-value\" name=\"date\" value=\"\">\n  <!-- Popup: Month Header（前年/前月/年月/次月/次年）+ 曜日ヘッダー（日=赤・土=青）+ Day Grid -->\n</div>\n```\n\n> Day Grid と開閉/矢印キーナビは JS で描画する。年月ラベルは `(month+1) + '月　' + year`、ISO 値生成は `year-MM-DD`、Selected セル `bg-[#f0f7fe]`、Today は `font-bold` + 2px 下線インジケーター。\n\n**Don't**: `rounded-xl`/`rounded-lg` を Popup に（→ `rounded-[4px]`）/ `w-[320px]`（→ `w-[312px]`）/ キーボードナビ省略 / `aria-selected` 省略 / Today インジケーター省略 / トリガー `h-10`/`py-2`（→ `h-[36px]`）/ Selected セルの塗りつぶし。\n\n---\n\n## 10. Implementation Notes\n- アイコンは Lucide: calendar（トリガー）/ chevron-left・chevron-right（月送り）/ chevrons-left・chevrons-right（年送り）。stroke ベース\n- 外部クリック・Escape で閉じる。開いたら selected → today → 最初の有効セルの順でフォーカス\n- トークン参照は `guidelines/TOKEN_GUIDE.md`。フォーム全体は `Form.md`、トリガーは Text field のスタイル体系を参照\n", "base/form/Chip.md": "# Component Guideline: Chip\n\n> NestUI Chip 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` / slate スケール等）を正とし、以下の class はその適用例。選択操作型（Form / Filter）とファイル添付型（File Chip）を含む。\n\n## 1. Component Identity\n- **Name**: Chip\n- **Variants**: Form Chip（複数/単一）/ Filter Chip（複数/単一）/ File Chip（ファイル添付）\n- **Responsibility**:\n  - する: 選択肢・フィルター条件のオン/オフ切り替え（Form/Filter）、ファイル添付の表示と操作（File）\n  - しない: 読み取り専用ステータス表示（→ Badge）、削除可能なメタデータ表示（→ Tag）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 選択操作を内包する（複数=チェックボックス / 単一=ラジオのセマンティクス）/ use case で2種類（`Form`=フォーム内選択肢、`Filter`=一覧の絞り込み）/ Tag・Badge と混同しない / 状態は border-color・背景・アイコンで伝達（アイコン省略可は Filter 複数選択のみ）。\n\n---\n\n## 2. Variants & States\n\n**選択操作型 Variants**\n\n| use case | シーン | 複数選択 | 単一選択 |\n|----------|--------|----------|----------|\n| **Form** | フォーム内の選択肢（物件条件・希望タグ等） | チェックボックスアイコン内蔵 | ラジオアイコン内蔵 |\n| **Filter** | 一覧画面の絞り込み条件 | アイコンなし（bg/border のみ） | ラジオアイコン内蔵 |\n\n**選択操作型 States**（Form/Filter 共通スタイル）\n\n| State | Unselected | Selected |\n|-------|-----------|---------|\n| Default | `bg-white border-slate-300 text-slate-600` | `bg-primary-50 border-primary-700 text-primary-700` |\n| Hover | `hover:bg-primary-50` | `hover:bg-[#ddedfc]` |\n| Active | `active:bg-[#ddedfc]` | `active:bg-[#c2e0fb]` |\n| Focus | `focus-visible:ring-2 ring-primary-700 ring-offset-1` | 同左 |\n| Disabled | `bg-white border-slate-200 text-slate-300 cursor-not-allowed` + `aria-disabled=\"true\"` `tabindex=\"-1\"` | — |\n\n**File Chip States**\n\n| State | 背景 | アイコン背景 | テキスト |\n|-------|------|------------|---------|\n| Enable | `bg-white cursor-pointer` | `bg-[#5a6c7f]` | `text-[#081a27]` |\n| Hover | `bg-[#edf0f3]` | `bg-[#5a6c7f]` | `text-[#081a27]` |\n| Pressed | `bg-[#c4cdd9]` | `bg-[#5a6c7f]` | `text-[#081a27]` |\n| Disabled | `bg-white cursor-not-allowed` + `aria-disabled=\"true\"` | `bg-[#c4cdd9]` | `text-[#a1afc0]` |\n\n> File Chip の Media Container（画像プレビュー）は **Enable 状態のみ** 表示。Delete/More ボタンは Disabled でも表示するが操作不能（`<span>` に置換 + `aria-hidden`）。\n\n---\n\n## 3. サイズ / Anatomy\n\n**選択操作型**: `h-6 rounded-full border text-xs font-medium tracking-[0.24px] inline-flex items-center transition-colors`\n- アイコンあり（Form 全種・Filter 単一）: `pl-1 pr-2 gap-1` + アイコン `w-3.5 h-3.5 shrink-0`\n- アイコンなし（Filter 複数）: `px-2`\n\n**File Chip**: `border border-[#dde3eb] rounded-[8px] p-2 flex flex-col gap-3`（例 `w-[374px]`）。SummaryIcon `size-9 rounded-[8px]`、Title `text-[14px] font-bold leading-[1.5] truncate`、More/Delete `w-4 h-4`、Media Container `h-[216px]`（セパレーター + 画像）。\n\n**Anatomy（選択操作型）**: Container + Icon（チェックボックス/ラジオ SVG）+ Label Text。\n**Anatomy（File Chip）**: Container + SummaryIcon（36×36）+ Title（truncate）+ More Button（任意）+ Delete Button（任意）+ Media Container（任意・Enable のみ）。\n\n---\n\n## 4. Composition Rules\n\n許可（選択操作型）: アイコン SVG（14×14）+ ラベルテキスト。グループは `role` 付きラッパーで囲む。\n許可（File Chip）: SummaryIcon + Title + More/Delete ボタン + Media（画像）。\n禁止: `aria-checked`/`aria-selected` の省略 / Filter 複数選択以外でアイコンを省略 / Badge・Tag と混同 / Disabled に `cursor-pointer`（→ `cursor-not-allowed`）/ File Chip の Media を Hover/Pressed/Disabled で表示。\n振る舞い: 複数=同時に複数 Active / 単一=排他制御。Click/Enter/Space で切替、Arrow Left/Right でグループ内移動（単一は移動と同時に選択変更）。\n\n---\n\n## 5. Layout & Spacing\n\n- グループラッパー: `flex flex-wrap gap-1.5`\n- File Chip 内部: Header `flex gap-3 items-center`、Media `flex flex-col gap-2`（セパレーター `py-1` の中に `h-px bg-[#c4cdd9]`）\n- 角丸: 選択操作型 `rounded-full` / File Chip `rounded-[8px]`（内部画像 `rounded-[4px]`）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| Selected ボーダー・テキスト | `color.primary.700` |\n| Selected 背景 / hover / active | `color.primary.50` / `#ddedfc`(primary-100) / `color.primary.200`(#c2e0fb) |\n| Unselected ボーダー / 背景 | slate-300（`color.border.default` 近傍）/ `color.surface.input`(white) |\n| Disabled ボーダー / テキスト | slate-200（`color.border.subtle` 近傍）/ slate-300 |\n| アイコン（未選択/選択） | `#c4cdd9`(`color.border.default`) / `#2661cf`(primary-700) |\n| File Chip ボーダー | `color.border.subtle`(#dde3eb) |\n| File Chip アイコン背景（Enable/Disabled） | `#5a6c7f`(`color.content.secondary`) / `#c4cdd9`(`color.border.default`) |\n| File Chip Title（Enable/Disabled） | `color.content.primary`(#081a27) / `color.content.disabled`(#a1afc0) |\n| File Chip hover / pressed 背景 | `color.surface.sunken`(#edf0f3) / `color.border.default`(#c4cdd9) |\n| focus ring | `color.border.focus`(= primary-700) |\n\n---\n\n## 7. Accessibility\n\n| use case | コンテナ role | 各チップ role | 選択状態属性 |\n|----------|--------------|--------------|-------------|\n| Form 複数 | `group` + `aria-label` | `checkbox` | `aria-checked` |\n| Form 単一 | `radiogroup` + `aria-label` | `radio` | `aria-checked` |\n| Filter 複数 | `listbox` + `aria-multiselectable=\"true\"` | `option` | `aria-selected` |\n| Filter 単一 | `listbox` + `aria-multiselectable=\"false\"` | `option` | `aria-selected` |\n| File Chip | — | Container `role=\"article\"` | Disabled は `aria-disabled=\"true\"` |\n\n- 色だけで状態を伝達しない（アイコン併用。Filter 複数のみ bg/border で区別）\n- Disabled チップは `aria-disabled=\"true\"` + `tabindex=\"-1\"`\n- File Chip ボタンは `aria-label`（「その他のオプション」「削除」）、画像は `alt`、Disabled ボタンは `<span aria-hidden>` に置換\n- `prefers-reduced-motion` でトランジション停止\n\n## 8. Content Guidelines\n- ラベルは選択肢・条件を端的に\n- グループ `aria-label` で何の選択かを明示（「物件種別」「カテゴリ」）\n- File Chip の Title はファイル名（truncate、`font-feature-settings: 'pwid' 1`）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Form Chip 複数選択（チェックボックス内蔵・Selected） -->\n<button type=\"button\" role=\"checkbox\" aria-checked=\"true\"\n  class=\"h-6 pl-1 pr-2 inline-flex items-center gap-1 rounded-full border border-primary-700 bg-primary-50 text-primary-700 text-xs font-medium tracking-[0.24px]\n         hover:bg-[#ddedfc] active:bg-[#c2e0fb] transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">\n  <svg class=\"chip-icon w-3.5 h-3.5 shrink-0\" viewBox=\"0 0 14 14\" fill=\"none\">\n    <rect width=\"14\" height=\"14\" rx=\"2\" fill=\"#2661CF\"/><path d=\"M3 7l2.5 2.5L11 5\" stroke=\"white\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n  </svg>\n  ラベル\n</button>\n\n<!-- Do: Filter Chip 複数選択（アイコンなし・Unselected） -->\n<button type=\"button\" role=\"option\" aria-selected=\"false\"\n  class=\"h-6 px-2 inline-flex items-center rounded-full border border-slate-300 bg-white text-slate-600 text-xs font-medium tracking-[0.24px]\n         hover:bg-primary-50 active:bg-[#ddedfc] transition-colors cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">ラベル</button>\n\n<!-- Do: グループラッパー -->\n<div role=\"group\" aria-label=\"物件種別\" class=\"flex flex-wrap gap-1.5\"><!-- Form Multi チップ --></div>\n<div role=\"listbox\" aria-label=\"カテゴリ\" aria-multiselectable=\"true\" class=\"flex flex-wrap gap-1.5\"><!-- Filter Multi チップ --></div>\n\n<!-- Do: File Chip（Enable・メディア + ボタンあり） -->\n<div class=\"border border-[#dde3eb] rounded-[8px] p-2 flex flex-col gap-3 bg-white cursor-pointer hover:bg-[#edf0f3] active:bg-[#c4cdd9] transition-colors w-[374px]\" role=\"article\">\n  <div class=\"flex gap-3 items-center w-full\">\n    <div class=\"bg-[#5a6c7f] rounded-[8px] size-9 shrink-0 flex items-center justify-center overflow-hidden\">\n      <svg class=\"w-5 h-5 text-white\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\">\n        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M13.5 3H6.5A1.5 1.5 0 005 4.5v11A1.5 1.5 0 006.5 17h7A1.5 1.5 0 0015 15.5V6.5L13.5 3z\"/>\n        <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M13 3v3.5H15.5\"/>\n      </svg>\n    </div>\n    <p class=\"flex-1 text-[14px] font-bold text-[#081a27] leading-[1.5] truncate min-w-0\" style=\"font-feature-settings: 'pwid' 1\">ファイル名が入ります.pdf</p>\n    <button type=\"button\" aria-label=\"その他のオプション\" class=\"w-4 h-4 shrink-0 text-[#5a6c7f] hover:text-[#081a27] flex items-center justify-center rounded-sm focus-visible:ring-2 focus-visible:ring-primary-700\">\n      <svg class=\"w-4 h-4\" viewBox=\"0 0 16 16\" fill=\"currentColor\"><circle cx=\"3\" cy=\"8\" r=\"1.5\"/><circle cx=\"8\" cy=\"8\" r=\"1.5\"/><circle cx=\"13\" cy=\"8\" r=\"1.5\"/></svg>\n    </button>\n    <button type=\"button\" aria-label=\"削除\" class=\"w-4 h-4 shrink-0 text-[#5a6c7f] hover:text-[#081a27] flex items-center justify-center rounded-sm focus-visible:ring-2 focus-visible:ring-primary-700\">\n      <svg class=\"w-4 h-4\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"8\" cy=\"8\" r=\"6.25\"/><path stroke-linecap=\"round\" d=\"M5.5 5.5l5 5M10.5 5.5l-5 5\"/></svg>\n    </button>\n  </div>\n  <!-- Media Container（Enable のみ） -->\n  <div class=\"flex flex-col gap-2 h-[216px]\">\n    <div class=\"py-1\"><div class=\"h-px bg-[#c4cdd9]\" role=\"separator\"></div></div>\n    <div class=\"flex-1 flex flex-col min-h-0\"><img src=\"...\" alt=\"ファイルプレビュー\" class=\"w-full h-full object-cover rounded-[4px]\"></div>\n  </div>\n</div>\n```\n\n> アイコン SVG（14×14）: チェックボックス（未選択 `<rect stroke=\"#c4cdd9\">` / 選択 `<rect fill=\"#2661CF\">` + チェック）、ラジオ（未選択 `<circle stroke=\"#c4cdd9\">` / 選択 `<circle stroke=\"#2661CF\">` + 内側 `<circle fill=\"#2661CF\">`）。\n\n**Don't**: `aria-checked`/`aria-selected` 省略 / Filter 複数以外でアイコン省略 / Badge・Tag と混同 / Disabled に `cursor-pointer` / File Chip の Media を Enable 以外で表示 / SummaryIcon 背景を Enable/Disabled で固定。\n\n---\n\n## 10. Implementation Notes\n- Tag（削除可能メタデータ）・Badge（読み取り専用ステータス）とは別物。選択のオン/オフは Chip\n- Filter Chip はフィルタートリガー・ドロップダウンと組み合わせる（一覧の絞り込み）\n- トークン参照は `guidelines/TOKEN_GUIDE.md`\n", "base/form/Copy button.md": "# Component Guideline: Copy button\n\n> NestUI Copy Button 仕様。Tailwind CSS + 専用 CSS。クリップボードコピー + アイコン切替アニメーション付きのアイコンボタン。値は `tokens/`（色は `color.border.*` 等）を正とし、以下の class / CSS はその適用例。\n\n## 1. Component Identity\n- **Name**: Copy button\n- **Variants**: Outlined / Subtle\n- **Responsibility**:\n  - する: クリップボードへコピーし、アイコン切替で成功を即時フィードバックする（トースト不要の軽量フィードバック）\n  - しない: ラベル付きアクションボタン（→ Buttons）、ナビゲーション\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 即時フィードバック（アイコン切替で成功を伝える。トースト不要）/ バネ感（`cubic-bezier(0.175,0.885,0.32,1.275)` のオーバーシュートで「ポンッ」）/ 自動復帰（2秒後にデフォルトへ。追加操作不要）/ アイコンのみ（`aria-label` 必須）。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | Container | ボーダー | 用途 |\n|---------|-----------|---------|------|\n| Outlined | `bg-white` | `border border-slate-200` | カード内、明るい背景上 |\n| Subtle | `bg-transparent` | なし | ツールバー、コードブロック上 |\n\n**States**\n\n| 状態 | 視覚変化 | Duration / Easing |\n|------|---------|-------------------|\n| Default | Copy アイコン表示 | — |\n| Hover | `scale(1.05)` + `bg-slate-50` | 250ms `cubic-bezier(0.175,0.885,0.32,1.275)` |\n| Active | `scale(0.9)` | 100ms `ease-out` |\n| Copied | Copy→Check アイコン切替（pop: opacity + scale 同時遷移） | 180ms `cubic-bezier(0.175,0.885,0.32,1.275)` |\n| 復帰 | Check→Copy 切替 | 180ms（2秒後に自動実行） |\n| Focus | `focus-visible:ring-2 ring-primary-700 ring-offset-1` | — |\n\n> 状態遷移: `Default → Hover(1.05) → Active(0.9) → Copied(swap) → Default(2s後)`。`.copied` クラスの付け外しで制御。\n\n---\n\n## 3. サイズ / Anatomy\n\n| サイズ | Container | アイコン | 角丸 | パディング | 用途 |\n|--------|-----------|---------|------|-----------|------|\n| Large | 48×48px | `w-6 h-6` | `rounded-2xl` | `p-3` | 単体デモ・ヒーロー |\n| Medium（既定） | 40×40px | `w-5 h-5` | `rounded-xl` | `p-2.5` | コードブロックヘッダー |\n| Small | 32×32px | `w-4 h-4` | `rounded-lg` | `p-2` | テーブルセル・コンパクト |\n\n**Anatomy**: Container（hover/active の transform を受ける）+ Copy Icon（デフォルト表示）+ Check Icon（完了時に pop。`position:absolute` で重ねる）。\n\n---\n\n## 4. Composition Rules\n\n許可: Copy アイコン SVG + Check アイコン SVG（2つを `position:absolute` で重ねる）。\n禁止: `aria-label` の省略 / コピー完了フィードバックなし（アイコン切替を省略しない）/ 復帰タイマーの省略（必ず自動で元に戻す）。\n配置: コードブロック上では `absolute top-3 right-3` + Subtle で配置。\n\n---\n\n## 5. Layout & Spacing\n\n- Container: `inline-flex items-center justify-center relative`\n- サイズは 32/40/48px の正方形（上表）\n- コードブロック内: `absolute top-3 right-3`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| Outlined 背景 / ボーダー | `color.surface.input`(white) / slate-200（`color.border.subtle` 近傍） |\n| hover 背景 | slate-50（`color.surface.base` 近傍） |\n| focus ring | `color.border.focus`(= primary-700) |\n| アイコン | currentColor（配置先の文字色に追従） |\n| 角丸 | `radius.lg`〜`xl`（Medium `rounded-xl`） |\n| アニメーション | `motion.duration.*` 近傍（250ms/100ms/180ms）+ オーバーシュート easing |\n\n---\n\n## 7. Accessibility\n- `aria-label=\"コピー\"` 必須（アイコンのみボタン）\n- コピー完了時に `aria-label` を `\"コピーしました\"` に更新し、2秒後に戻す\n- フォーカスリング: `focus-visible:ring-2 ring-primary-700 ring-offset-1`\n- `prefers-reduced-motion: reduce` 時は `scale` アニメーションを無効化し、`opacity` 切替のみにする\n\n## 8. Content Guidelines\n- ラベル文言（`aria-label`）: 既定「コピー」→ 完了「コピーしました」\n- コピー対象が明確になるよう近接配置（共有URL・APIキー・コードブロック等）\n\n## 9. Usage Do / Don't\n\n```css\n.copy-button{ display:inline-flex; align-items:center; justify-content:center; position:relative;\n  background:#fff; border:1px solid #e2e8f0; border-radius:.75rem; width:40px; height:40px; cursor:pointer;\n  transition:transform .25s cubic-bezier(0.175,0.885,0.32,1.275); }\n.copy-button:hover{ transform:scale(1.05); background:#f8fafc; }\n.copy-button:active{ transform:scale(0.9); transition:transform .1s ease-out; }\n.copy-button:focus-visible{ outline:none; box-shadow:0 0 0 2px rgba(38,97,207,.5); } /* ring = primary-700 */\n.copy-button .cb-icon{ position:absolute; transition:opacity .18s ease, transform .18s cubic-bezier(0.175,0.885,0.32,1.275); }\n.copy-button .cb-icon-copy{ opacity:1; transform:scale(1); }\n.copy-button .cb-icon-check{ opacity:0; transform:scale(0.5); }\n.copy-button.copied .cb-icon-copy{ opacity:0; transform:scale(0.5); }\n.copy-button.copied .cb-icon-check{ opacity:1; transform:scale(1); }\n@media (prefers-reduced-motion: reduce){\n  .copy-button, .copy-button .cb-icon{ transition-duration:.01ms; }\n  .copy-button:hover, .copy-button:active{ transform:none; }\n}\n```\n\n```html\n<!-- Do: Medium（Outlined）— Copy/Check の2 SVG を重ねる -->\n<button class=\"copy-button\" aria-label=\"コピー\" id=\"copyBtn\">\n  <svg class=\"cb-icon cb-icon-copy w-5 h-5\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <rect x=\"3\" y=\"3\" width=\"13\" height=\"13\" rx=\"2.5\" ry=\"2.5\"></rect><path d=\"M8 21h11a2 2 0 0 0 2-2v-11\"></path>\n  </svg>\n  <svg class=\"cb-icon cb-icon-check w-5 h-5\" viewBox=\"0 0 24 24\">\n    <circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"currentColor\" opacity=\"0.15\"/>\n    <polyline points=\"7 12.5 10.5 16 17 9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n  </svg>\n</button>\n\n<!-- Do: コピー挙動（成功で .copied 付与 → 2秒後に解除） -->\n<script>\nconst btn = document.getElementById('copyBtn'); let timer;\nbtn.addEventListener('click', () => {\n  navigator.clipboard.writeText('対象テキスト').catch(() => {});\n  btn.classList.add('copied'); btn.setAttribute('aria-label','コピーしました');\n  clearTimeout(timer);\n  timer = setTimeout(() => { btn.classList.remove('copied'); btn.setAttribute('aria-label','コピー'); }, 2000);\n});\n<\/script>\n```\n\n**Don't**: `aria-label` 省略 / コピー成功のフィードバックなし（チェックアイコン切替必須）/ 復帰タイマーの省略（2秒後に戻す）/ `focus-visible:ring-primary-500/50`（→ `ring-primary-700 ring-offset-1`）。\n\n---\n\n## 10. Implementation Notes\n- 2つの SVG を `position:absolute` で重ね、`opacity` + `scale` の同時遷移で pop を実現\n- CopyTextField の右端ボタンとしても使う（→ `Text field.md`）\n- アイコンは Lucide（copy / check）\n- トークン参照は `guidelines/TOKEN_GUIDE.md`\n", "base/form/Form.md": "# Component Guideline: Form\n\n## 1. Component Identity\n- **Name**: Form / FormField\n- **Variants**: `vertical`（デフォルト）/ `horizontal`\n- **Responsibility**:\n  - する: フォームフィールドのラベル・バリデーション状態・エラーメッセージ・必須/任意表示を統一管理する\n  - しない: 個々の入力コントロール（各 Input / Checkbox / Select が責任を持つ）\n- **Target Platform**: デスクトップ Web アプリ\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 |\n|---------|------|\n| `vertical` | ラベルが上、フィールドが下（デフォルト）。フォーム全体に統一感 |\n| `horizontal` | ラベルが左、フィールドが右。設定画面・詳細編集など |\n\n**States**\n\n| State | 変化するプロパティ |\n|-------|-----------------|\n| default | 通常表示 |\n| error | フィールドボーダー: `color.semantic.error`、エラーテキスト表示 |\n| success | フィールドボーダー: `color.semantic.success`、成功テキスト表示 |\n| warning | フィールドボーダー: `color.semantic.warning`、警告テキスト表示 |\n| disabled | フィールドとラベルの `opacity: 0.4` |\n\n---\n\n## 3. Props / API\n\n**Form**\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `onSubmit` | `(values: Record<string, any>) => void` | — | — | フォーム送信ハンドラ |\n| `layout` | `'vertical' \\| 'horizontal'` | `'vertical'` | — | レイアウト方向 |\n\n**FormField**\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `label` | `string` | — | ✓ | フィールドラベル |\n| `name` | `string` | — | ✓ | フィールド名（フォーム値のキー） |\n| `isRequired` | `boolean` | `false` | — | 必須フィールド |\n| `isOptional` | `boolean` | `false` | — | 任意ラベルを表示 |\n| `helperText` | `string` | — | — | 補足テキスト（フィールド下部） |\n| `errorText` | `string` | — | — | エラーメッセージ |\n| `successText` | `string` | — | — | 成功メッセージ |\n| `warningText` | `string` | — | — | 警告メッセージ |\n| `status` | `'default' \\| 'error' \\| 'success' \\| 'warning'` | `'default'` | — | バリデーション状態 |\n\n**Event Handlers**\n- `onSubmit(values)`: フォーム送信\n\n---\n\n## 4. Composition Rules\n\n**許可する子要素**（FormField 内）\n- `<Input>`, `<InputNumber>`, `<Dropdown>`, `<Checkbox>`, `<Radio>`, `<Toggle>`, `<DatePicker>`, `<SearchBar>`\n\n**禁止する子要素**\n- `<FormField>` 内に別の `<FormField>` を入れる（フィールドの入れ子）\n\n**Anti-patterns**\n- NG: 独自のラベルとエラー表示を各コンポーネントで実装する → FormField を必ず使う（統一感）\n- NG: 必須マーク（`*`）を FormField を使わずにラベルに直接書く\n- NG: `isRequired` と `isOptional` を同時に指定する\n\n---\n\n## 5. Layout & Spacing\n\n| プロパティ | トークン | 値 |\n|-----------|---------|-----|\n| フィールド間の gap (vertical) | `spacing.4` | 16px |\n| ラベル-フィールド gap (vertical) | `spacing.1` | 4px |\n| ラベル幅 (horizontal) | — | 160px（固定） |\n| helperText / errorText の padding-top | `spacing.1` | 4px |\n| フォーム padding | `spacing.6` | 24px |\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン | 値 |\n|------|---------|-----|\n| ラベルテキスト | `color.content.primary` | — |\n| 必須マーク (`*`) | `color.semantic.error` | — |\n| 任意テキスト | `color.content.secondary` | — |\n| helperText | `color.content.secondary` | — |\n| エラーテキスト | `color.semantic.error` | — |\n| 成功テキスト | `color.semantic.success` | — |\n| 警告テキスト | `color.semantic.warning` | — |\n\n---\n\n## 8. Accessibility\n\n- **Role**: `form`（フォームコンテナ）\n- **必須ARIA属性**:\n  - フォーム: `aria-label=\"[フォーム名]\"` または `aria-labelledby`\n  - FormField: `<label for=\"[input-id]\">` で input と紐付け\n  - エラー時: input に `aria-invalid=\"true\"`, `aria-describedby=\"[error-id]\"`\n  - 必須フィールド: `aria-required=\"true\"`\n- **キーボード操作**:\n  - `Tab`: フィールド間フォーカス移動\n  - `Enter`（フォーカスがボタン以外の時）: フォーム送信を防ぐ（`type=\"submit\"` のボタンのみ送信）\n- **コントラスト比**: ラベル・エラーテキスト 4.5:1 以上\n\n---\n\n## 9. Content Guidelines\n\n- 必須フィールドは `isRequired` で `*` マークを自動付与（ラベルに直書きしない）\n- すべてのフィールドが必須の場合、「すべて必須」をフォームの冒頭に記載する方が読みやすい\n- エラーテキストはユーザーが修正できる具体的な内容にする（「必須項目です」より「プロジェクト名を入力してください」）\n\n---\n\n## 10. Usage Do / Don't\n\n**Do**\n```tsx\n<Form onSubmit={handleSubmit} layout=\"vertical\">\n  <FormField\n    label=\"プロジェクト名\"\n    name=\"projectName\"\n    isRequired\n    status={errors.projectName ? 'error' : 'default'}\n    errorText={errors.projectName}\n  >\n    <Input placeholder=\"例: my-api-service\" />\n  </FormField>\n\n  <FormField\n    label=\"説明\"\n    name=\"description\"\n    isOptional\n    helperText=\"プロジェクトの目的を簡潔に記述してください\"\n  >\n    <Textarea />\n  </FormField>\n</Form>\n```\n\n**Don't**\n```tsx\n// NG: FormField を使わず独自ラベル・エラー表示を実装する\n<div>\n  <label>プロジェクト名 <span style={{ color: 'red' }}>*</span></label>\n  <Input />\n  <span style={{ color: 'red' }}>必須です</span>\n</div>\n```\n\n---\n\n## 11. Implementation Notes\n\n- バリデーションライブラリ（react-hook-form, zod など）と組み合わせる場合、`status` と `errorText` を外部から制御\n- `onSubmit` 前に HTML5 バリデーション（`required` 属性）を防いで独自バリデーションを走らせる\n- テストチェックリスト:\n  - [ ] 必須フィールドの `aria-required` 確認\n  - [ ] エラー時の `aria-invalid` と `aria-describedby` 確認\n  - [ ] Tab キーでのフィールド間移動確認\n  - [ ] エラーメッセージが視覚的に明確であること\n\n---\n\n## 12. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n", "base/form/Search Bar.md": "# Component Guideline: Search Bar\n\n## 1. Component Identity\n- **Name**: Search Bar\n- **Variants**: `default` / `inline`\n- **Responsibility**:\n  - する: テキストキーワードによる検索・フィルタリングの入力を提供する\n  - しない: フォームの一般的なテキスト入力（Inputを使う）・フィルタチップの管理（Filter Groupを使う）\n- **Target Platform**: デスクトップ Web アプリ\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 |\n|---------|------|\n| `default` | Navbar や検索専用エリアに配置。フルボーダー付き |\n| `inline` | テーブルやリストの上部に配置。コンパクトな見た目 |\n\n**States**\n\n| State | 変化するプロパティ |\n|-------|-----------------|\n| default (empty) | 虫眼鏡アイコン + placeholder 表示 |\n| hover | ボーダー: `color.content.secondary` |\n| focus | ボーダー: `color.border.focus`、`outline: 2px solid color.border.focus` |\n| has-value | クリアボタン（×）表示 |\n| loading | スピナー表示（検索処理中） |\n| disabled | `opacity: 0.4`、`cursor: not-allowed` |\n\n---\n\n## 3. Props / API\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `value` | `string` | — | — | 入力値（制御） |\n| `defaultValue` | `string` | `''` | — | 初期値（非制御） |\n| `placeholder` | `string` | `'検索...'` | — | プレースホルダー |\n| `variant` | `'default' \\| 'inline'` | `'default'` | — | バリアント |\n| `isLoading` | `boolean` | `false` | — | 検索処理中のローディング |\n| `isDisabled` | `boolean` | `false` | — | 非活性 |\n| `debounceMs` | `number` | `300` | — | debounce 遅延（ms）。0 で無効 |\n| `onChange` | `(value: string) => void` | — | — | 入力変更（debounce済み） |\n| `onSearch` | `(value: string) => void` | — | — | Enter キーで即時実行 |\n| `onClear` | `() => void` | — | — | クリアボタンクリック |\n\n**Event Handlers**\n- `onChange(value: string)`: debounce 後の値変更\n- `onSearch(value: string)`: Enter キーでの即時検索\n- `onClear()`: クリアボタン\n\n---\n\n## 4. Composition Rules\n\n**許可する子要素**\n- なし（props のみで制御）\n\n**Anti-patterns**\n- NG: `debounceMs=0` にして毎キーストロークで API コールする → サーバー負荷。300ms 以上を推奨\n- NG: Search Bar をフォームの一般的な入力フィールドとして使う → Input を使う\n\n---\n\n## 5. Layout & Spacing\n\n| プロパティ | トークン | 値 |\n|-----------|---------|-----|\n| padding (vertical) | `spacing.2` | 8px |\n| padding (horizontal) | `spacing.3` | 12px |\n| 左アイコン幅 | `spacing.4` + icon | 32px |\n| 右クリアボタン幅 | `spacing.4` + icon | 32px |\n| border-radius | `radius.md` | 8px |\n\n- 最小幅: 200px\n- 最大幅: コンテナに追従（Navbar 内では max-width: 480px 推奨）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン | 値 |\n|------|---------|-----|\n| 背景 | `color.surface.input` | — |\n| ボーダー | `color.border.default` | — |\n| フォーカスボーダー | `color.border.focus` | — |\n| placeholder | `color.content.disabled` | — |\n| テキスト | `color.content.primary` | — |\n| 虫眼鏡アイコン | `color.content.secondary` | — |\n| クリアボタン hover | `color.content.primary` | — |\n\n---\n\n## 8. Accessibility\n\n- **Role**: `searchbox`（または `role=\"search\"` の `<form>` 内に配置）\n- **必須ARIA属性**:\n  - `role=\"searchbox\"` または `type=\"search\"`\n  - `aria-label=\"検索\"` または `aria-labelledby`\n  - クリアボタン: `aria-label=\"検索をクリア\"`\n- **キーボード操作**:\n  - `Enter`: `onSearch` を即時実行\n  - `Escape`: 入力をクリアしてフォーカスを外す\n  - `Tab`: フォーカス移動\n- **コントラスト比**: テキスト・プレースホルダー 4.5:1 / 3:1 以上\n\n---\n\n## 9. Content Guidelines\n\n- placeholder は「検索...」または「[対象]を検索...」（例: 「プロジェクトを検索...」）\n- 検索対象が明確でない場合は placeholder で示す\n\n---\n\n## 10. Usage Do / Don't\n\n**Do**\n```tsx\n// debounce 付き（デフォルト 300ms）\n<SearchBar\n  value={query}\n  onChange={setQuery}\n  onSearch={handleSearch}\n  placeholder=\"プロジェクトを検索...\"\n/>\n\n// ローディング状態\n<SearchBar isLoading={isSearching} value={query} onChange={setQuery} />\n```\n\n**Don't**\n```tsx\n// NG: debounce なしで毎回 API コール\n<SearchBar debounceMs={0} onChange={fetchResults} />\n\n// NG: 一般的なフォーム入力に Search Bar を使う\n<SearchBar placeholder=\"ユーザー名\" onChange={setUsername} />\n```\n\n---\n\n## 11. Implementation Notes\n\n- debounce は内部で `useCallback` + `setTimeout` で実装（外部ライブラリ不要）\n- `onClear` 後は input にフォーカスを戻す\n- テストチェックリスト:\n  - [ ] debounce の動作確認（300ms 後に onChange が呼ばれること）\n  - [ ] Enter キーで onSearch が即時呼ばれること\n  - [ ] クリアボタンの表示/非表示切り替え確認\n\n---\n\n## 12. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n", "base/display/Card.md": "# Component Guideline: Card\n\n> NestUI Card 仕様。Tailwind CSS。値は `tokens/`（背景は `color.surface.*`、境界は `color.border.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Card\n- **Variants**: `static`（静的）/ `link`（リンク・カード全体クリック可）\n- **Responsibility**:\n  - する: 関連する情報を視覚的な境界（背景・ボーダー）でグループ化するコンテナを提供する\n  - しない: ページレベルのセクション分割（→ `Panel` / セクション見出し）、ダイアログ（→ `Modal`）、浮き上がる要素の格納\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: カードは関連情報をグループ化するコンテナ（境界で「まとまり」を明示）/ 1カード1コンテキスト（詰め込みすぎない・複数文脈は複数カードへ分割）/ 視覚的階層はタイトル → 説明 → アクションの順 / インタラクティブなカードのみ `hover:shadow-md` でクリック可能を暗示。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 | class（基本） |\n|---------|------|------|\n| `static` | 情報表示のみ（ダッシュボード・概要・メトリクス）。ホバー効果なし | `bg-white rounded-xl border border-slate-200 p-6 shadow-sm` |\n| `link` | カード全体がクリック可能。一覧から詳細への遷移 | `<a>` で全体を囲む + `block hover:shadow-md transition-shadow rounded-xl` |\n\n> `static` カード内に個別アクション（ボタン）を置く場合、ボタン側が個々のインタラクションを持つ（カード自体はホバーしない）。\n\n**States**\n\n| State | 変化 |\n|-------|------|\n| default | 背景 `bg-white`(`color.surface.raised`) + ボーダー `border-slate-200`(`color.border.default`) + `shadow-sm`(`elevation.shadow.sm`) |\n| hover（link のみ） | `hover:shadow-md` + `transition-shadow`（浮き上がり） |\n| active（link のみ） | さらにシャドウ変化（クリック中） |\n| focus（link のみ） | `<a>` のフォーカスリングを可視化（キーボード操作時） |\n\n> `static` カードに hover / active を付けない。色だけでカードの状態・種類を伝えない（アイコン・テキストを併用）。\n\n---\n\n## 3. パーツ / 解剖\n\n| パーツ | 役割 | 必須 | 適用例 |\n|--------|------|------|--------|\n| Container | カードの外枠。背景・ボーダー・シャドウで境界を示す | Yes | `bg-white rounded-xl border border-slate-200 p-6 shadow-sm` |\n| Image / Media | サムネイル・ビジュアル要素（上部） | No | `w-full h-48 object-cover`（`alt` 必須） |\n| Title | カードの主題 | Yes | `text-lg font-bold text-slate-900` |\n| Description | 補足説明文 | No | `mt-2 text-sm text-body` |\n| Meta | 日付・カテゴリ・著者などのメタ情報 | No | `text-sm text-body` |\n| Footer / Actions | ボタン・リンクなどの操作 | No | `px-6 py-3 border-t border-slate-200 flex justify-end gap-3` |\n\n```\n┌──────────────────────────────────┐\n│ [Image / Media]                   │  ← Optional（メディアカード）\n├──────────────────────────────────┤\n│  Title                            │\n│  Description                      │\n│                                   │\n│  [Meta]          [Action Button]  │  ← Footer は border-t で区切る\n└──────────────────────────────────┘\n```\n\n---\n\n## 4. Composition Rules\n\n許可: すべてのコンポーネント（汎用コンテナとして使用可）。`Card` の入れ子は最大2階層まで。`static` カード内のアクションボタンは個別に配置可。\n禁止: `<Modal>` / `<Drawer>` など浮き上がる要素の格納 / `link` カード内にネストしたインタラクティブ要素（リンク・ボタンの入れ子）/ カード直下の `<fieldset>` + `<legend>`（→ `<div>` + `<h2>` でセクション見出し）。\n配置: メディアは上部、続いてタイトル → 説明 → フッター（アクション）。フッターは `border-t border-slate-200` で本文と区切り、アクションは右寄せ。\n\n---\n\n## 5. Layout & Spacing\n\n- padding: `p-6`(24px) を標準。最低でも `p-4`(16px) を確保（`p-0` 禁止・極小パディング禁止）\n- グリッド内のカード: `grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6`\n- カード間・要素間の余白は呼び出し側のレイアウト（親の `gap`）で指定。カード自体は外側 `margin` を持たない\n- フッターは `px-6 py-3 border-t border-slate-200`、アクション間は `gap-3`\n\n**link カードのグリッド内・高さ揃え（必須）**\n\nバッジ有無等でカード高さが異なってもホバー shadow の範囲を統一するため、以下を必ず付与する。\n\n- `<a>` と `<article>` に `h-full`\n- コンテンツ部を `flex flex-col flex-1`\n- 末尾要素（価格等）に `mt-auto`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| 背景 | `color.surface.raised`（white・`bg-white`） |\n| ボーダー | `color.border.default`（`border-slate-200`） |\n| ヘッダー / フッター区切り | `color.border.subtle`（`border-t border-slate-200`） |\n| 角丸 | `radius.xl`（`rounded-xl`） |\n| shadow（既定） | `elevation.shadow.sm`（`shadow-sm`） |\n| shadow（link hover） | `elevation.shadow.md`（`shadow-md`） |\n| padding | `spacing.6`(24px) / 最低 `spacing.4`(16px) |\n| タイトル文字 | `color.content.primary`（`text-slate-900`） |\n| 本文 / メタ文字 | `color.content.secondary`（`text-body` #081a27） |\n| グリッド gap | `spacing.6`(24px) |\n\n---\n\n## 7. Accessibility\n- **Role**: 静的コンテンツは `<article>`、`link` カードは `<a>`（フォーカス可能にする）\n- `link` カードは `<a>` で全体を囲み Tab でフォーカス → Enter で遷移\n- `static` カード内のアクションボタンは個別にフォーカス可能にする\n- メディアカードの画像には適切な `alt` を付与する\n- テキストのコントラスト 4.5:1 以上。カード背景 vs ページ背景は 3:1 以上（境界線で補完）\n- カードグリッドはキーボードで順序通りにナビゲート可能にする\n\n## 8. Content Guidelines\n- タイトルは1行（折り返し不可）\n- カード内は関連性の高い情報のみをグループ化する（1カード1コンテキスト）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 基本カード（静的） -->\n<div class=\"bg-white rounded-xl border border-slate-200 p-6 shadow-sm\">\n  <h3 class=\"text-xl font-bold text-slate-900\">カードタイトル</h3>\n  <p class=\"mt-2 text-base text-body\">カードの説明文がここに入ります。</p>\n</div>\n\n<!-- Do: メトリクスカード -->\n<div class=\"bg-white rounded-xl border border-slate-200 p-6 shadow-sm\">\n  <p class=\"text-sm font-medium text-body\">月間アクティブユーザー</p>\n  <p class=\"mt-1 text-3xl font-bold text-slate-900\">12,345</p>\n  <p class=\"mt-1 text-sm text-emerald-600\">+12.5% 前月比</p>\n</div>\n\n<!-- Do: アクションカード（フッターは border-t で区切り、右寄せ） -->\n<div class=\"bg-white rounded-xl border border-slate-200 shadow-sm\">\n  <div class=\"p-6\">\n    <h3 class=\"text-lg font-bold text-slate-900\">タイトル</h3>\n    <p class=\"mt-2 text-sm text-body\">説明文</p>\n  </div>\n  <div class=\"px-6 py-3 border-t border-slate-200 flex justify-end gap-3\">\n    <button class=\"h-8 px-3 text-[14px] font-medium text-[#3e5062] rounded hover:bg-[#edf0f3] transition-colors\">キャンセル</button>\n    <button class=\"h-8 px-3 text-[14px] font-medium text-white bg-primary-700 rounded hover:bg-primary-600 transition-colors\">保存</button>\n  </div>\n</div>\n\n<!-- Do: link カード（グリッド内・高さ揃え） -->\n<a href=\"#\" class=\"block h-full hover:shadow-md transition-shadow rounded-xl\">\n  <article class=\"h-full bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col\">\n    <img src=\"...\" alt=\"画像の説明\" class=\"w-full h-48 object-cover\">\n    <div class=\"p-4 flex flex-col flex-1\">\n      <h3 class=\"text-base font-medium text-slate-900\">タイトル</h3>\n      <p class=\"mt-auto pt-3 text-base font-bold text-slate-900\">末尾要素</p>\n    </div>\n  </article>\n</a>\n```\n\n**Don't**: `rounded-none`（→ `rounded-xl`）/ `shadow-lg`・`shadow-2xl`（→ `shadow-sm`、オーバーレイのみ `shadow-xl`）/ カード上部・左端の `border-t-4` カラーバー（→ 全周 `border border-slate-200`。AI生成UIの典型）/ `p-0` のパディングなし（→ 最低 `p-4`）/ `bg-gray-300` 以上の暗い背景（→ `bg-white` 標準）/ `link` カード内のインタラクティブ要素ネスト / `static` カードへの hover 効果付与 / 色だけで状態・種類を伝達。\n\n---\n\n## 10. Implementation Notes\n- `link` カードのグリッドでは高さ揃え 3点セット（`h-full` / `flex flex-col flex-1` / `mt-auto`）を必ず適用し、ホバー shadow 範囲を統一する\n- アクションボタンは `navigation/Buttons.md` 準拠（フッターは Subtle → Contained の順で右寄せ）\n- 思想は `FOUNDATIONS.md`、トークン参照は `guidelines/TOKEN_GUIDE.md`、使い分けは `COMPONENT_GUIDE.md`\n", "base/display/Badge.md": "# Component Guideline: Badge\n\n> NestUI Badge 仕様。Tailwind CSS。値は `tokens/`（色は `color.status.*` / `color.semantic.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Badge\n- **Variants**: `default`（neutral） / `primary` / `success` / `warning` / `error`（+ Dot付き / Count / Outline の表示形態）\n- **Responsibility**:\n  - する: ステータス・分類・カウントを短いラベルで補助的に表示する\n  - しない: クリック操作・フィルタリング（→ Chip）/ 削除可能ラベル（→ Tag）/ 長文の説明\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: バッジは状態・分類を簡潔に伝えるラベル / 色だけで情報を伝えない（テキスト必須）/ サイズは小さく保ちメインコンテンツの邪魔をしない / 一貫したカラーコード（成功・警告・エラー・ニュートラル・アクセント）。\n\n---\n\n## 2. Variants & States\n\n**Variants**（カラー）\n\n| Variant | 用途 | class（塗り） |\n|---------|------|------|\n| `default`（neutral） | 中立的なラベル・未着手・カテゴリ | `bg-slate-100 text-slate-700` |\n| `primary`（accent） | アクティブ・選択中・新規 | `bg-primary-50 text-primary-700` |\n| `success` | 完了・成功・正常 | `bg-emerald-50 text-emerald-700`（`color.status.success.container`/`.text`） |\n| `warning` | 進行中・保留・確認待ち | `bg-amber-50 text-amber-700`（`color.status.warning.container`/`.text`） |\n| `error` | ブロック・失敗・危険 | `bg-red-50 text-red-700`（`color.status.danger.container`/`.text`） |\n\n全 variant 共通: `inline-flex items-center px-3 py-1 rounded-full text-xs font-medium`\n\n**表示形態 / States**\n\n| 形態 | 説明 | 追加 class |\n|------|------|------|\n| Dot 付き | テキスト前に色付きドットを置き状態を補強（オンライン等） | `gap-1.5` + `<span class=\"w-1.5 h-1.5 rounded-full bg-emerald-500\">` |\n| Count | 通知数・未読件数を円形で表示 | `justify-center w-5 h-5 text-white bg-red-500 rounded-full`（0 は非表示検討） |\n| Outline | 背景なし・ボーダーのみ。情報密度が高い画面向け | `border border-slate-300 text-slate-700`（塗りなし） |\n\nバッジは hover / focus / disabled を持たない（非インタラクティブ）。状態変更時はカラーとテキストを同時更新する。\n\n---\n\n## 3. サイズ / Props\n\n| サイズ | 高さ | padding | font |\n|--------|------|---------|------|\n| Medium（既定） | 20px | `px-3 py-1` | `text-xs`（11px） |\n| Small | 16px | `px-2 py-0.5` | `text-xs` |\n| Count（円形） | 20px | `w-5 h-5`（円形固定） | `text-xs` |\n\n主な Props（参考）: `variant`（default/primary/success/warning/error）/ `size`（sm/md）/ `count`（99 超は `99+`）/ `label`（count と排他）/ `dot`（boolean）。\n\n---\n\n## 4. Composition Rules\n\n許可: テキストラベル / Dot Indicator（`<span>`）。\n禁止: バッジ内に `<button>` / `<a>` 等インタラクティブ要素。`count` と `label` の同時指定。テキストなしの色ドットのみ表示。\n配置: 複数並置は `flex flex-wrap gap-2`。アイコンボタン・ナビアイテムへ重ねる場合は `position: absolute`。\n\n---\n\n## 5. Layout & Spacing\n\n- 角丸は `rounded-full` 固定（`rounded-lg` / `rounded-md` 禁止）\n- テキストは最大2〜3語（12文字以内目安）。超過はツールチップで補足\n- Count が 0 のときはレンダリングしない（親で条件分岐）\n\n---\n\n## 6. Token Mapping\n\n| Variant | 背景 | テキスト |\n|---------|------|---------|\n| default | `color.surface.sunken` 近傍（slate-100） | `color.content.secondary`（slate-700 近傍） |\n| primary | `color.primary.50` | `color.primary.700` |\n| success | `color.status.success.container`(#F2FBEA) | `color.status.success.text`(#376F1C) |\n| warning | `color.status.warning.container`(#FEF8EE) | `color.status.warning.text`(#B95415) |\n| error | `color.status.danger.container`(#FEF2F4) | `color.status.danger.text`(#B51B4E) |\n| count 背景 | `color.status.danger.base`(#E93766) | `color.content.inverse`（white） |\n\n> 角丸: `radius.full`。Dot サイズ 8×8px（`radius.full`）。\n\n---\n\n## 7. Accessibility\n- **Role**: 動的更新されるカウントバッジは `role=\"status\"`\n- 数値カウント: `aria-label=\"3件の通知\"` 等（数値のみでは文脈不明）\n- Dot バッジ: `aria-label=\"オンライン\"` 等を必須\n- 色だけで状態を伝えない（テキスト/アイコン併用）。コントラストは背景とテキストで 4.5:1 以上\n\n## 8. Content Guidelines\n- ステータスラベルは体言止め（「実行中」「完了」「エラー」）\n- カウントは `99+` で上限を表現\n- `label` は最大12文字以内\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: ステータス（カラーコード） -->\n<span class=\"inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700\">完了</span>\n\n<!-- Do: ドット付き -->\n<span class=\"inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700\">\n  <span class=\"w-1.5 h-1.5 rounded-full bg-emerald-500\"></span>オンライン\n</span>\n\n<!-- Do: カウント -->\n<span class=\"inline-flex items-center justify-center w-5 h-5 text-xs font-medium text-white bg-red-500 rounded-full\" aria-label=\"3件の通知\">3</span>\n\n<!-- Do: アウトライン -->\n<span class=\"inline-flex items-center px-3 py-1 rounded-full text-xs font-medium border border-slate-300 text-slate-700\">下書き</span>\n```\n\n**Don't**: バッジをクリッカブルにする（→ Chip）/ 色のみでステータス伝達 / `rounded-lg`・`rounded-md`（→ `rounded-full`）/ 長文テキスト / 削除ボタン付与（→ Tag）/ `count` と `label` 同時指定。\n\n---\n\n## 10. Implementation Notes\n- アイコンは Lucide。ステータス色は `color.status.*` / `color.semantic.*` から選ぶ\n- 削除可能ラベルは `Tag.md`、ステータス選択トリガーは `Status tag.md`、フィルター/選択は Chip を参照\n- 思想は `FOUNDATIONS.md`\n", "base/display/Tag.md": "# Component Guideline: Tag\n\n> NestUI Tag 仕様。Tailwind CSS。値は `tokens/`（ボーダーは `color.border.default`）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Tag\n- **Variants**: `Enable`（標準） / `Disable`（無効）\n- **Responsibility**:\n  - する: オブジェクトに付与されたメタデータ（物件名・部屋番号・ラベル等）を静的に表示する\n  - しない: フォームの選択肢・フィルター条件のオン/オフ（→ Chip）/ ステータス表示（→ Status tag / Badge）/ 削除可能ラベル（→ Chip）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 静的ラベル（ユーザーが操作しない読み取り専用）/ ボーダーで存在感を出す（背景を塗らず区切り感を表現）/ 単一スタイル（カラーバリエーションを持たない。状態は Enable / Disable の2種のみ）。\n\n---\n\n## 2. Variants & States\n\n| Variant | 背景 | ボーダー | テキスト | 用途 |\n|---------|------|----------|----------|------|\n| `Enable`（標準） | `bg-white`（透明） | `border border-[#c4cdd9]` | `text-[#3e5062]` | 物件名・部屋番号・ラベル等のメタデータ |\n| `Disable`（無効） | `bg-[#edf0f3]` | `border border-[#c4cdd9]` | `text-[#a1afc0]` + `aria-disabled=\"true\"` | 編集不可・非アクティブ |\n\n共通フォント: `text-[11px] font-medium tracking-[0.22px] leading-[1.3]`。\n静的表示のためクリック・ホバーは持たない。テキストは `whitespace-nowrap` で1行に収める。\n\n---\n\n## 3. サイズ / Props\n\n| プロパティ | 値 |\n|-----------|-----|\n| 外枠 | `inline-flex items-center justify-center` |\n| padding | `px-[6px] pt-[4px] pb-[5px]` |\n| 角丸 | `rounded-[4px]` |\n| フォント | `text-[11px] font-medium tracking-[0.22px] leading-[1.3]` |\n\nサイズは1種固定（`text-[11px]`）。主な Props（参考）: `disabled`（boolean）/ `label`（テキスト）。\n\n---\n\n## 4. Composition Rules\n\n許可: テキストラベルのみ。\n禁止: 削除ボタン（×）の付与（→ Chip）/ 選択肢・フィルターでの使用（→ Chip）/ カラーバリエーション（背景の塗り分け）/ Badge（ステータス）との混同使用。\n配置: 複数並べる場合は `role=\"list\"` でグループ化、各タグは `role=\"listitem\"`。\n\n---\n\n## 5. Layout & Spacing\n\n- タググループ: `flex flex-wrap gap-1.5`\n- 角丸は `rounded-[4px]` 固定（`rounded-full` 禁止）\n- 折り返し不可（`whitespace-nowrap`）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| ボーダー（共通） | `color.border.default`(#C4CDD9) |\n| Enable テキスト | `#3e5062`（content 補助。`color.content.secondary` 近傍） |\n| Disable 背景 | `color.surface.sunken`(#EDF0F3) |\n| Disable テキスト | `color.content.disabled`(#A1AFC0) |\n| 角丸 | `radius.sm`（4px） |\n| padding | `spacing` 微調整値（6/4/5px） |\n\n---\n\n## 7. Accessibility\n\n| 属性 | 値 | 対象 |\n|------|-----|------|\n| `role=\"list\"` | — | タググループのコンテナ |\n| `role=\"listitem\"` | — | 各タグ |\n| `aria-disabled=\"true\"` | — | Disable 状態のタグ |\n\n- 色だけで状態を伝えない（Disable はテキスト色 + 背景色の両方で区別）\n\n## 8. Content Guidelines\n- 物件名・部屋番号・カテゴリ等のメタデータを簡潔に\n- `text-xs`（12px）以上のフォントは使わない（`text-[11px]` 固定）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Enable -->\n<span class=\"inline-flex items-center justify-center px-[6px] pt-[4px] pb-[5px] border border-[#c4cdd9] rounded-[4px] text-[11px] font-medium tracking-[0.22px] leading-[1.3] text-[#3e5062] whitespace-nowrap\">サンプルハイツ 304号室</span>\n\n<!-- Do: Disable -->\n<span class=\"inline-flex items-center justify-center px-[6px] pt-[4px] pb-[5px] border border-[#c4cdd9] rounded-[4px] bg-[#edf0f3] text-[11px] font-medium tracking-[0.22px] leading-[1.3] text-[#a1afc0] whitespace-nowrap\" aria-disabled=\"true\">サンプルハイツ 304号室</span>\n\n<!-- Do: タググループ -->\n<div role=\"list\" class=\"flex flex-wrap gap-1.5\">\n  <span role=\"listitem\" class=\"inline-flex items-center justify-center px-[6px] pt-[4px] pb-[5px] border border-[#c4cdd9] rounded-[4px] text-[11px] font-medium tracking-[0.22px] leading-[1.3] text-[#3e5062] whitespace-nowrap\">サンプルハイツ 304号室</span>\n  <span role=\"listitem\" class=\"inline-flex items-center justify-center px-[6px] pt-[4px] pb-[5px] border border-[#c4cdd9] rounded-[4px] text-[11px] font-medium tracking-[0.22px] leading-[1.3] text-[#3e5062] whitespace-nowrap\">サンプルコート 1201号室</span>\n</div>\n```\n\n**Don't**: `rounded-full`（→ `rounded-[4px]`）/ カラーバリエーション（背景の塗り分け）/ `text-xs` 以上 / 削除ボタン付与（→ Chip）/ 選択肢・フィルターに使用（→ Chip）/ Badge との混同。\n\n---\n\n## 10. Implementation Notes\n- ステータス表示は `Status tag.md`、フィルター/選択・削除可能ラベルは Chip を参照\n", "base/display/Status tag.md": "# Component Guideline: Status tag\n\n> NestUI Status tag / MenuTag 仕様。Tailwind CSS。値は `tokens/`（色は `color.status.*` / `color.semantic.*`）を正とし、以下の class はその適用例。色・アイコン・命名の判断ルールは **11 章を正**とする。\n\n## 1. Component Identity\n- **Name**: Status tag\n- **Variants**: `Circle`（ドット付き／進行中の状態） / `Check`（チェック付き／完了） / `Edit`（編集アイコン付き／変更） / `Attribute`（アイコンなし／属性） / `MenuTag`（選択トリガー）\n- **Responsibility**:\n  - する: オブジェクトの状態（ステータス・進捗）と属性を色付きで表示する。MenuTag はステータス変更ドロップダウンを開く\n  - しない: メタデータの表示（→ Tag）/ 数値カウント・汎用ラベル（→ Badge）/ フィルター・選択肢（→ Chip）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 色のみで伝達しない（テキストを必ず併記）/ アイコンの有無で状態と属性を分ける（状態＝あり、属性＝なし。11.2）/ 1画面のカラーグループは7色以内 / MenuTag はドロップダウンとセットで使用（単独使用しない）。\n\n---\n\n## 2. Variants & States\n\n| 種別 | 概要 | 用途 |\n|------|------|------|\n| `Circle` | 色付きドット + テキスト | 進行中の状態（未対応・申込中・契約中） |\n| `Check` | チェックアイコン + テキスト | 完了。**ラベルが「完了」のときだけ**使う（11.5） |\n| `Edit` | Pencil アイコン + テキスト | 変更。色は Blue 固定（`#d8f0f5` / `#2550a8`） |\n| `Attribute` | テキストのみ（アイコンなし） | 属性（住居・オーナー・必須）。色は識別用で意味を持たない（11.4） |\n| `MenuTag` | 色付き背景 + テキスト + ChevronDown | ステータス変更ドロップダウンのトリガー |\n\n**カラートークン**\n\n| カラーグループ | 意味カテゴリ（状態） | 背景（Container） | テキスト | ドット色（Circle） | 用途例 |\n|----------------|----------------------|-------------------|----------|----------------------|--------|\n| Rose | 対応が必要 | `#fee5e9` | `#b51b4e` | `#e93766` | 未対応 / エラー / 空室 / 契約終了 |\n| Orange | まだ後戻りできる | `#fdf1d7` | `#b95415` | `#ee8c29` | 未入金 / 申込中 / 更新手続中 |\n| Turquoise | 後戻りできないものができた。まだ完了していない | `#d0f7f4` | `#176a6e` | `#21a9ab` | 一部入金 / 契約開始前 / 更新予約 |\n| Green | 完了した | `#d5f6e6` | `#376f1c` | `#5eb62c` | 契約中 / 在室 / 入金済 / 完了 |\n| Blue | 下書き | `#d8f0f5` | `#2550a8` | `#2661cf` | 下書き |\n| Purple | 解約系の進行中 | `#f4ecfb` | `#6d3792` | `#a35ed9` | 解約手続中 / 解約予約 |\n| Gray | 軸を降りた | `#dde3eb` | `#081a27` | `#5a6c7f` | 解約済 / キャンセル / アーカイブ / 非公開 |\n\n> 「意味カテゴリ」列は**状態（アイコンあり）にのみ適用**。属性（アイコンなし）は同じパレットを使うが色に意味を持たせず、11.4 の順で機械的に振る。\n> `Edit`（変更）は 11.3 の軸に載らず、**Blue 固定**で運用する（`bg #d8f0f5` / テキスト・アイコン `#2550a8`。11.6）。\n\n**States**: Circle / Check / Edit / Attribute は静的（インタラクションなし）。MenuTag は hover（`hover:brightness-95`）/ open（`aria-expanded=\"true\"`）。MenuTag のトリガー: クリック/Enter/Space で開閉、Escape・外部クリックで閉じる。\n\n---\n\n## 3. サイズ / Props\n\n| 種別 | 外枠 | テキスト | アイコン |\n|------|------|----------|---------|\n| Circle | `inline-flex items-center rounded-[4px] gap-[6px] px-[6px]` | `text-[11px] font-normal leading-[1.75] whitespace-nowrap` | ドット `w-2 h-2 rounded-full shrink-0` |\n| Check | `inline-flex items-center rounded-[4px] gap-[4px] pl-[4px] pr-[6px]` | `text-[11px] font-normal leading-[1.75] whitespace-nowrap` | チェック SVG `w-3 h-3 shrink-0` |\n| Edit | `inline-flex items-center rounded-[4px] gap-[4px] pl-[4px] pr-[6px]` | `text-[11px] font-normal leading-[1.75] whitespace-nowrap` | Lucide `pencil` `w-3 h-3 shrink-0` |\n| Attribute | `inline-flex items-center rounded-[4px] px-[6px]` | `text-[11px] font-normal leading-[1.75] whitespace-nowrap` | なし |\n| MenuTag | `inline-flex items-center gap-[4px] h-[28px] pl-[12px] pr-[8px] rounded-[2px] cursor-pointer hover:brightness-95 transition-all` | `text-[12px] font-medium tracking-[0.24px] leading-[1.3] whitespace-nowrap` | ChevronDown `w-4 h-4 flex-shrink-0`（aria-hidden） |\n\n主な Props（参考）: `type`（circle/check/edit/attribute/menu）/ `color`（rose/orange/turquoise/green/blue/purple/gray）/ `label`。\n\n---\n\n## 4. Composition Rules\n\n許可: ドット / チェック SVG / Pencil SVG + テキスト（MenuTag は + ChevronDown）。属性はテキストのみ。\n禁止: テキストを省略した「色のみ」表示 / 状態タグをアイコンなしで出す / 属性タグにアイコンを付ける / ラベルが「完了」以外で Check を使う / 属性に Rose を使う（必須を除く）/ MenuTag を静的ラベルとして使用（開かないなら Circle）/ 8色以上のカラーグループを1画面に混在 / Tailwind の `bg-rose-*` 等汎用クラスをそのまま使用（トークンの HEX を指定）。\n配置: MenuTag はステータス変更ドロップダウン（`role=\"menu\"`）と必ずセット。\n\n---\n\n## 5. Layout & Spacing\n\n- Circle / Check / Edit / Attribute 角丸 `rounded-[4px]`、MenuTag 角丸 `rounded-[2px]`\n- MenuTag 高さ `h-[28px]`、padding `pl-[12px] pr-[8px]`\n- カラーグループは1画面7色以内\n\n---\n\n## 6. Token Mapping\n\n| カラー | 背景トークン | テキストトークン |\n|--------|------|---------|\n| Rose | NestUI 固有(#fee5e9) | NestUI 固有(#b51b4e) |\n| Orange | `color.status.warning.container` 近傍(#fdf1d7) | `color.status.warning.text`(#b95415) |\n| Turquoise | NestUI 固有(#d0f7f4) | NestUI 固有(#176a6e) |\n| Green | NestUI 固有(#d5f6e6) | `color.status.success.text`(#376f1c) |\n| Blue | `color.brand.100` 近傍(#d8f0f5) | `color.primary.800`(#2550a8) |\n| Purple | NestUI 固有(#f4ecfb) | NestUI 固有(#6d3792) |\n| Gray | `color.border.subtle`(#dde3eb) | `color.content.primary`(#081a27) |\n| 角丸 Circle/Check/Edit/Attribute | `radius.sm`(4px) |\n| 角丸 MenuTag | `radius.sm`→2px（NestUI 固有） |\n\n> Rose/Turquoise/Purple/Green の一部は標準 semantic に無い NestUI 固有色。HEX を直接指定する（Tailwind 汎用クラスは使わない）。\n\n---\n\n## 7. Accessibility\n\n| 属性 | 値 | 対象 |\n|------|-----|------|\n| `aria-haspopup=\"true\"` | — | MenuTag ボタン |\n| `aria-expanded` | `\"false\"` / `\"true\"` | MenuTag ボタン（開閉状態） |\n| `role=\"menu\"` | — | ドロップダウンコンテナ |\n| `role=\"menuitem\"` | — | 各ステータス選択肢 |\n\n- Circle / Check / Edit / Attribute は `role` 属性不要（静的テキスト）\n- 色だけで伝えない（テキストを必ず併記）。アイコンは色の補強で、単独で意味を持たせない\n\n## 8. Content Guidelines\n- ステータス名は体言止め（「契約中」「解約手続中」「完了」）\n- MenuTag のラベルは現在のステータスを表示\n- バリアント名は `<対象>_<値>`、後半は画面に出るラベルと一致させる（11.6）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Circle（Green / 契約中） -->\n<div class=\"inline-flex items-center rounded-[4px] bg-[#d5f6e6] gap-[6px] px-[6px]\">\n  <span class=\"w-2 h-2 rounded-full bg-[#5eb62c] shrink-0\"></span>\n  <span class=\"text-[11px] font-normal text-[#376f1c] leading-[1.75] whitespace-nowrap\">契約中</span>\n</div>\n\n<!-- Do: Check（Green / 完了）── ラベルが「完了」のときだけ Check -->\n<div class=\"inline-flex items-center rounded-[4px] bg-[#d5f6e6] gap-[4px] pl-[4px] pr-[6px]\">\n  <svg class=\"w-3 h-3 shrink-0 text-[#376f1c]\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polyline points=\"1.5,6 4.5,9 10.5,3\"/></svg>\n  <span class=\"text-[11px] font-normal text-[#376f1c] leading-[1.75] whitespace-nowrap\">完了</span>\n</div>\n\n<!-- Do: Edit（Blue / 変更）── Lucide pencil -->\n<div class=\"inline-flex items-center rounded-[4px] bg-[#d8f0f5] gap-[4px] pl-[4px] pr-[6px]\">\n  <svg class=\"w-3 h-3 shrink-0 text-[#2550a8]\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z\"/><path d=\"m15 5 4 4\"/></svg>\n  <span class=\"text-[11px] font-normal text-[#2550a8] leading-[1.75] whitespace-nowrap\">変更</span>\n</div>\n\n<!-- Do: Attribute（Orange / 住居）── 属性はアイコンなし -->\n<div class=\"inline-flex items-center rounded-[4px] bg-[#fdf1d7] px-[6px]\">\n  <span class=\"text-[11px] font-normal text-[#b95415] leading-[1.75] whitespace-nowrap\">住居</span>\n</div>\n\n<!-- Do: MenuTag（Rose / 未対応・ドロップダウンと連動） -->\n<button type=\"button\" aria-haspopup=\"true\" aria-expanded=\"false\"\n  class=\"inline-flex items-center gap-[4px] h-[28px] pl-[12px] pr-[8px] rounded-[2px] bg-[#fee5e9] text-[#b51b4e] cursor-pointer hover:brightness-95 transition-all\">\n  <span class=\"text-[12px] font-medium tracking-[0.24px] leading-[1.3] whitespace-nowrap\">未対応</span>\n  <svg class=\"w-4 h-4 flex-shrink-0\" viewBox=\"0 0 16 16\" fill=\"none\" aria-hidden=\"true\"><path d=\"M4 6l4 4 4-4\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>\n</button>\n```\n\n**Don't**: テキストを省略した「色のみ」/ 状態タグをアイコンなしで出す / 属性タグにアイコンを付ける / 「完了」以外のラベルで Check / 属性に Rose（必須を除く）/ MenuTag を静的ラベルに使用（→ Circle）/ 8色以上のカラーグループを1画面に混在 / `bg-rose-*` 等の汎用クラスをそのまま使用（→ トークンの HEX）。\n\n---\n\n## 10. Implementation Notes\n- MenuTag のドロップダウン（メニューコンテナ・メニューアイテム）は共通メニューパターンに準拠\n- メタデータ表示は `Tag.md`、汎用ステータスラベル/カウントは `Badge.md` を参照\n- Tailwind 汎用カラーではなくトークンの HEX を直接指定すること\n- 色名は `Green` を正とする（旧 `LightGreen` / `lightGreen` は使わない）\n- `Edit` のアイコンは Lucide `pencil`（12×12・`pl-[4px]` `gap-[4px]` `pr-[6px]`・タグ高 19px）\n\n---\n\n## 11. 色 / アイコン / 命名ルール（全タグ共通）\n\n> プロダクト全体のステータス表示（Status tag）で、①どの色を使うか ②アイコンを付けるか ③バリアントをどう命名するか、を判断するための汎用ルール。契約ステータスだけでなく、案件・請求・入出金など**あらゆるタグに適用**する。\n> **例外は設けない。** 実装側の色定義（組織ごとのマスタ・独自の色 enum など）が本ルールと食い違う場合は、**本ルールを正として実装を寄せる**。\n\n### 11.1 大原則（3つ）\n\n1. **好みで選ばない。ただし決め方は状態と属性で違う** — 状態は意味で決まる（11.3）。属性は色に意味を持たせず、順番で機械的に振る（11.4）。ただし Excel＝緑のように世の中で定着した対応があるものは、それを優先する（11.4 の 6）。\n2. **色だけで伝えない** — 必ずテキストを併記。アイコンは色の補強であって単独で意味を持たせない。\n3. **7色で収める** — Rose / Orange / Turquoise / Green / Blue / Purple / Gray。\n\n### 11.2 アイコンで4種類に分かれる\n\n`Status / Tag` の **ShowIcon（true/false）** と **Type（Circle / Check / Edit）** の組み合わせで、そのタグが何を表しているかが決まる。\n\n| ShowIcon | Type | 意味 | 例 |\n| --- | --- | --- | --- |\n| true | Circle | **進行中の状態** | 未対応 / 申込中 / 契約中 |\n| true | Check | **完了した状態** | 完了 |\n| true | Edit | **変更** | 変更 |\n| false | — | **属性** | 住居 / オーナー / 必須 |\n\n- 状態＝時間とともに進んでいくもの（未対応 → 対応中 → 完了）\n- 属性＝進まないもの（住居 / オーナー / 必須）\n\n**アイコンの有無が「状態か属性か」を表す。** 状態には必ずアイコンを付け、属性には付けない。\n\n### 11.3 状態の色は意味を持つ\n\n状態（ShowIcon=true）の色は意味で固定する。**Orange → Turquoise → Green は「どこまで実現したか」の1本の軸。**\n\n| 色 | 意味 | 例 |\n| --- | --- | --- |\n| **Rose** | 対応が必要 | 未対応 / エラー / 空室 |\n| **Orange** | まだ後戻りできる | 未入金 / 申込中 / 更新手続中 |\n| **Turquoise** | 後戻りできないものができた。まだ完了していない | 一部入金 / 契約開始前 / 更新予約 |\n| **Green** | 完了した | 契約中 / 入金済 / 完了 |\n| **Blue** | 下書き | 下書き |\n| **Purple** | 解約系の進行中 | 解約手続中 / 解約予約 |\n| **Gray** | 軸を降りた | 解約済 / キャンセル / アーカイブ |\n\n迷ったら「**もうやり直せないことが起きたか**」で判定する。起きていない → Orange ／ 起きたが終わっていない → Turquoise ／ 終わった → Green。\n\n**同じグループ内に同じ色が並んでよい。** 状態は色が意味を持つので、意味が同じなら同色になるのが正しい（例：現況の「申込中」と「家主調整中」はどちらも Orange）。「グループ内で色を重複させない」は次項＝属性のルールであって、状態には適用しない。\n\n> **例は代表例だけで、増やさない。** ラベルと色の全対応は、プロダクト側で対応表として管理する。新しいラベルを足すときは対応表に1行足す。\n\n### 11.4 属性の色は識別のためだけ\n\n属性（ShowIcon=false）の色には意味がない。並びを見分けるための採番として扱う。\n\n| # | ルール |\n| --- | --- |\n| 1 | 色に意味を持たせない |\n| 2 | 対応が必要なものは Rose（必須） |\n| 3 | 「その他」「未指定」は Gray |\n| 4 | 以降 Orange → Green → Turquoise → Blue → Purple の順 |\n| 5 | 同じグループの中で同じ色を使わない |\n| 6 | 一般に定着した色があるものは 4 より優先（XLSX=Green / PDF=Orange、個人=Blue / 法人=Purple） |\n\n並び順：`Orange → Green → Turquoise → Blue → Purple` ＋ その他は `Gray`\n\n### 11.5 Check にするかの判定\n\n**ラベルが「完了」のときだけ Check。**\n\n### 11.6 Edit の扱い\n\n**`Type=Edit`（変更）は色の軸に載らず Blue 固定。** アイコンは Lucide `pencil`（12×12）。\n\n### 11.7 新しいタグを足すときの命名\n\n| # | ルール |\n| --- | --- |\n| 1 | `<対象>_<値>` で作る。前半は**そのタグが付く対象**の名前にする（例：`募集状況_公開`） |\n| 2 | 「ステータス」「区分」など**型を表す語は接頭辞に入れない** |\n| 3 | 後半は**画面に出るラベルと一致**させる |\n\n### 11.8 Do / Don't\n\n**Do**\n\n- **状態**は同じ意味に同じ色を使う（Green＝完了した、Gray＝軸を降りた…）。\n- 状態にはアイコンを付け、属性には付けない（＝アイコンで両者を区別する）。\n- 状態の区別は**色＋テキスト**で行う。\n- 属性の色は 11.4 の 3〜6 の順で機械的に振る。\n- 新しいラベルを足したら**台帳に1行足す**（11.3 の注記）。\n\n**Don't**\n\n- 色だけで状態を伝える（テキスト必須）。\n- 属性に Rose を使う（対応が必要なものを除く）。\n- 11.3 の例を増やして台帳の代わりにする（例は代表例だけ）。\n\n### 11.9 適用例：賃貸借契約ステータス（11件）\n\n全て ShowIcon=true / Circle。\n\n| ステータス | 色 | 意味 |\n| --- | --- | --- |\n| 下書き | Blue | 下書き |\n| 申込中 | Orange | まだ後戻りできる |\n| 契約開始前 | Turquoise | 後戻りできないものができた |\n| 契約中 | Green | 完了した |\n| 更新手続中 | Orange | まだ後戻りできる（更新が未締結） |\n| 更新予約 | Turquoise | 後戻りできないものができた（更新は締結済み・発効前） |\n| 解約手続中 | Purple | 解約系の進行中 |\n| 解約予約 | Purple | 解約系の進行中 |\n| 解約済 | Gray | 軸を降りた |\n| 契約終了 | Rose | 対応が必要（部屋が空くので募集が必要） |\n| キャンセル | Gray | 軸を降りた |\n\n`更新手続中 → 更新予約 → 契約中` は、初回の `申込中 → 契約開始前 → 契約中` と同じ形になる。\n", "base/display/Avatar.md": "# Component Guideline: Avatar\n\n> Nest

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NestUI Gallery</title>
<!-- NestUI Gallery：docs/designsystem/ の md・トークン・レイアウトを取り込んだ単体のビューア -->
<style>
  /* --------------------------------------------------------------------------
   * ギャラリーの chrome（枠）のスタイル。
   * DS のトークンはここでは使わない ── プレビュー枠（iframe）の中だけが DS の
   * 世界で、枠側が同じ色を使うと「どこまでが DS か」が読めなくなるため。
   * ------------------------------------------------------------------------ */
  :root {
    --g-bg: #ffffff;
    --g-bg-sub: #f7f8fa;
    --g-bg-sunk: #f1f3f6;
    --g-line: #e4e7ec;
    --g-line-soft: #eef0f4;
    --g-ink: #1d2433;
    --g-ink-2: #4b5565;
    --g-ink-3: #7a869a;
    /* chrome のアクセント。設定の accent（DS トークンのパスか CSS 色）で差し替わる。既定は DS と無関係な緑
       --g-accent      … 飾り（現在地のバー・引用の縦線・余白の帯・ブランドマークの地）。指定色そのまま
       --g-accent-ink  … 文字・リンク・ボタンの地・フォーカス枠・チェック。白地に 4.5:1 以上になるまで
                          本体が指定色を暗くした色（WCAG AA）。指定色が十分濃ければ同じ色
       --g-accent-soft … 淡い地（選択中の枠・folder バッジ）。--g-accent-deep … ボタンの hover */
    --g-accent: #0f766e;
    --g-accent-ink: #0f766e;
    --g-accent-soft: #e6f4f2;
    --g-accent-deep: #0b5d57;
    --g-warn-bg: #fff7e6;
    --g-warn-line: #f0c36d;
    /* ok 系（LIVE バッジ・同期成功バナー・実装ありチップ）も accent に追従する */
    --g-ok-bg: #e9f7ef;
    --g-ok-line: #7bc59b;
    --g-ok-ink: #1c6b45;
    /* Usage Do / Don't のラベル色。accent とは独立（意味色なので DS にも accent にも追従させない） */
    --g-do: #2f8f4e;
    --g-dont: #c8352f;
    --g-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --g-sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, -apple-system, sans-serif;
    --g-side: 300px;
    --g-toc: 232px;
    --g-head: 56px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--g-sans);
    font-size: 14px;
    line-height: 1.6;
    color: var(--g-ink-2);
    background: var(--g-bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--g-accent-ink); }
  code { font-family: var(--g-mono); font-size: 0.9em; }
  :focus-visible { outline: 2px solid var(--g-accent-ink); outline-offset: 2px; border-radius: 3px; }

  /* ---------- ヘッダー ---------- */
  .topbar {
    position: fixed; inset: 0 0 auto 0; z-index: 40; height: var(--g-head);
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--g-line);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--g-ink); flex: none; }
  .brand__mark {
    width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: var(--g-accent); color: var(--g-accent-mark-ink, #fff); font-weight: 800; font-size: 13px;   /* 文字色は地との対比で白か墨かを選ぶ */
  }
  .brand__t { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
  .brand__s { font-size: 12px; color: var(--g-ink-3); }
  .topbar__sp { flex: 1 1 auto; }

  .mode { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .04em; text-transform: uppercase; }
  .mode--live { background: var(--g-ok-bg); color: var(--g-ok-ink); }
  .mode--folder { background: var(--g-accent-soft); color: var(--g-accent-deep); }
  /* hidden 属性は display を持つ要素（.btn 等）で効かなくなるので、必ず勝たせる */
  [hidden] { display: none !important; }
  .sync-info { font-size: 12px; color: var(--g-ink-3); font-variant-numeric: tabular-nums; }
  .btn {
    height: 30px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--g-line);
    background: var(--g-bg); color: var(--g-ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:hover:enabled { background: var(--g-bg-sub); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn--primary { background: var(--g-accent-ink); border-color: var(--g-accent-ink); color: #fff; }
  .btn--primary:hover:enabled { background: var(--g-accent-deep); }
  .btn--sync { display: inline-flex; align-items: center; gap: 6px; }
  .btn__icon { width: 14px; height: 14px; flex: none; }
  .btn--sync.is-syncing .btn__icon { animation: g-spin .9s linear infinite; }
  @keyframes g-spin { to { transform: rotate(360deg); } }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--g-ink-2); cursor: pointer; }

  /* ---------- 3 カラム ---------- */
  .shell { display: grid; grid-template-columns: var(--g-side) minmax(0, 1fr) var(--g-toc); padding-top: var(--g-head); min-height: 100%; }

  /* 左ナビ。Primer のドキュメントサイトのサイドナビに倣う: 白地・見出し＋検索・太字のグループ見出し・
     グループ間の区切り線・36px の項目・選択中は薄い地と左の縦バー */
  .sidebar {
    position: sticky; top: var(--g-head); align-self: start; height: calc(100vh - var(--g-head));
    display: flex; flex-direction: column; border-right: 1px solid var(--g-line); background: var(--g-bg);
  }
  .sidebar__head { padding: 24px 24px 8px; }
  .sidebar__title { margin: 0 0 14px; font-size: 22px; font-weight: 600; line-height: 1.3; color: var(--g-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar__search { position: relative; }
  .sidebar__search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--g-ink-3); pointer-events: none; }
  .sidebar__search input {
    width: 100%; height: 32px; padding: 0 10px 0 32px; border-radius: 6px;
    border: 1px solid var(--g-line); background: var(--g-bg); font: inherit; font-size: 14px; color: var(--g-ink);
  }
  .sidebar__search input::placeholder { color: var(--g-ink-3); }
  .sidebar__search input:focus { outline: none; border-color: var(--g-accent-ink); box-shadow: 0 0 0 3px var(--g-accent-soft); }
  .sidebar__nav { flex: 1 1 auto; overflow-y: auto; padding: 8px 24px 40px; }
  .nav-group { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--g-line); }
  .nav-group:last-child { border-bottom: none; }
  .nav-group__h { margin: 0 0 6px; font-size: 14px; font-weight: 600; line-height: 20px; color: var(--g-ink); }
  .nav-list { list-style: none; margin: 0; padding: 0; }
  /* Components セクション内の分類（Navigation / Form / …）の小見出し */
  .nav-group__h + .nav-sub { margin-top: 24px; }
  .nav-sub + .nav-sub { margin-top: 24px; }
  .nav-sub__h { margin: 0 0 8px 8px; font-size: 12px; font-weight: 600; line-height: 18px; color: var(--g-ink-3); }
  .nav-link {
    position: relative; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 8px; border-radius: 6px;
    color: var(--g-ink); text-decoration: none; font-size: 15px; line-height: 20px;
  }
  .nav-link:hover { background: var(--g-bg-sub); }
  .nav-link.is-active { background: var(--g-bg-sunk); font-weight: 600; }
  .nav-link.is-active::before { content: ""; position: absolute; left: -16px; top: 8px; bottom: 8px; width: 4px; border-radius: 4px; background: var(--g-accent); }
  .nav-link__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-changed { margin-left: auto; color: #d97706; font-size: 9px; }
  .nav-warn {
    margin-left: auto; flex: none; width: 15px; height: 15px; border-radius: 999px;
    display: grid; place-items: center; background: var(--g-warn-bg); color: #8a6100;
    font-size: 10px; font-weight: 700;
  }
  .nav-empty { padding: 16px 10px; font-size: 12px; color: var(--g-ink-3); }
  .st { width: 7px; height: 7px; border-radius: 999px; flex: none; display: inline-block; }
  .st--done { background: var(--g-accent-ink); }
  .st--partial { background: #e0a207; }
  .st--none { background: #c3cad6; }
  .st--unknown { background: #c3cad6; }

  .main { min-width: 0; padding: 0 40px 120px; }
  .toc {
    position: sticky; top: var(--g-head); align-self: start; height: calc(100vh - var(--g-head));
    overflow-y: auto; padding: 28px 20px 60px; border-left: 1px solid var(--g-line-soft);
  }
  .toc__h { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--g-ink-3); }
  .toc__list { list-style: none; margin: 0; padding: 0; }
  .toc__i a { display: block; padding: 3px 0; font-size: 12px; color: var(--g-ink-3); text-decoration: none; line-height: 1.45; }
  .toc__i a:hover { color: var(--g-accent-ink); }
  .toc__i--3 a { padding-left: 12px; font-size: 11.5px; }

  /* ---------- バナー ---------- */
  .banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid; }
  .banner--info { background: var(--g-bg-sub); border-color: var(--g-line); color: var(--g-ink-2); }
  .banner--ok { background: var(--g-ok-bg); border-color: var(--g-ok-line); color: var(--g-ok-ink); }
  .banner--warn { background: var(--g-warn-bg); border-color: var(--g-warn-line); color: #8a6100; }
  /* Alerts 風の帯（アイコン ＋ タイトル ＋ 本文）。chrome 側の色で描く */
  .banner--alert { display: flex; align-items: flex-start; gap: 10px; margin: 20px 0 0; padding: 12px 14px; border-radius: 10px; }
  .banner__icon { width: 20px; height: 20px; flex: none; margin-top: 1px; }
  .banner--alert p { margin: 0; line-height: 1.6; }
  .banner__title { font-weight: 700; margin-bottom: 2px !important; }
  .banner code { background: rgba(0, 0, 0, .06); padding: 1px 5px; border-radius: 4px; }

  /* ---------- ページ ---------- */
  .page__head { padding: 36px 0 24px; border-bottom: 1px solid var(--g-line-soft); }
  /* 「はじめに」の見出し直下に出す文字絵（設定の homeArt）。等幅・アクセント色・横にはみ出したらスクロール */
  .home-art { margin: 10px 0 14px; font-family: var(--g-mono); font-size: 11px; line-height: 1.2; color: var(--g-accent-ink); white-space: pre; overflow-x: auto; }
  .page__eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--g-accent-ink); text-transform: uppercase; }
  .page__title { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 700; color: var(--g-ink); letter-spacing: -.01em; }
  .page__when { margin: 10px 0 0; font-size: 14px; color: var(--g-ink-2); max-width: 74ch; }
  .page__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .page__path { font-size: 11.5px; color: var(--g-ink-3); background: var(--g-bg-sunk); padding: 3px 8px; border-radius: 5px; }
  .chip { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .chip--done { background: var(--g-ok-bg); color: var(--g-ok-ink); }
  .chip--partial { background: var(--g-warn-bg); color: #8a6100; }
  .chip--none { background: var(--g-bg-sunk); color: var(--g-ink-3); }
  .chip--unknown { background: var(--g-bg-sunk); color: var(--g-ink-3); }
  .chip--changed { background: #fdf0e3; color: #a35b06; }

  .block { padding: 32px 0 8px; }
  .block__h { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--g-ink); scroll-margin-top: 76px; }
  .block__count { margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--g-ink-3); background: var(--g-bg-sunk); padding: 1px 8px; border-radius: 999px; vertical-align: middle; }
  .block__note { margin: 0 0 18px; font-size: 12.5px; color: var(--g-ink-3); max-width: 78ch; }
  .block__note code { background: var(--g-bg-sunk); padding: 1px 5px; border-radius: 4px; }
  /* 「はじめに」の内訳表 */
  .home-table th.num, .home-table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .home-table td:first-child { white-space: nowrap; font-weight: 600; }
  .empty-demo { padding: 22px; border: 1px dashed var(--g-line); border-radius: 10px; background: var(--g-bg-sub); font-size: 13px; color: var(--g-ink-3); }
  .empty-demo code { background: var(--g-bg-sunk); padding: 1px 5px; border-radius: 4px; }

  /* ---------- 動く見本 ---------- */
  .demo { border: 1px solid var(--g-line); border-radius: 12px; overflow: hidden; margin-bottom: 22px; background: var(--g-bg); }
  .demo__head { padding: 14px 18px 12px; border-bottom: 1px solid var(--g-line-soft); }
  .demo__title { margin: 0; font-size: 14px; font-weight: 700; color: var(--g-ink); scroll-margin-top: 76px; }
  .demo__desc { margin: 4px 0 0; font-size: 12.5px; color: var(--g-ink-3); max-width: 78ch; }
  .demo__body { display: flex; align-items: stretch; }
  /* 見本の下敷き。プレビューの中は DS の面（白 / surface-base）なので、
     その外側だと分かるだけの薄い地にする（模様を敷くと小さい見本ほど地が主役になる） */
  .demo__stagewrap { flex: 1 1 auto; min-width: 0; background: var(--g-bg-sunk); transition: max-width .18s ease; }
  .demo__stage { height: 100%; }
  .demo-frame { display: block; width: 100%; border: 0; background: transparent; }
  /* 機械判定禁則（yaml）のルールカード */
  .rule-intro { border: 1px solid var(--g-line); border-radius: 10px; background: var(--g-bg-sub); padding: 10px 14px; font-size: 13px; }
  .rule-intro summary { cursor: pointer; font-weight: 600; color: var(--g-ink-2); }
  .rule-intro pre { margin: 10px 0 4px; white-space: pre-wrap; font: 12px/1.7 var(--g-mono); color: var(--g-ink-2); }
  .rule { border: 1px solid var(--g-line); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; background: var(--g-bg); }
  .rule__head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 8px; }
  .rule__id { font-family: var(--g-mono); font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--g-bg-sunk); color: var(--g-ink); }
  .rule__name { font-size: 14px; color: var(--g-ink); }
  .rule__cat { font-size: 11px; color: var(--g-ink-3); }
  .rule__date { margin-left: auto; font-size: 11px; color: var(--g-ink-3); font-variant-numeric: tabular-nums; }
  .chip--sev-error { background: #fde8e8; color: #9f1d1d; }
  .chip--sev-warn { background: var(--g-warn-bg); color: #8a6100; }
  .chip--sev-info { background: var(--g-bg-sunk); color: var(--g-ink-2); }
  .rule__desc { margin: 0 0 10px; font-size: 13px; line-height: 1.7; color: var(--g-ink-2); }
  .rule__meta { margin: 0; display: grid; gap: 6px; }
  .rule__meta div { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; font-size: 13px; line-height: 1.6; }
  .rule__meta dt { color: var(--g-ink-3); font-weight: 600; font-family: var(--g-mono); font-size: 12px; padding-top: 2px; overflow-wrap: anywhere; }
  .rule__meta dd { margin: 0; color: var(--g-ink); }
  .rule__term { display: inline-block; margin: 2px 4px 2px 0; padding: 1px 7px; border-radius: 6px; background: var(--g-bg-sunk); font-size: 12px; }
  /* Layout patterns: 骨組み HTML を縮小 iframe で並べるカード */
  .lp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-top: 14px; }
  .lp-card { border: 1px solid var(--g-line); border-radius: 12px; overflow: hidden; background: var(--g-bg); }
  .lp-thumb { display: block; position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--g-bg-sunk); border-bottom: 1px solid var(--g-line-soft); }
  .lp-thumb iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
  .lp-thumb::after { content: ""; position: absolute; inset: 0; }
  .lp-thumb:hover { outline: 2px solid var(--g-accent-ink); outline-offset: -2px; }
  .lp-body { padding: 12px 14px 14px; }
  .lp-name { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
  .lp-name code { font-size: 12px; }
  .lp-meta { margin: 0; display: grid; gap: 4px; }
  .lp-meta div { display: grid; grid-template-columns: 96px 1fr; gap: 8px; font-size: 12px; line-height: 1.5; }
  .lp-meta dt { color: var(--g-ink-3); font-weight: 600; }
  .lp-meta dd { margin: 0; color: var(--g-ink-2); }
  .demo__panel { flex: 0 0 216px; border-left: 1px solid var(--g-line-soft); padding: 14px; background: var(--g-bg-sub); }
  .demo__panel[hidden] { display: none; }
  .demo__panel-h { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--g-ink-3); }
  .ctl { margin-bottom: 12px; }
  .ctl__l { display: block; font-size: 11.5px; color: var(--g-ink-2); margin-bottom: 4px; }
  .ctl__l b { color: var(--g-accent-ink); font-variant-numeric: tabular-nums; }
  .ctl__f { width: 100%; font: inherit; font-size: 12.5px; }
  select.ctl__f, input[type="text"].ctl__f {
    height: 28px; padding: 0 6px; border: 1px solid var(--g-line); border-radius: 6px; background: var(--g-bg); color: var(--g-ink);
  }
  input[type="range"].ctl__f { accent-color: var(--g-accent-ink); }
  .ctl__row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--g-ink-2); cursor: pointer; }
  .ctl__row input { accent-color: var(--g-accent-ink); }

  .demo__foot {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 12px; border-top: 1px solid var(--g-line-soft); background: var(--g-bg);
  }
  .demo__tabs { display: flex; gap: 2px; }
  .demo__tab {
    padding: 4px 10px; border: none; border-radius: 6px; background: none; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600; color: var(--g-ink-3);
  }
  .demo__tab.is-on { background: var(--g-bg-sunk); color: var(--g-ink); }
  .demo__actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .demo__act { padding: 4px 10px; border: 1px solid var(--g-line); border-radius: 6px; background: var(--g-bg); cursor: pointer; font: inherit; font-size: 12px; color: var(--g-ink-2); }
  .demo__act:hover { background: var(--g-bg-sub); }
  .demo__w { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--g-ink-3); }
  .demo__w input { width: 96px; accent-color: var(--g-accent-ink); }
  .demo__code { border-top: 1px solid var(--g-line-soft); background: #0f1729; max-height: 420px; overflow: auto; }
  .demo__code pre { margin: 0; padding: 14px 16px; }
  .demo__code code { color: #d8e0f0; font-size: 12px; line-height: 1.65; white-space: pre; }

  /* ---------- md の描画 ---------- */
  /* 本文は 82ch で読みやすく保ちつつ、表とコードだけは列幅いっぱいに広げる
     （DS の md は列の多い表を多用するので、prose 幅に閉じ込めると横スクロールだらけになる） */
  .doc { font-size: 14px; }
  .doc > :first-child { margin-top: 0; }
  .doc > p, .doc > ul, .doc > ol, .doc > blockquote, .doc > .md-h { max-width: 82ch; }
  .md-h { color: var(--g-ink); font-weight: 700; line-height: 1.35; scroll-margin-top: 76px; }
  .md-h1 { font-size: 24px; margin: 32px 0 12px; }
  .md-h2 { font-size: 19px; margin: 36px 0 12px; padding-top: 12px; border-top: 1px solid var(--g-line-soft); }
  .md-h3 { font-size: 15.5px; margin: 26px 0 8px; }
  .md-h4, .md-h5, .md-h6 { font-size: 14px; margin: 20px 0 6px; }
  .doc p { margin: 0 0 12px; }
  .md-list { margin: 0 0 14px; padding-left: 22px; }
  .md-list li { margin-bottom: 4px; }
  .md-list .md-list { margin: 4px 0 0; }
  .md-hr { border: none; border-top: 1px solid var(--g-line-soft); margin: 22px 0; }
  .md-quote {
    margin: 0 0 16px; padding: 10px 16px; border-left: 3px solid var(--g-accent);
    background: var(--g-bg-sub); border-radius: 0 8px 8px 0; color: var(--g-ink-2);
  }
  .md-quote > :last-child { margin-bottom: 0; }

削除・ダイアログ開閉）\n  - しない: ページ遷移ナビゲーション（`<a>` を使う）、レイアウト容器\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 3階層ピラミッド（重要度が高いほど目立たせ配置数を絞る）/ 1画面1CTA（Contained は最小限）/ 色だけで状態を伝えない（ボーダー・ウェイト併用）/ ラベルは結果を予測可能に。\n\n---\n\n## 2. Variants & States\n\n**Variants**（重要度の高い順）\n\n| Variant | 用途 | class（Medium） |\n|---------|------|------|\n| `contained`（CTA） | 画面内で最重要な1アクション。1画面1〜2個 | `bg-primary-700 text-white rounded hover:bg-primary-600 active:bg-primary-800` |\n| `outlined` | 強めのセカンダリ・状態トグル | `bg-white text-primary-700 border border-primary-700 rounded hover:bg-primary-50 active:bg-primary-100` |\n| `neutral` | 非主要（戻る・詳細）。**唯一、隣接複数配置可** | `bg-[#f7f9fb] text-[#3e5062] rounded hover:bg-[#edf0f3] active:bg-primary-100`（ボーダーなし） |\n| `lighted` | 状態変化後のアクティブ表示。**Neutral とペア・単独禁止** | `bg-primary-100 text-primary-700 rounded hover:bg-primary-200` |\n| `danger` | 破壊的操作の最終確認。**アウトライン型**（フィル `bg-red-*` 禁止） | `bg-white text-[#e93766] border border-[#e93766] rounded hover:bg-[#fef2f4] active:bg-[#fccfd9]` |\n| `subtle` | 付随セカンダリ（キャンセル・閉じる）。背景なし | `text-[#3e5062] rounded hover:bg-[#edf0f3] active:bg-[#c4cdd9]` |\n\n全 variant 共通: `inline-flex items-center justify-center gap-1 h-9 px-3 text-[14px] font-medium tracking-[0.28px] focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1 transition-colors`\n\n**States**\n\n| State | 変化 |\n|-------|------|\n| hover | 背景1段階（`hover:bg-primary-600` 等） |\n| active | 背景2段階（`active:bg-primary-800`） |\n| focus | `focus-visible:ring-2 ring-primary-700 ring-offset-1`（高さ不変。アイコンボタンは絶対配置リング） |\n| disabled | `text-[#a1afc0] bg-[#edf0f3] cursor-not-allowed`（透明度ではなく専用配色） |\n| loading | ラベル保持 + `.inline-spinner` 追加・`disabled opacity-75`（ラベルを消さない） |\n| isSelected | アイコンボタン専用: `bg-[#ddedfc]` + `aria-pressed=\"true\"`（Primary は `border-[#2661cf]`） |\n\n---\n\n## 3. サイズ / アイコンボタン\n\n| サイズ | 高さ | class | font | gap | radius | アイコン |\n|--------|------|-------|------|-----|--------|---------|\n| Large | 44px | `h-[44px] px-4 text-[14px]` | 14px | `gap-1` | `rounded` | `w-[18px] h-[18px]` |\n| Medium（既定） | 36px | `h-9 px-3 text-[14px]` | 14px | `gap-1` | `rounded` | `w-4 h-4` |\n| Small | 28px | `h-7 px-3 text-[12px]` | 12px | `gap-0.5` | `rounded-sm` | `w-[14px] h-[14px]` |\n\nletter-spacing: md/lg `tracking-[0.28px]`、sm `tracking-[0.24px]`（フォントの2%）。\n\n**アイコンボタン**（Middle / Small の2サイズ）: `relative inline-flex items-center justify-center rounded-sm cursor-pointer` + `aria-label` 必須。\n- Middle `w-7 h-7` / Small `w-5 h-5`（アイコンは `w-4 h-4`）\n- Type Secondary（ボーダーなし）/ Primary（`border border-[#c4cdd9]`）\n- フォーカスは絶対配置の FocusRing 要素で実装\n\n---\n\n## 4. Composition Rules\n\n許可: テキストラベル / Leading・Trailing アイコン（`<svg>`）。\n禁止: `<button>` の入れ子 / `<a>`（ナビは `<a>` の責務）/ フォーム要素。\n配置: 同じ variant を横並びにしない（Neutral のみ例外）。階層が高いボタンを上/左、ダイアログフッターは右に最重要（例: Subtle → Contained）。\n\n---\n\n## 5. Layout & Spacing\n\n- 最小高さ: Large 44px / Medium 36px / Small 28px（`py-0.5` 等の極小パディング禁止）\n- タッチターゲット最小 44×44px（インラインリンク除く）\n- アイコン + テキストは `gap-1`、アイコン `w-4 h-4`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| contained 背景 / hover / active | `color.primary.700` / `.600` / `.800` |\n| contained テキスト | `color.content.inverse`（white） |\n| outlined テキスト・ボーダー | `color.primary.700` |\n| neutral 背景 / hover | `#f7f9fb`(`color.surface.base`) / `#edf0f3`(`color.surface.sunken`) |\n| neutral テキスト | `#3e5062`（content 補助。`color.content.secondary` 近傍） |\n| danger テキスト・ボーダー / container | `color.status.danger.base`(#e93766) / `.container`(#fef2f4) |\n| disabled テキスト / 背景 | `color.content.disabled`(#a1afc0) / `color.surface.sunken` |\n| focus ring | `color.border.focus`(= primary-700) |\n\n---\n\n## 7. Accessibility\n- ネイティブ `<button>` を使用（role 明示不要）\n- アイコンのみ: `aria-label` 必須 / loading: `aria-busy=\"true\"` + 操作不可 / トグル: `aria-pressed`\n- キーボード: Tab 移動・Enter/Space 実行。Disabled はキーボードからも操作不可\n- コントラスト: テキスト 4.5:1・アイコン 3:1 以上。フォーカスリングを必ず可視化\n\n## 8. Content Guidelines\n- 動詞始まり（「保存する」「削除する」「詳細を見る」）・結果が予測可能・最大3単語目安\n- 「はい/いいえ」より具体的なラベル\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: CTA は contained を1つ -->\n<button class=\"inline-flex items-center justify-center gap-1 h-9 px-3 text-[14px] font-medium tracking-[0.28px] text-white bg-primary-700 rounded hover:bg-primary-600 active:bg-primary-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1 transition-colors\">保存する</button>\n\n<!-- Do: ダイアログフッター（Subtle → Contained） -->\n<div class=\"flex justify-end gap-2\">\n  <button class=\"... text-[#3e5062] rounded hover:bg-[#edf0f3] ...\">キャンセル</button>\n  <button class=\"... text-white bg-primary-700 rounded hover:bg-primary-600 ...\">確認する</button>\n</div>\n```\n\n**Don't**: `bg-red-500` のフィル型 Danger（→アウトライン型）/ `focus:ring-primary-500/50`（→`ring-primary-700 ring-offset-1`）/ Loading でラベル非表示 / Lighted 単独使用 / アイコンボタンの `aria-label` 省略 / 同 variant の横並び（Neutral 除く）。\n\n---\n\n## 10. Implementation Notes\n- スピナーは `.inline-spinner`（`COMPONENT_GUIDE.md` 状態設計）を再利用。アイコンは Lucide\n- 思想は `FOUNDATIONS.md`、使い分けは `COMPONENT_GUIDE.md`\n", "base/navigation/Tabs.md": "# Component Guideline: Tabs\n\n> NestUI Tabs 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Tabs\n- **Variants**: `underline`（下線インジケーター・既定）\n- **Responsibility**:\n  - する: 同一ページ内で関連するコンテンツ群を切り替え表示する。常に1つだけアクティブ\n  - しない: ページ遷移（`<a>` / Text link を使う）、ウィザードのステップ管理（Stepper を使う）、垂直方向のグローバルナビ（Side nav を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 1つだけアクティブ / アクティブタブは下線インジケーターで明示 / 矢印キーでタブ間移動（disabled はスキップ）。\n\n---\n\n## 2. Variants & States\n\n**Tab List**: `flex border-b border-slate-200`\n\n**Tab Item 状態**\n\n| 状態 | class |\n|------|-------|\n| **Selected** | `h-[40px] px-4 inline-flex items-center justify-center relative border-b-2 border-primary-700 rounded-tl-[2px] rounded-tr-[2px] text-[14px] font-medium text-primary-700 tracking-[0.28px] hover:bg-primary-50 active:bg-primary-100 cursor-default outline-none` |\n| **Unselected** | `h-[40px] px-4 inline-flex items-center justify-center relative rounded-[2px] text-[14px] font-medium text-body tracking-[0.28px] hover:bg-primary-50 active:bg-primary-100 cursor-pointer outline-none` |\n| **Disabled** | `h-[40px] px-4 inline-flex items-center justify-center relative text-[14px] font-medium text-slate-300 tracking-[0.28px] cursor-not-allowed` |\n| **Focus** | 上記に `focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1` を付与 |\n\n**Tab Panel**: `py-4`\n\n---\n\n## 3. プロパティ早見\n\n| プロパティ | Selected | Unselected | Disabled |\n|-----------|----------|------------|----------|\n| 高さ / 横 padding | `h-[40px]` / `px-4` | `h-[40px]` / `px-4` | `h-[40px]` / `px-4` |\n| テキスト色 | `text-primary-700` | `text-body` | `text-slate-300` |\n| 下線 | `border-b-2 border-primary-700` | なし | なし |\n| 角丸 | `rounded-tl-[2px] rounded-tr-[2px]` | `rounded-[2px]` | — |\n| hover / active 背景 | `hover:bg-primary-50` / `active:bg-primary-100` | 同左 | — |\n| カーソル | `cursor-default` | `cursor-pointer` | `cursor-not-allowed` |\n\n---\n\n## 4. Composition Rules\n\n- 許可: `<Tab>` 内にテキスト、アイコン（`<svg>`）+ テキスト\n- 禁止: `<Tab>` 内のフォーム要素 / `<TabList>` 内に `<Tab>` 以外の要素\n- タブ数は6個以内を目安。7個以上は認知負荷が上がるため Dropdown や Side nav を検討\n- Tabs をページ間遷移に使わない（ルーター連携時は `<a>` で実装）\n\n---\n\n## 5. Layout & Spacing\n\n- タブ高さ `h-[40px]` 固定 + `inline-flex items-center`（`py-2.5` 等の可変パディング禁止）\n- 横 padding `px-4`、下線 `border-b-2`（2px）、Tab Panel `py-4`\n- letter-spacing は `tracking-[0.28px]`（フォントの2%）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class | トークン |\n|------|-------|---------|\n| アクティブテキスト・下線 | `text-primary-700` / `border-primary-700` | `color.primary.700` |\n| 非アクティブテキスト | `text-body` | `color.content.primary` |\n| Disabled テキスト | `text-slate-300` | `color.content.disabled` |\n| hover / active 背景 | `bg-primary-50` / `bg-primary-100` | `color.primary.50` / `.100` |\n| Tab List 区切り線 | `border-slate-200` | `color.border.subtle` |\n| focus ring | `ring-primary-700` | `color.border.focus` |\n\n---\n\n## 7. Accessibility\n- `role=\"tablist\"`（コンテナ）/ `role=\"tab\"`（各タブ）/ `role=\"tabpanel\"`（各パネル）\n- `aria-selected=\"true/false\"`、`aria-controls`（タブ→パネル id）、`aria-labelledby`（パネル→タブ id）\n- `tabindex`: Selected `\"0\"` / Unselected `\"-1\"`\n- キーボード: `←`/`→` で前後移動（disabled スキップ）、`Home`/`End` で先頭/末尾\n\n## 8. Content Guidelines\n- タブラベルは名詞（ビュー名）。「概要」「設定」「ログ」「メンバー」。動詞は使わない\n- 最大3単語以内。アイコンのみのタブは `aria-label` 必須\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do -->\n<div role=\"tablist\" aria-label=\"設定タブ\" class=\"flex border-b border-slate-200\">\n  <button role=\"tab\" aria-selected=\"true\" aria-controls=\"panel-1\" id=\"tab-1\" tabindex=\"0\"\n    class=\"h-[40px] px-4 inline-flex items-center justify-center relative border-b-2 border-primary-700 rounded-tl-[2px] rounded-tr-[2px] text-[14px] font-medium text-primary-700 tracking-[0.28px] hover:bg-primary-50 active:bg-primary-100 cursor-default outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">一般</button>\n  <button role=\"tab\" aria-selected=\"false\" aria-controls=\"panel-2\" id=\"tab-2\" tabindex=\"-1\"\n    class=\"h-[40px] px-4 inline-flex items-center justify-center relative rounded-[2px] text-[14px] font-medium text-body tracking-[0.28px] hover:bg-primary-50 active:bg-primary-100 cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">通知</button>\n</div>\n<div id=\"panel-1\" role=\"tabpanel\" aria-labelledby=\"tab-1\" tabindex=\"0\" class=\"py-4\">…</div>\n```\n\n**Don't**: `tabindex` 管理の省略（Selected `0` / 非選択 `-1`）/ `aria-selected` の省略 / `aria-controls` の省略 / `text-primary-500` のアクティブ色（→`text-primary-700 border-primary-700`）/ `py-2.5` のパディング（→`h-[40px]` 固定 + `inline-flex items-center`）/ ページ遷移にタブを使う。\n\n---\n\n## 10. Implementation Notes\n- `switchTab` / `handleTabKeydown` を JS で実装。Selected 切替時に `aria-selected` `tabindex` とクラスを同期、対応パネルの `hidden` を切替\n- 非アクティブパネルは `hidden`。重いコンテンツ（チャート・テーブル）は遅延表示を推奨\n- アイコンは Lucide\n", "base/navigation/Side nav.md": "# Component Guideline: Side nav\n\n> NestUI Sidebar 仕様。Tailwind CSS。値は `tokens/`（色は `color.surface.*` / `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Side nav\n- **Variants**: `expanded`（標準 ~188px）/ `collapsed`（コンパクト ~56px・アイコンのみ）\n- **Responsibility**:\n  - する: アプリ全ページ共通のメインナビゲーション。現在地の明示と最短到達の構造を保つ\n  - しない: ページ内コンテキストの切り替え（Tabs を使う）、一時的メニュー（Popover を使う）、アクション配置（Navbars / Button を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 3ゾーン構成（Header=ロゴ / Navigation=メインナビ / Footer=アカウント）/ 現在地は背景色 + テキスト色の2手がかりで示す（色のみ禁止）/ 標準↔コンパクトのトグル対応。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 幅 | 説明 |\n|---------|-----|------|\n| `expanded`（標準・既定） | `~188px` | アイコン + テキスト表示 |\n| `collapsed`（コンパクト） | `~56px` | アイコンのみ。通知はドットで表示・各アイテムに `aria-label` + `title` 必須 |\n\nContainer 共通: `<aside>` に `bg-[#edf0f3] flex-shrink-0 flex flex-col h-screen`。`bg-white` 系背景・右ボーダー（`border-r`）は禁止。\n\n**States**（Nav Item）\n\n| State | class |\n|-------|-------|\n| Default | `text-[#081a27] font-medium text-[14px] hover:bg-[#dde3eb] rounded-[4px] transition-colors` |\n| Selected / Active | `bg-[#dde3eb] text-[#081a27] font-medium rounded-[4px]` + `aria-current=\"page\"` |\n| Hover | `bg-[#dde3eb]`（Selected と同色） |\n| Press | `bg-[#c4cdd9]` |\n| Focus | `outline-none ring-2 ring-[#2661cf] ring-offset-1 rounded-[4px]` |\n| Disabled | `text-[#a1afc0] cursor-not-allowed` + `aria-disabled=\"true\"` + `tabindex=\"-1\"` |\n\n---\n\n## 3. Parts / 構成\n\n3ゾーン（Header / Navigation / Footer）が必須。\n\n| パーツ | 要素 | 必須 | class |\n|--------|------|:----:|------|\n| Container | `<aside>` | Yes | `bg-[#edf0f3] flex flex-col h-screen`（幅 188px / 56px） |\n| Header | `<div>` | Yes | `h-[68px] pl-[12px] py-[20px]`（ロゴ表示） |\n| Navigation | `<nav>` | Yes | `flex-1 overflow-y-auto flex flex-col gap-[6px] pl-[12px]` + `aria-label=\"メインナビゲーション\"` |\n| Collapse Button | `<button>` | No | 折りたたみトグル（Chevrons-left/right アイコン + \"折りたたむ\"） |\n| Section Label | `<p>` | No | `text-[12px] font-medium text-[#5a6c7f] px-[8px] pt-[4px]`（コンパクト時は `bg-[#c4cdd9] h-px` の水平線に置換） |\n| Nav Item | `<a>` / `<button>` | Yes | `flex items-center gap-[6px] h-[32px] px-[8px] rounded-[4px]` |\n| Nav Icon | `<svg>` | Yes | `w-[18px] h-[18px] flex-shrink-0` |\n| Badge | `<span>` | No | `rounded-[2px] bg-[#2661cf]`（コンパクト時はドット） |\n| Footer | `<div>` | Yes | `pb-[8px] pl-[8px]` |\n| Account Card | `<button>` | Yes | `bg-[#f7f9fb] rounded-[6px] shadow-sm`（幅 172px） |\n\n---\n\n## 4. Badge / Account Card\n\n**Badge**\n\n| バリエーション | class |\n|----------------|-------|\n| 標準テキストバッジ | `bg-[#2661cf] text-white rounded-[2px] min-w-[20px] h-[20px] px-[4px] text-[11px] font-medium inline-flex items-center justify-center` |\n| コンパクト ドット | `absolute w-[8px] h-[8px] rounded-full bg-[#2661cf] top-[4px] left-[20px]` |\n\n**Account Card**\n\n| 状態 | class |\n|------|-------|\n| Default | `bg-[#f7f9fb] shadow-sm rounded-[6px] flex items-center gap-[8px] p-[8px]` |\n| Hover | `bg-[#edf0f3]` |\n| Press | `bg-[#ddedfc]` |\n| Focus | `ring-2 ring-[#2661cf] ring-offset-1 rounded-[6px]` |\n\nアバター: `w-[32px] h-[32px] rounded-full bg-[#ee8c29] text-white font-medium text-[16px]`（オレンジ = ブランドアクセント）。\n\n---\n\n## 5. Layout & Spacing\n\n- 幅は `~188px`（標準）/ `~56px`（コンパクト）。`w-64` / `w-60` 等の固定幅クラスは使わない\n- Header 高さ `h-[68px]`、Nav アイテム高さ `h-[32px]`、アイテム間 `gap-[6px]`\n- コンパクト時: Nav Item は `size-[32px] justify-center px-0`、Account Card はアバターのみ\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class（Hex） | トークン |\n|------|------|---------|\n| サイドバー背景 | `bg-[#edf0f3]` | `color.surface.sunken` |\n| Active/Hover 背景 | `bg-[#dde3eb]` | `color.border.subtle` 近傍（操作面） |\n| Press 背景 | `bg-[#c4cdd9]` | `color.border.default` |\n| バッジ背景 | `bg-[#2661cf]` | `color.primary.700` |\n| アカウントカード背景 | `bg-[#f7f9fb]` | `color.surface.base` |\n| メインテキスト | `text-[#081a27]` | `color.content.primary` |\n| セクションラベル | `text-[#5a6c7f]` | `color.content.secondary` |\n| Disabled テキスト | `text-[#a1afc0]` | `color.content.disabled` |\n| アバター（オレンジ） | `bg-[#ee8c29]` | `color.brand`（アクセント） |\n| フォーカスリング / 仕切り線 | `ring-[#2661cf]` / `bg-[#c4cdd9]` | `color.border.focus` / `color.border.default` |\n\n---\n\n## 7. Accessibility\n- `<nav aria-label=\"メインナビゲーション\">` 必須。ランドマークは `<aside>` を使用しメインは `<main>` で囲む\n- Active ナビアイテムに `aria-current=\"page\"` 付与（色のみで現在地を伝えない）\n- コンパクト時は各アイコンに `aria-label` + `title` 必須\n- Disabled は `aria-disabled=\"true\"` + `tabindex=\"-1\"`（キーボードからも操作不可）\n\n## 8. Content Guidelines\n- ラベルは名詞（画面名・セクション名）。動詞は使わない（「設定する」→「設定」）\n- セクションラベルは短く（「案件」「メッセージ」「データベース」）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 3ゾーン + Active に aria-current -->\n<aside class=\"bg-[#edf0f3] flex-shrink-0 flex flex-col h-screen\" style=\"width:188px;\">\n  <div class=\"flex items-center pl-[12px] py-[20px] h-[68px]\"><!-- ロゴ --></div>\n  <nav class=\"flex-1 overflow-y-auto flex flex-col gap-[6px] pl-[12px] pb-[8px]\" aria-label=\"メインナビゲーション\">\n    <p class=\"text-[12px] font-medium text-[#5a6c7f] px-[8px] pt-[4px]\">案件</p>\n    <a href=\"#\" aria-current=\"page\" class=\"flex items-center gap-[6px] h-[32px] px-[8px] rounded-[4px] text-[14px] font-medium text-[#081a27] bg-[#dde3eb]\">\n      <svg class=\"w-[18px] h-[18px] flex-shrink-0\">...</svg>案件・工事修繕\n    </a>\n  </nav>\n  <div class=\"pb-[8px] pl-[8px]\"><!-- Account Card --></div>\n</aside>\n```\n\n**Don't**: `bg-white` 背景（→`bg-[#edf0f3]`）/ `border-r border-slate-200` の右ボーダー（不要）/ `rounded-lg` のアイテム角丸（→`rounded-[4px]`）/ Active に `bg-primary-50` `text-primary-500`（→`bg-[#dde3eb]` + `text-[#081a27]`）/ 左端の色付き縦アクセントバー（`border-l-4` 等）で現在地を示す（→ 背景色 + テキスト色 + `aria-current=\"page\"` で示す）/ バッジに `rounded-full`（→`rounded-[2px]`）/ `w-64` 等の固定幅 / `<nav>` の `aria-label` 省略 / コンパクト時アイコンの `aria-label` 省略 / Side nav 内へのアクションボタン配置（→Navbars）。\n\n---\n\n## 10. Implementation Notes\n- 標準↔コンパクト切替: `transition: width 300ms ease-in-out` + テキスト `opacity 200ms ease`。折りたたみ状態はローカルストレージに保存\n- コンパクト時は各アイテムに Tooltip でラベルを補完\n- アイコンは Lucide（`w-[18px] h-[18px]`）。Section Label はコンパクト時に水平線へ置換\n", "base/navigation/Navbars.md": "# Component Guideline: Navbars\n\n> NestUI Page Header 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` 等）を正とし、以下の class はその適用例。\n> NestUI での実体は「ページ単位の見出し」= Breadcrumbs + Title + Status tag を組み合わせた複合コンポーネント。\n\n## 1. Component Identity\n- **Name**: Navbars（Page Header）\n- **Variants**: レベル `H1`（ページ）/ `H2`（セクション）/ `H3`（サブセクション）。オプションで BreadCrumb・Status tag を付与\n- **Responsibility**:\n  - する: 現在地（Breadcrumbs）+ 見出し（Title）でページ文脈を即座に伝える。3レベルの見出し体系を一貫して維持する\n  - しない: ページ内コンテンツの切り替え（Tabs を使う）、グローバルナビ（Side nav を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: ページ構造を明示（BreadCrumb で現在地 + Title で見出し）/ 3レベル階層（H1/H2/H3）を一貫運用 / BreadCrumb と Status は任意付与、最小構成はタイトル単体 / 見出しレベルに応じて `<h1>` / `<h2>` / `<h3>` を使う。\n\n---\n\n## 2. Variants & States\n\n**レベル（Title）**\n\n| レベル | 用途 | class |\n|--------|------|------|\n| H1 | ページ見出し | `text-[21px] font-bold text-body leading-[1.5] tracking-[0.63px] whitespace-nowrap` |\n| H2 | セクション見出し | `text-[16px] font-bold text-body leading-[1.5] tracking-[0.48px] whitespace-nowrap` |\n| H3 | サブセクション見出し | `text-[14px] font-bold text-body leading-[1.5] whitespace-nowrap` |\n\n**オプション**\n\n| オプション | 説明 |\n|-----------|------|\n| BreadCrumb あり | 上位階層へのリンク + 現在ページ名 |\n| BreadCrumb なし | タイトル単体（トップレベルページ等） |\n| Status あり | タイトル右に Status tag を表示 |\n\nStatus tag は静的表示（状態は対象オブジェクトに依存）。\n\n---\n\n## 3. Parts / 構成\n\n| パーツ | 役割 | 必須 | class |\n|--------|------|:----:|------|\n| ラッパー | 全体コンテナ | Yes | `flex flex-col gap-[4px] items-start` |\n| BreadCrumb | 現在位置の階層パス（→Breadcrumbs） | No | `<nav aria-label=\"パンくずリスト\">` + `<ol class=\"flex items-center gap-0.5\">` |\n| タイトル行 | Title + Status | Yes | `flex items-center gap-2` |\n| Title | ページ/セクション/サブセクション見出し | Yes | `<h1>` / `<h2>` / `<h3>`（上記レベル class） |\n| Status Tag | オブジェクトのステータス表示（→Status tag） | No | `inline-flex items-center gap-1.5 px-1.5 py-0.5 bg-[#d5f6e6] rounded-[4px]`（ドット `w-2 h-2 rounded-full bg-[#5eb62c]` + テキスト `text-[11px] text-[#376f1c]`） |\n\n---\n\n## 4. Composition Rules\n\n- 許可: BreadCrumb（Breadcrumbs）、見出しテキスト、Status tag\n- 禁止: `<div>` で見出しを代替（セマンティクス欠如）、H1 をページに複数配置、BreadCrumb の現在ページをリンクにする、Status を色だけで伝える\n- BreadCrumb の実装規約は Breadcrumbs に準拠（Chevron-right セパレータ・現在ページは `<span>`）\n\n---\n\n## 5. Layout & Spacing\n\n- ラッパーは縦並び `flex-col gap-[4px] items-start`（BreadCrumb → タイトル行）\n- タイトル行は `flex items-center gap-2`（Title と Status を横並び）\n- H1 字間 `tracking-[0.63px]`、H2 `tracking-[0.48px]`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class（Hex） | トークン |\n|------|------|---------|\n| Title テキスト | `text-body`（#081a27） | `color.content.primary` |\n| BreadCrumb リンク | `text-primary-700` | `color.primary.700` |\n| BreadCrumb リンク hover | `text-primary-600` | `color.primary.600` |\n| BreadCrumb 現在ページ | `text-[#3e5062]` | `color.content.secondary` 近傍 |\n| BreadCrumb セパレータ | `text-slate-400` | `color.content.disabled` 近傍 |\n| Status 背景 / ドット / テキスト | `bg-[#d5f6e6]` / `bg-[#5eb62c]` / `text-[#376f1c]` | `color.status.success.container` / `.fill` / `.text` |\n\n---\n\n## 7. Accessibility\n- 見出しはレベルに応じて `<h1>` / `<h2>` / `<h3>`。`<h1>` はページに1つ\n- BreadCrumb 外枠は `<nav aria-label=\"パンくずリスト\">`、現在ページに `aria-current=\"page\"`\n- Status は色だけで状態を伝えず、テキストを必ず併用\n\n## 8. Content Guidelines\n- Title は対象の正式名称（「案件」「基本情報」「担当者情報」）\n- BreadCrumb の最後（現在ページ）はリンクなし。Status ラベルは状態名（「契約中」等）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: H1 + BreadCrumb + Status -->\n<div class=\"flex flex-col gap-[4px] items-start\">\n  <nav aria-label=\"パンくずリスト\">\n    <ol class=\"flex items-center gap-0.5\">\n      <li class=\"flex items-center gap-1\">\n        <a href=\"#\" class=\"text-[14px] font-medium text-primary-700 underline hover:text-primary-600 leading-[1.3] tracking-[0.28px] transition-colors\">ホーム</a>\n        <svg class=\"w-4 h-4 flex-shrink-0 text-slate-400\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"/></svg>\n      </li>\n      <li><span class=\"text-[14px] font-medium text-[#3e5062] leading-[1.3] tracking-[0.28px]\" aria-current=\"page\">案件</span></li>\n    </ol>\n  </nav>\n  <div class=\"flex items-center gap-2\">\n    <h1 class=\"text-[21px] font-bold text-body leading-[1.5] tracking-[0.63px] whitespace-nowrap\">案件</h1>\n    <div class=\"inline-flex items-center gap-1.5 px-1.5 py-0.5 bg-[#d5f6e6] rounded-[4px]\">\n      <span class=\"w-2 h-2 rounded-full bg-[#5eb62c] flex-shrink-0\"></span>\n      <span class=\"text-[11px] font-normal text-[#376f1c] leading-[1.75] whitespace-nowrap\">契約中</span>\n    </div>\n  </div>\n</div>\n```\n\n**Don't**: `<div>` で見出しを代替（→`<h1/2/3>`）/ H1 をページに複数配置 / BreadCrumb の現在ページをリンクにする（→`aria-current=\"page\"`）/ Status の色だけで状態を伝える（→アイコン or テキスト併用）/ `text-black` `text-slate-900` を見出しに使う（→`text-body`）。\n\n---\n\n## 11. Implementation Notes\n- BreadCrumb は Breadcrumbs コンポーネントを流用、Status は Status tag を流用\n- ページ最上部に配置し、その下に Tabs や本文を続ける構成が標準\n", "base/navigation/Breadcrumbs.md": "# Component Guideline: Breadcrumbs\n\n> NestUI Breadcrumb 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Breadcrumbs\n- **Variants**: `default`（1階層 / 2〜3階層）\n- **Responsibility**:\n  - する: 現在ページがサイト構造のどこに位置するかを示す。上位階層へ素早く移動できる\n  - しない: フラットな1階層のみのナビ、タブ切り替え（Tabs を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 階層構造を可視化 / `<nav>` + `<ol>` でセマンティックに構造化 / セパレータは Chevron-right SVG のみ（`/` スラッシュ禁止）。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| 階層数 | 説明 |\n|--------|------|\n| 1階層 | リンクのみ（Chevron なし） |\n| 2〜3階層 | Text link × N + Chevron-right セパレータ + 現在ページ（リンクなし）。3階層を推奨、4以上は省略表示を検討 |\n\n**States**\n\n| State | 変化 |\n|-------|------|\n| Default（リンク） | `text-primary-700 underline` |\n| Hover（リンク） | `hover:text-primary-600 transition-colors` |\n| 現在ページ | `text-[#3e5062]`（リンクにしない・`<span>` + `aria-current=\"page\"`） |\n\n---\n\n## 3. Parts / 構成\n\n| パーツ | 役割 | 必須 | class |\n|--------|------|:----:|------|\n| Nav Container | `<nav aria-label=\"パンくずリスト\">` | Yes | — |\n| Ordered List | `<ol>` でリスト構造を明示 | Yes | `flex items-center gap-0.5` |\n| Link Item | 上位階層へのリンク `<li>` | Yes | `flex items-center gap-1` |\n| Link Text | リンクテキスト | Yes | `text-[14px] font-medium text-primary-700 underline hover:text-primary-600 leading-[1.3] tracking-[0.28px] transition-colors` |\n| Chevron-right | Lucide SVG セパレータ | Yes | `w-4 h-4 flex-shrink-0 text-slate-400` |\n| Current Page | 現在ページ名（リンクなし） | Yes | `text-[14px] font-medium text-[#3e5062] leading-[1.3] tracking-[0.28px]` + `aria-current=\"page\"` |\n\n---\n\n## 4. Composition Rules\n\n- 許可: テキストノード、リンク（`<a>`）、Chevron-right SVG\n- 禁止: `<button>`（リンク以外のアクションを置かない）/ フォーム要素 / `/` スラッシュ区切り\n- 現在ページ（最後のアイテム）は `<span>` でリンクにしない\n\n---\n\n## 5. Layout & Spacing\n\n- `<ol>` は `gap-0.5`、リンク項目内（テキスト + Chevron）は `gap-1`\n- Chevron は `w-4 h-4`、リンク行高 `leading-[1.3]`、字間 `tracking-[0.28px]`（2%）\n- 長いラベルは省略（`text-overflow: ellipsis`）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class | トークン |\n|------|-------|---------|\n| リンクテキスト | `text-primary-700` | `color.primary.700` |\n| リンク hover | `text-primary-600` | `color.primary.600` |\n| 現在ページテキスト | `text-[#3e5062]` | `color.content.secondary` 近傍 |\n| セパレータ | `text-slate-400` | `color.content.disabled` 近傍 |\n\n---\n\n## 7. Accessibility\n- `<nav aria-label=\"パンくずリスト\">` + `<ol>` で構造を明示\n- 現在ページに `aria-current=\"page\"`（リンクにしない・`<span>` 使用）\n- キーボード: `Tab` でリンク間移動、`Enter` で遷移\n\n## 8. Content Guidelines\n- ラベルはページ/セクションの正式名称（略称は避ける）\n- 最初は「ホーム」またはルートセクション名、最後（現在ページ）はリンクなし\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 3階層（Chevron-right セパレータ + 現在ページは span） -->\n<nav aria-label=\"パンくずリスト\">\n  <ol class=\"flex items-center gap-0.5\">\n    <li class=\"flex items-center gap-1\">\n      <a href=\"#\" class=\"text-[14px] font-medium text-primary-700 underline hover:text-primary-600 leading-[1.3] tracking-[0.28px] transition-colors\">ホーム</a>\n      <svg class=\"w-4 h-4 flex-shrink-0 text-slate-400\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"/></svg>\n    </li>\n    <li class=\"flex items-center gap-1\">\n      <a href=\"#\" class=\"text-[14px] font-medium text-primary-700 underline hover:text-primary-600 leading-[1.3] tracking-[0.28px] transition-colors\">設定</a>\n      <svg class=\"w-4 h-4 flex-shrink-0 text-slate-400\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"/></svg>\n    </li>\n    <li><span class=\"text-[14px] font-medium text-[#3e5062] leading-[1.3] tracking-[0.28px]\" aria-current=\"page\">プロフィール</span></li>\n  </ol>\n</nav>\n```\n\n**Don't**: `/` スラッシュをセパレータに使う（→Chevron-right SVG のみ）/ 現在ページをリンクにする（→`<span>` + `aria-current=\"page\"`）/ `aria-current=\"page\"` の省略 / 4階層以上の表示（→3階層推奨・以上は省略）/ `text-slate-500` 等の汎用カラーをリンク色にする（→`text-primary-700`）。\n\n---\n\n## 10. Implementation Notes\n- セパレータは Lucide chevron-right を `<svg>` で直書き（`text-slate-400`）\n- SEO 用途では `<ol>` + JSON-LD（BreadcrumbList）の併用を推奨\n- Page Header（Navbars 参照）と組み合わせて使うことが多い\n", "base/navigation/Pagination.md": "# Component Guideline: Pagination\n\n> NestUI Pagination 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Pagination\n- **Variants**: `基本`（連続ページ番号 + prev/next）/ `Ellipsis 付き`（`1 … 4 [5] 6 … 20`）/ `件数付き` / `ページ数セレクター付き`\n- **Responsibility**:\n  - する: コンテンツを複数ページに分割しページ間を移動する。現在位置を明示する\n  - しない: データフェッチ・ページコンテンツの管理（親の責務）、フィルター（Dropdown を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: ボタンは `w-8 h-8`（32px）でデスクトップ業務UIに最適化 / アクティブは `bg-primary-100 text-primary-700`（白抜きは使わない）/ ページ数が多い場合は `…` で中間省略 / 一覧画面では件数表示と「N件/ページ」セレクターを組み合わせる。\n\n---\n\n## 2. Variants & States\n\n**Parts / NumItem（ページ番号ボタン）** — `w-8 h-8 inline-flex items-center justify-center relative rounded text-[14px] font-medium tracking-[0.28px]`\n\n| 状態 | class |\n|------|-------|\n| Selected（アクティブ） | `bg-primary-100 text-primary-700`（`#ddedfc` / `#2661cf`）+ `aria-current=\"page\"` |\n| Enable | `text-[#3e5062] hover:bg-[#edf0f3] active:bg-primary-100 cursor-pointer` |\n| Disable | `text-[#a1afc0] cursor-not-allowed`（背景なし） |\n| Focus | `focus-visible:outline-none` + 絶対配置フォーカスリング（`border-2 border-primary-700 rounded inset-[-3px]`） |\n\n**Parts / Pager（Prev/Next 矢印）** — `min-h-[32px] px-1 inline-flex items-center justify-center relative rounded`（アイコン `w-6 h-6`）\n\n| 状態 | class |\n|------|-------|\n| Enable | `hover:bg-[#edf0f3] active:bg-primary-100 cursor-pointer`（アイコン `text-[#3e5062]`） |\n| Disable | `cursor-not-allowed`（アイコン `text-[#a1afc0]`） + `disabled` |\n\n**Ellipsis**: `w-8 h-8 inline-flex items-center justify-center text-[#5a6c7f] text-[14px]` + `aria-hidden=\"true\"`\n\n---\n\n## 3. Parts / 構成\n\n| パーツ | 役割 | 必須 |\n|--------|------|:----:|\n| Nav Container | `<nav aria-label=\"ページネーション\">` | Yes |\n| Count Label | 総件数テキスト `\"N件\"`（`text-[14px] font-medium text-[#5a6c7f] tracking-[0.28px] shrink-0`） | No（一覧画面では推奨） |\n| Prev Button（Pager） | 前のページへ | Yes |\n| Page Button（NumItem） | ページ番号ボタン | Yes |\n| Next Button（Pager） | 次のページへ | Yes |\n| Ellipsis | 省略記号 `…` | No |\n| Per-Page Selector | 「N件 / ページ」表示数切替（Dropdown トリガー） | No（一覧画面では推奨） |\n\nレイアウト: `flex items-center gap-1`。\n\n---\n\n## 4. Composition Rules\n\n- 許可: NumItem / Pager / Ellipsis / Count Label / Per-Page Selector\n- Per-Page Selector は Dropdown のフィルタートリガー（`h-8`）を流用し、ラベルは「50件 / ページ」等の固定テキスト\n- 先頭ページでは Prev を `disabled`、末尾ページでは Next を `disabled`\n- `totalPages` が 1 のときは Pagination を表示しない\n\n---\n\n## 5. Layout & Spacing\n\n- ボタンサイズ `w-8 h-8`（32px）固定。`w-10 h-10` は使わない\n- アイテム間 `gap-1`、Pager アイコン `w-6 h-6`、角丸は `rounded`（`rounded-lg` 禁止）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class（Hex） | トークン |\n|------|------|---------|\n| アクティブ背景 / テキスト | `bg-primary-100` / `text-primary-700` | `color.primary.100` / `.700` |\n| Enable テキスト | `text-[#3e5062]` | `color.content.secondary` 近傍 |\n| hover 背景 / press 背景 | `bg-[#edf0f3]` / `bg-primary-100` | `color.surface.sunken` / `color.primary.100` |\n| Disable テキスト | `text-[#a1afc0]` | `color.content.disabled` |\n| 件数 / Ellipsis テキスト | `text-[#5a6c7f]` | `color.content.secondary` |\n| Per-Page トリガー枠 | `border-[#c4cdd9] bg-[#f7f9fb]` | `color.border.default` / `color.surface.base` |\n| focus ring | `border-primary-700` | `color.border.focus` |\n\n---\n\n## 7. Accessibility\n- `<nav aria-label=\"ページネーション\">`、アクティブページに `aria-current=\"page\"`\n- 各ボタンに `aria-label=\"ページ N\"` / `\"前のページ\"` / `\"次のページ\"`\n- 先頭/末尾で prev/next を `disabled`、Ellipsis の `<span>` に `aria-hidden=\"true\"`\n- タップ領域 `w-8 h-8`（デスクトップ業務UI基準）。ページ番号はアラビア数字のみ\n\n## 8. Content Guidelines\n- 件数表示は桁区切り付き（「14,874件」）\n- Per-Page ラベルは「50件 / ページ」等の固定文言\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 件数 + prev/next + アクティブページ -->\n<div class=\"flex items-center gap-1\">\n  <span class=\"text-[14px] font-medium text-[#5a6c7f] tracking-[0.28px] shrink-0 mr-1\">14,874件</span>\n  <nav aria-label=\"ページネーション\">\n    <ul class=\"flex items-center gap-1\">\n      <li><button disabled class=\"min-h-[32px] px-1 inline-flex items-center justify-center rounded cursor-not-allowed\" aria-label=\"前のページ\"><svg class=\"w-6 h-6 text-[#a1afc0]\">…</svg></button></li>\n      <li><button class=\"w-8 h-8 inline-flex items-center justify-center rounded text-[14px] font-medium tracking-[0.28px] bg-primary-100 text-primary-700\" aria-current=\"page\" aria-label=\"ページ 1\">1</button></li>\n      <li><button class=\"w-8 h-8 inline-flex items-center justify-center rounded text-[14px] font-medium tracking-[0.28px] text-[#3e5062] hover:bg-[#edf0f3] active:bg-primary-100 cursor-pointer\" aria-label=\"ページ 2\">2</button></li>\n    </ul>\n  </nav>\n</div>\n```\n\n**Don't**: `w-10 h-10` のボタンサイズ（→`w-8 h-8`）/ `bg-primary-500` のアクティブ色（→`bg-primary-100 text-primary-700`）/ `rounded-lg`（→`rounded`）/ `aria-label` の省略（各ページボタンに必須）/ `aria-current=\"page\"` の省略 / `totalPages=1` で表示。\n\n---\n\n## 10. Implementation Notes\n- Per-Page Selector は Dropdown コンポーネントのトリガー（`.filter-dropdown-wrapper`）を流用\n- フォーカスは絶対配置のフォーカスリング要素で実装（NumItem / Pager 共通）\n- Table の下部に配置し、ページ変更時はリスト先頭へスクロール。一覧画面では件数 + Per-Page を組で配置するのが標準\n", "base/navigation/List Group.md": "# Component Guideline: List Group\n\n> NestUI List 仕様。Tailwind CSS。値は `tokens/`（色は `color.surface.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: List Group\n- **Variants**: `Link List`（遷移リスト）/ `Information List`（情報リスト）/ `Action List`（アクションリスト）/ `Overview List`（プレビュー）/ `Toggle List`（設定）/ `Selection List`（選択）/ `Accordion List`（折りたたみ）\n- **Responsibility**:\n  - する: 同種アイテムを縦並びで表示する。遷移・情報表示・アクション起動・選択に使う。高さはコンテンツに追従する可変高\n  - しない: 複数列のデータ表示（Table を使う）、フォーム内のオプション選択（Dropdown / Radio を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 左から右への情報フロー（主要コンテンツ左・補助要素右）/ 左アイコンは「対象の種類」、右アイコンは「対象へのアクション」/ ボーダーは情報の区切りを示す（装飾でなく断絶度の可視化）/ 見出しと本文のサイズ比は120〜150%。\n\n---\n\n## 2. Variants & States\n\n**Variants**（用途別パターン）\n\n| Variant | 用途 |\n|---------|------|\n| Link List | アイテム内容が遷移先タイトルと一致。メニューに使用（右に Chevron） |\n| Information List | 遷移/アクションなしの自己完結型（ステータス・優先度・作成日 等） |\n| Action List | ラベルがアクション名。左アイコン=種類、右アイコン=アクション |\n| Overview List | 遷移先コンテンツのプレビュー（タイトル + 1行抜粋） |\n| Toggle List | 即時反映の ON/OFF 設定 |\n| Selection List | 選択/非選択を保持（色だけでなくボーダー太さ・背景で表現） |\n| Accordion List | 展開/折りたたみ（スペース節約） |\n\n**States**\n\n| 状態 | 視覚変化 | class |\n|------|---------|------|\n| Default | 標準表示 | — |\n| Hover | 背景が薄く変化 | `hover:bg-gray-50` |\n| Active | さらに濃い背景 | クリック中 |\n| Focus | フォーカスリング | キーボード操作時 |\n| Selected | ボーダー強調 + 背景変化 | 色だけでなくボーダー太さも変更 |\n| Visited | テキスト色変化 | テキストリンクのみ |\n\n---\n\n## 3. Parts / 構成\n\n| パーツ | 役割 | 必須 |\n|--------|------|:----:|\n| Container | リストの外枠（`bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden`） | Yes |\n| Primary Text | メイン情報（遷移先タイトル / アクション名） | Yes |\n| Secondary Text | 補足情報（日付・説明・メタデータ） | No |\n| Left Icon | 対象の種類を示すアイコン | No |\n| Left Image | サムネイル（画像が主体の場合） | No |\n| Right Icon | アクション/遷移を示すアイコン（矢印・展開） | No |\n| Action | トグル・ボタン・チェックボックス | No |\n| Border | アイテム間の区切り（`divide-y divide-slate-100`） | 条件付き |\n\n---\n\n## 4. Composition Rules\n\n- 許可: 左アイコン（`<svg>`）、右アイコン、Badge / Status tag、テキスト（ラベル・説明）、Toggle\n- 禁止: 複数列データを List で表現（→Table）、List を Table の代替に使う、クリッカブル項目で `hover` 状態を省略、区切り線の省略\n- アイテム数 0 のときは List を描画せず Empty prompt を表示\n- 破壊的アクション項目は `text-[#e93766] hover:bg-[#fef2f4]`（`text-red-500` 禁止）\n\n**Anti-patterns**\n- NG: 左端に色付きの縦アクセントバー（border-left 等）で selected/active を示す → 選択は背景変化 + ボーダー太さ（全周）で示す（左端のみのカラーバーは使わない）\n\n---\n\n## 5. Layout & Spacing\n\n- アイテムは `px-4 py-3`（左右16px・上下12px）、`flex items-center justify-between`\n- 高さは固定せずコンテンツに追従（可変高）\n- 区切りは `divide-y divide-slate-100`、外枠角丸 `rounded-xl`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class | トークン |\n|------|-------|---------|\n| 外枠背景 | `bg-white` | `color.surface.raised` |\n| 外枠ボーダー | `border-slate-200` | `color.border.subtle` |\n| アイテム区切り | `divide-slate-100` | `color.border.subtle` |\n| hover 背景 | `hover:bg-gray-50` | `color.surface.sunken` |\n| ラベル | `text-slate-900` | `color.content.primary` |\n| 説明テキスト | `text-slate-500` | `color.content.secondary` |\n| 右アイコン | `text-slate-500` | `color.content.secondary` |\n| 破壊的アクション | `text-[#e93766]` / `hover:bg-[#fef2f4]` | `color.status.danger.base` / `.container` |\n\n---\n\n## 7. Accessibility\n- スワイプ/ドラッグ操作にはキーボード・ボタンの代替手段を必ず提供する\n- クリッカブル項目には適切な要素/ロールを付与（`<a>` / `<button>`、メニューは `role=\"menuitem\"`）\n- 装飾以外のアイコン（選択状態・展開状態のインジケーター）には代替テキストを付与\n- 追加・削除・状態変更は `aria-live` でスクリーンリーダーに通知\n- 選択/非選択を色だけで伝えない（ボーダー太さ・背景を併用）\n- テキスト 4.5:1・アイコン 3:1 以上のコントラスト。200%拡大でクリッピングしない\n\n## 8. Content Guidelines\n- ラベルは簡潔に（1行以内）、押した結果・遷移先を予測可能な文言にする\n- 説明テキストは補足のみ。メインラベルで意味が完結するようにする\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Link List（ナビゲーション・右 Chevron） -->\n<nav>\n  <ul class=\"bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden\">\n    <li>\n      <a href=\"#\" class=\"flex items-center justify-between px-4 py-3 hover:bg-gray-50 transition-colors\">\n        <span class=\"text-sm font-medium text-slate-900\">カンバンボード</span>\n        <svg class=\"w-4 h-4 text-slate-500\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M9 5l7 7-7 7\"/></svg>\n      </a>\n    </li>\n  </ul>\n</nav>\n\n<!-- Do: Action List の破壊的アクション -->\n<button class=\"w-full flex items-center gap-3 px-4 py-3 text-left text-[#e93766] hover:bg-[#fef2f4] transition-colors\">\n  <svg class=\"w-4 h-4\">…</svg><span class=\"text-sm font-medium\">削除する</span>\n</button>\n```\n\n**Don't**: インタラクティブ項目の `hover` 状態省略 / 区切り線（`divide-y` / `border-b`）の省略 / 複数列データを List で表現（→Table）/ アイテム数 0 で描画（→Empty prompt）/ `text-red-500`（→`text-[#e93766] hover:bg-[#fef2f4]`）。\n\n---\n\n## 10. Implementation Notes\n- 大量アイテム（100件以上）は仮想スクロールを検討。長いリストは Pagination または無限スクロールと併用\n- Accordion List は展開/折りたたみアニメーション付き（初期は `hidden`、展開で外す）。アイコンは Lucide\n", "base/navigation/Tree view.md": "# Component Guideline: Tree view\n\n> NestUI Tree Connector 仕様。Tailwind CSS。値は `tokens/`（色は `color.border.*` 等）を正とし、以下の class はその適用例。\n> NestUI での実体は「スレッド/返信/階層ビューで使う分岐コネクター」。32×40px の固定セルにラインを組み合わせ、ツリー状の接続関係を表現する。\n\n## 1. Component Identity\n- **Name**: Tree view（Tree Connector）\n- **Variants**: コネクター型 `┃`（たて）/ `━`（よこ）/ `┳`（よこした・分岐起点）/ `┣`（たてみぎ・中間）/ `┗`（ひだりした・最後）/ `（から）`（空白セル）\n- **Responsibility**:\n  - する: 階層構造・コメント返信スレッド・親子関係を分岐ラインで可視化する\n  - しない: フラットなリスト表示（List Group を使う）、深い階層のグローバルナビ（Side nav を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 固定セル（32×40px、または flex-1 で伸縮。grid では列幅 36px）/ ライン色は `#dde3eb`（DS 標準ボーダー）固定・変更不可 / ライン幅 1px 固定 / コネクターは装飾なので `aria-hidden=\"true\"`。\n\n---\n\n## 2. Variants & States\n\n**コネクター型**\n\n| 型 | 垂直ライン | 水平ライン | 用途 |\n|----|-----------|-----------|------|\n| `┃`（たて） | 上端→下端 | なし | 連続スレッドの中間 |\n| `━`（よこ） | なし | 左端→右端 | 水平区切り（単独使用） |\n| `┳`（よこした） | 中央→下端 | 左端→右端 | 分岐の起点（下に続く） |\n| `┣`（たてみぎ） | 上端→下端 | 中央→右端 | 中間の返信アイテム |\n| `┗`（ひだりした） | 上端→50% | 中央→右端 | 最後の返信アイテム |\n| `（から）` | なし | なし | 空白セル |\n\nライン位置（32×40px セル）: 垂直 `absolute top-0 bottom-0 left-[15px] w-px bg-[#dde3eb]` / 水平 `absolute left-[16px] right-0 top-[19px] h-px bg-[#dde3eb]`（┣ / ┗ のみ）。\n\n**States**: コネクターは静的。展開/折りたたみは親アイテム側で制御（コネクターは状態を持たない）。\n\n---\n\n## 3. Parts / 構成\n\n| パーツ | 役割 | 必須 | class |\n|--------|------|:----:|------|\n| Container | 32×40px の相対配置基点 | Yes | `relative w-8 h-10`（grid では列幅 36px + `self-stretch`） |\n| 垂直ライン | 上下の接続を示す線 | 型による | `absolute left-[15px] w-px bg-[#dde3eb]` |\n| 水平ライン | 横方向の分岐を示す線 | ┣ / ┗ のみ | `absolute left-[16px] right-0 h-px bg-[#dde3eb]` |\n\n---\n\n## 4. Composition Rules\n\n- 許可: Container 内に絶対配置の `<div>` ライン要素のみ\n- 禁止: `border-left` / `border-top` でのライン代替（必ず絶対配置 `div` で実装）、セル寸法（32px セル / 36px grid 列 / 40px 高さ）の変更、水平ラインを 2px 以上にすること\n- 入れ子: コンテンツ列を `pl-4`〜`pl-8` で段階的にインデントし、各レベルで同じコネクター構造を繰り返す\n\n---\n\n## 5. Layout & Spacing\n\n- Activity スレッド（主要ユースケース）は `grid-template-columns: 36px 1fr`（tree cell 36px | content cell 1fr）\n- セル高さは grid の `self-stretch` でコンテンツ高さに自動追従\n- 水平ラインの垂直位置: コンテンツに `py-3`（12px）を使う場合、アバター中央 = `12px(上padding) + 12px(アバター半径) = 24px` から → `style=\"top:24px\"`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class（Hex） | トークン |\n|------|------|---------|\n| 接続ライン色 | `bg-[#dde3eb]` | `color.border.subtle`（DS 標準ボーダー） |\n\n> ライン色は `#dde3eb` 固定で変更不可。`#dde3eb` は装飾ラインのため WCAG コントラスト要件対象外。\n\n---\n\n## 7. Accessibility\n- コネクター全体に `aria-hidden=\"true\"` を付与（支援技術から隠す）\n- スレッドの親子関係は `aria-label` や `role` でコンテンツ側に記述する\n- 操作可能なツリー（WAI-ARIA Tree パターン）として実装する場合は、コンテンツ側に `role=\"tree\"` / `role=\"treeitem\"` / `aria-expanded` / `aria-level` を付与\n\n## 8. Content Guidelines\n- コネクター自体はテキストを持たない。ノードラベルはコンテンツ列に簡潔に（ファイル名・エンティティ名・コメント本文）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Activity スレッド grid（┃ → ┣ → ┗） -->\n<div class=\"grid\" style=\"grid-template-columns:36px 1fr;\" aria-label=\"コメントスレッド\">\n  <!-- 親コメント: ┃ -->\n  <div class=\"relative self-stretch border-b border-slate-100\" aria-hidden=\"true\">\n    <div class=\"absolute top-0 bottom-0 left-[17px] w-px bg-[#dde3eb]\"></div>\n  </div>\n  <div class=\"pr-4 py-3 border-b border-slate-100\"><!-- 親コメント --></div>\n  <!-- 返信（最後）: ┗ -->\n  <div class=\"relative self-stretch\" aria-hidden=\"true\">\n    <div class=\"absolute top-0 bottom-[50%] left-[17px] w-px bg-[#dde3eb]\"></div>\n    <div class=\"absolute h-px bg-[#dde3eb]\" style=\"left:18px;right:0;top:24px;\"></div>\n  </div>\n  <div class=\"pr-4 py-3\"><!-- 返信 --></div>\n</div>\n```\n\n**Don't**: ライン色を `#dde3eb` 以外にする / `border-left` や `border-top` でラインを代替する（→絶対配置 `div`）/ セル寸法（32px / 36px / 40px）を変更する / 水平ライン高さを 2px 以上にする。\n\n---\n\n## 10. Implementation Notes\n- ラインは必ず絶対配置 `div`（`w-px` / `h-px`）で実装。`py-3` 使用時の水平ラインは `top:24px`（= 12px 上padding + 12px アバター半径）\n- 大量ノードはコンテンツ側で遅延ロード/仮想スクロールを検討\n", "base/navigation/Text link.md": "# Component Guideline: Text link\n\n> NestUI TextLink 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Text link\n- **Variants**: タイプ `inline`（同一タブ遷移・アンカー）/ `window`（別タブ・ExternalLink アイコン）/ `download`（DL・Download アイコン）。サイズ `md` / `sm` / `xs`\n- **Responsibility**:\n  - する: テキスト内・テーブル行・インラインヘルプから別ページ/外部/ファイルへ遷移する\n  - しない: 破壊的操作（削除・解除は Buttons の danger を使う）、アクションのトリガー（Buttons を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 遷移先を明示するラベル（「ここをクリック」禁止）/ 破壊的アクションには使わない / アイコン単独リンクはツールチップを併用 / 文字量の多い業務画面でも視認性を確保。\n\n---\n\n## 2. Variants & States\n\n**サイズ**\n\n| サイズ | font-size | letter-spacing | 用途 |\n|--------|-----------|----------------|------|\n| md | `text-[14px]` | `tracking-[0.28px]`（2%） | 標準テキスト・本文中 |\n| sm | `text-[12px]` | `tracking-[0.24px]`（2%） | テーブル行・コンパクト UI（標準） |\n| xs | `text-[11px]` | `tracking-[0.22px]`（2%） | 補足・メタ情報 |\n\n**タイプ**\n\n| タイプ | アイコン | 用途 |\n|--------|----------|------|\n| inline | なし | 同一タブ内ページ遷移・アンカー |\n| window | ExternalLink（`w-3 h-3`） | 別タブで開くページ |\n| download | Download（`w-3 h-3`） | ファイルダウンロード（`download` 属性） |\n\n**States**\n\n| 状態 | class | トークン |\n|------|-------|---------|\n| Default | `text-primary-700` | `color.primary.700` |\n| Hover | `hover:text-primary-800` | `color.primary.800` |\n| Press / Active | `active:text-primary-900` | `color.primary.900` |\n| Disabled | `text-[#a1afc0]`（`<span aria-disabled=\"true\">` で代替・underline 保持） | `color.content.disabled` |\n\nベースクラス共通: `inline-flex items-center gap-1 font-medium leading-[1.3] underline [text-decoration-skip-ink:none] transition-colors cursor-pointer rounded-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1`。\n\n---\n\n## 3. Parts / 構成\n\n| パーツ | 役割 | 必須 | class |\n|--------|------|:----:|------|\n| Label | リンク先・アクションを示すテキスト。underline 必須 | Yes | `underline [text-decoration-skip-ink:none]` |\n| Icon | ExternalLink（別タブ）/ Download（DL）。12×12px | No（window / download 時） | `w-3 h-3 flex-shrink-0` + `aria-hidden=\"true\"` |\n\n---\n\n## 4. Composition Rules\n\n- 許可: テキストラベル + 末尾アイコン（ExternalLink / Download）\n- 禁止: underline なし（リンクと判別不能）、アイコンのみのリンク（`aria-label` なし）、`<button>` でのページ遷移（href なし）、破壊的アクション\n- window タイプはラベル末尾に `<span class=\"sr-only\">（新しいタブで開く）</span>` を追加\n\n---\n\n## 5. Layout & Spacing\n\n- `inline-flex items-center gap-1`（テキストとアイコンの間 4px）\n- 行高 `leading-[1.3]`、字間はサイズ別（2%）\n- アイコンは 12×12px（`w-3 h-3`）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class | トークン |\n|------|-------|---------|\n| Default テキスト | `text-primary-700` | `color.primary.700` |\n| Hover テキスト | `text-primary-800` | `color.primary.800` |\n| Press テキスト | `text-primary-900` | `color.primary.900` |\n| Disabled テキスト | `text-[#a1afc0]` | `color.content.disabled` |\n| focus ring | `ring-primary-700` | `color.border.focus` |\n\n---\n\n## 7. Accessibility\n- `<a href=\"...\">` を使用（`<button>` は代替ページ遷移がない場合のみ）\n- 別タブは `target=\"_blank\" rel=\"noopener noreferrer\"` 必須 + ラベル末尾に `<span class=\"sr-only\">（新しいタブで開く）</span>`\n- アイコンは `aria-hidden=\"true\"`、Disabled は `<span aria-disabled=\"true\">` で代替（`<a>` の href を除去しない）\n- フォーカスリング `focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1`\n\n## 8. Content Guidelines\n- 遷移先・アクションが一目でわかるラベル（「取引先責任者の詳細を見る」）。「ここをクリック」等の曖昧表現は禁止\n- 使用シーン例: テーブルのレコード名（sm/inline）/ 本文中（md/window）/ ヘルプ（sm/window）/ DL（sm/download）/ 補足（xs/inline）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: md / window（別タブ・告知付き） -->\n<a href=\"https://example.com\" target=\"_blank\" rel=\"noopener noreferrer\"\n  class=\"inline-flex items-center gap-1 text-[14px] font-medium tracking-[0.28px] leading-[1.3] text-primary-700 underline [text-decoration-skip-ink:none] hover:text-primary-800 active:text-primary-900 transition-colors cursor-pointer rounded-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">\n  取引先責任者の詳細を見る\n  <svg class=\"w-3 h-3 flex-shrink-0\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 2H2v12h12v-4M9 2h5v5M14 2L8 8\"/></svg>\n  <span class=\"sr-only\">（新しいタブで開く）</span>\n</a>\n\n<!-- Do: sm / inline（テーブル行） -->\n<a href=\"/records/123\" class=\"inline-flex items-center gap-1 text-[12px] font-medium tracking-[0.24px] leading-[1.3] text-primary-700 underline [text-decoration-skip-ink:none] hover:text-primary-800 active:text-primary-900 transition-colors cursor-pointer rounded-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">サンプル 太郎</a>\n```\n\n**Don't**: 「ここをクリック」等の曖昧ラベル（→具体的表現）/ 削除・解除等の破壊的アクション（→danger Button）/ アイコンのみのリンクで `aria-label` なし / `text-blue-500` 等のハードコードカラー（→`text-primary-700`）/ underline なし / `<button>` でのページ遷移（→`<a href>`）。\n\n---\n\n## 10. Implementation Notes\n- アイコンは Lucide（ExternalLink / Download を 12×12px に縮小）\n- 他コンポーネント内での使用: Breadcrumbs のリンク、Navbars の BreadCrumb、Pagination の件数近傍などで流用\n", "base/navigation/Segmented button.md": "# Component Guideline: Segmented button\n\n> NestUI Segmented Button 仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Segmented button\n- **Variants**: 状態のみ（`Default` / `Selected` / `Focus` / `Disabled`）。サイズは現状 `Small`（28px）固定\n- **Responsibility**:\n  - する: 複数の選択肢から1つを排他選択する。フィルター・表示切替・ビュー切替に使う\n  - しない: コンテンツ切替（Tabs を使う）、フォーム入力（Radio / Dropdown を使う）、ページ遷移\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 排他選択（同時選択は必ず1つ・ラジオのセグメント版）/ 2〜6項目（それ以上は Tabs または Dropdown）/ 全項目を視覚化（折り返し・スクロールなし）/ ラベルは名詞・短文（動詞禁止）/ ヘッダー・ツールバー等の省スペース箇所に配置。\n\n---\n\n## 2. Variants & States\n\nContainer: `inline-flex h-7 border border-[#c4cdd9] rounded-sm overflow-hidden`。\nItem 共通: `h-full px-2 text-[12px] font-medium tracking-[0.24px] whitespace-nowrap cursor-pointer relative focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-700 transition-colors`（最終アイテム以外は `border-r border-[#c4cdd9]`）。\n\n**Item 状態**\n\n| 状態 | 背景 | テキスト | 備考 |\n|------|------|----------|------|\n| Default | `bg-white` | `text-[#5a6c7f]` | 未選択の通常状態 |\n| Selected | `bg-primary-50` | `text-primary-700` | 選択中。`aria-pressed=\"true\"`（または `aria-checked=\"true\"`） |\n| Focus | Default と同じ | Default と同じ | フォーカスリング（`focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-700`） |\n| Disabled | `bg-white` | `text-[#a1afc0]` | 操作不可。Container 全体に適用（`aria-disabled=\"true\" opacity-50` + 各 button に `disabled`） |\n\n---\n\n## 3. サイズ\n\n現バージョンは Small 固定（ヘッダー/ツールバー文脈に合わせた寸法）。\n\n| サイズ | 高さ | 横 padding | フォント | tracking |\n|--------|------|------------|----------|----------|\n| Small | `h-7`（28px） | `px-2`（8px） | `text-[12px] font-medium` | `tracking-[0.24px]` |\n\n---\n\n## 4. Composition Rules\n\n| パーツ | 役割 | 必須 |\n|--------|------|:----:|\n| Container | 全アイテムをまとめる外枠（境界線・角丸・overflow を定義） | Yes |\n| Item | 選択肢の単位（`<button type=\"button\">`） | Yes（2個以上） |\n| Label | アイテムの選択肢名 | Yes |\n\n- 既に選択中のアイテムをクリックしても何も起きない（選択解除不可・常に1つ以上が Selected）\n- ページ内に複数配置する場合は各々に明確なコンテキストを持たせる\n- Tabs と同一文脈に混在させない（Tabs=コンテンツ切替、Segmented=表示モード切替）\n- フォーム内では使わない（選択肢は Radio / Dropdown）\n\n---\n\n## 5. Layout & Spacing\n\n- Container 高さ `h-7`、Item 横 padding `px-2`\n- アイテム間の区切りは `border-r border-[#c4cdd9]`（最終アイテムは付けない）\n- 角丸は Container 側の `rounded-sm` + `overflow-hidden` で表現\n\n---\n\n## 6. Token Mapping\n\n| 用途 | class（Hex） | トークン |\n|------|------|---------|\n| Container ボーダー / 区切り | `border-[#c4cdd9]` | `color.border.default` |\n| Default 背景 / テキスト | `bg-white` / `text-[#5a6c7f]` | `color.surface.raised` / `color.content.secondary` |\n| Selected 背景 / テキスト | `bg-primary-50` / `text-primary-700` | `color.primary.50` / `.700` |\n| Disabled テキスト | `text-[#a1afc0]` | `color.content.disabled` |\n| focus ring | `ring-primary-700` | `color.border.focus` |\n\n---\n\n## 7. Accessibility\n- Container に `role=\"group\"` + `aria-label`（または `aria-labelledby`）\n- 各 Item は `<button type=\"button\">`、選択状態を `aria-pressed=\"true/false\"` で伝える\n- 選択状態はテキスト・背景色・テキスト色の3点で同時表現（色のみに依存しない）\n- フォーカス時は必ず視覚インジケーター（`focus-visible:ring-2`）。Disabled は `disabled` 属性でキーボードからも除外\n- コントラスト: Default `#5a6c7f`/白 = 4.6:1、Selected `#2661cf`/`#f0f7fe` = 3.1:1（UI Component 基準 3:1 以上）\n\n## 8. Content Guidelines\n- ラベルは端的な名詞・副詞（「月次」「週次」「全員」「今日」「今週」「今月」）。動詞は使わない\n- 項目数は2〜6個\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 3項目（Selected + Default ×2） -->\n<div role=\"group\" aria-label=\"表示切替\" class=\"inline-flex h-7 border border-[#c4cdd9] rounded-sm overflow-hidden\">\n  <button type=\"button\" aria-pressed=\"true\"\n    class=\"h-full px-2 text-[12px] font-medium tracking-[0.24px] text-primary-700 bg-primary-50 border-r border-[#c4cdd9] whitespace-nowrap cursor-pointer relative focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-700 transition-colors\">週次</button>\n  <button type=\"button\" aria-pressed=\"false\"\n    class=\"h-full px-2 text-[12px] font-medium tracking-[0.24px] text-[#5a6c7f] bg-white border-r border-[#c4cdd9] whitespace-nowrap cursor-pointer relative focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-700 transition-colors\">月次</button>\n  <button type=\"button\" aria-pressed=\"false\"\n    class=\"h-full px-2 text-[12px] font-medium tracking-[0.24px] text-[#5a6c7f] bg-white whitespace-nowrap cursor-pointer relative focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-700 transition-colors\">年次</button>\n</div>\n```\n\n**Don't**: 7項目以上の選択肢（最大6項目）/ 選択状態の解除（常に1つ以上が Selected）/ フォーム入力としての使用（→フィルター・表示切替専用）/ Tabs との混在使用 / `aria-pressed` の省略。\n\n---\n\n## 10. Implementation Notes\n- クリック時に全 button の `aria-pressed` と背景/テキストクラス（`bg-primary-50` / `text-primary-700` ⇔ `bg-white` / `text-[#5a6c7f]`）をトグルする JS で実装\n- キーボードは Tab で Container にフォーカス、`role=\"radiogroup\"` 実装時は `←` `→` で項目間移動\n", "base/form/Text field.md": "# Component Guideline: Text field\n\n> NestUI TextField / TextBox 仕様。Tailwind CSS。値は `tokens/`（色は `color.border.*` / `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Text field（TextBox）\n- **Variants**: TextField / CopyTextField / InputBox（textarea）/ SelectBox / NumberInput\n- **Responsibility**:\n  - する: 単一行/複数行のテキスト入力、読み取り専用値のコピー、数値入力、固定リスト選択\n  - しない: 5つ以上の固定選択（→ Dropdown）、ON/OFF（→ Toggle/Checkbox）、日付（→ Date Picker）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: ラベルを常に表示（プレースホルダーで代替しない）/ エラーは即座に・具体的に（フィールド直下）/ フォーカスはボーダー変化のみ（`focus:ring-*` 禁止、`#c4cdd9`→`#2661cf`）/ 十分なタッチターゲット（M `h-9` / S `h-7`）/ カーソルカラー `caret-[#2661cf]`。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 説明 | 用途 |\n|---------|------|------|\n| TextField | 単一行テキスト入力 | 名前・URL・検索 |\n| CopyTextField | テキスト + コピーボタン付き（`readonly`） | 共有URL・APIキー |\n| InputBox | 複数行テキストエリア（`<textarea>`） | 説明文・コメント |\n| SelectBox | ドロップダウン選択（カスタム chevron 必須） | 固定リスト選択（→ Dropdown 参照） |\n| NumberInput | 数値入力 + スピナーボタン | 数量・金額 |\n\n**States**\n\n| 状態 | ボーダー | 背景 | テキスト |\n|------|----------|------|----------|\n| Enable | `border-[#c4cdd9]` | `bg-white` | `text-[#3e5062]` |\n| Hover | `border-[#c4cdd9]` | `bg-[#f7f9fb]` | `text-[#3e5062]` |\n| Focus / Typing | `focus:border-[#2661cf]` | `bg-white` | `text-[#3e5062]`（ring なし） |\n| Fill | `border-[#c4cdd9]` | `bg-white` | `text-[#3e5062]` |\n| Error | `border-[#e93766]` | `bg-white` | `text-[#3e5062]` + `aria-invalid=\"true\"` |\n| Warning | `border-[#ee8c29]` | `bg-white` | `text-[#3e5062]` |\n| Disable | `border-[#c4cdd9]` | `bg-[#f7f9fb]` | `text-[#a1afc0]` + `disabled` |\n\n> プレースホルダー色: `placeholder:text-[#a1afc0]`。\n\n---\n\n## 3. サイズ / Anatomy\n\n| サイズ | 高さ | テキスト | 左パディング | 用途 |\n|--------|------|----------|--------------|------|\n| Middle（既定） | `h-9`（36px） | `text-[12px]` | `px-2`（8px） | 標準フォーム |\n| Small | `h-7`（28px） | `text-[12px]` | `px-2`（8px） | テーブル内・密なレイアウト |\n\n共通: `font-medium tracking-[0.24px] border rounded-sm outline-none transition-colors caret-[#2661cf]`（font-family: Noto Sans JP）。横並びフォーム時も `h-9 leading-normal` を維持（`py-2` を外す）。\n\n**Anatomy**: Label（`<label for>`）+ Required マーク（`*` + `aria-required`）+ Input Container + Leading Icon（任意）+ Input/`<textarea>` + Clear Button（任意 `w-4 h-4`）+ Trailing Icon/Button（コピー・スピナー等）+ Helper Text + Error/Warning Text。\n\n---\n\n## 4. Composition Rules\n\n許可: 上部 `<label>` / Leading・Trailing アイコン / Clear ボタン / Helper・Error テキスト。\n禁止: `<label>` の省略 / プレースホルダーのみでラベルを代替 / SelectBox でネイティブ矢印（`appearance-none` + カスタム chevron 必須）。\n固有実装の注意:\n- **NumberInput**: スピナーコンテナに `w-7 shrink-0`、input に `min-w-0`（幅指定がないと input が全幅を占有しボタンが不可視）。Up/Down 間は `border-b border-[#c4cdd9]`、コンテナ左は `border-l border-[#c4cdd9]`\n- **CopyTextField**: `<input readonly>` 右端にコピーボタン（`w-7 h-7 m-0.5`）。成功後アイコンを checkmark に切替→1.5秒で復帰（→ Copy button 参照）\n- **SelectBox の Clear**: Fill/Error/Warning で×アイコン表示、Clear 後は Enable に戻す、`aria-label=\"クリア\"` 必須\n\n---\n\n## 5. Layout & Spacing\n\n- 高さ: M `h-9` / S `h-7`。左右 `px-2`（textarea は `px-2 py-2`）\n- Label と Input の間 `mb-1`（包含 div に `leading-normal`）\n- Error / Warning / Helper は Input 直下 `mt-1`\n- 角丸 `rounded-sm`（`rounded-lg` 禁止）\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| ボーダー（標準） | `color.border.default`(#c4cdd9) |\n| ボーダー（フォーカス）/ caret | `color.border.focus`(#2661cf = primary-700) |\n| 背景 / hover | `color.surface.input`(#fff) / `color.surface.base`(#f7f9fb) |\n| テキスト / プレースホルダー | `#3e5062`（content 補助）/ `color.content.disabled`(#a1afc0) |\n| エラーボーダー・テキスト | `color.semantic.error`(#e93766) |\n| 警告ボーダー・テキスト | `color.semantic.warning`(#ee8c29) |\n| disabled テキスト / 背景 | `color.content.disabled`(#a1afc0) / `color.surface.base` |\n| 角丸 | `radius.sm`（→ `rounded-sm`） |\n\n---\n\n## 7. Accessibility\n- `<label for=\"id\">` と `<input id=\"id\">` を一致させる\n- 必須: `aria-required=\"true\"` + 視覚的 `*`\n- エラー: テキストに `id` + `role=\"alert\"`、入力に `aria-describedby` + `aria-invalid=\"true\"`\n- Disabled: `disabled` 属性（HTML ネイティブ推奨）\n- バリデーションタイミング: 送信時（全検証 + 最初のエラーへフォーカス）/ フォーカスアウト時（入力済みのみ）/ エラー表示中は入力中に再検証\n- コントラスト: ラベル・入力・エラーテキストすべて 4.5:1 以上\n\n## 8. Content Guidelines\n- ラベルは入力内容を端的に。プレースホルダーは入力例（「サンプル 太郎」）\n- エラーは何が間違っているか・どう直すかを明示（「有効なメールアドレスを入力してください」）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: TextField（基本） -->\n<div class=\"leading-normal\">\n  <label for=\"name\" class=\"block text-sm font-medium text-slate-900 mb-1\">名前</label>\n  <input type=\"text\" id=\"name\" placeholder=\"サンプル 太郎\"\n    class=\"w-full h-9 px-2 text-[12px] font-medium tracking-[0.24px] border border-[#c4cdd9] rounded-sm bg-white text-[#3e5062]\n           outline-none focus:border-[#2661cf] hover:bg-[#f7f9fb] caret-[#2661cf] transition-colors placeholder:text-[#a1afc0]\" />\n</div>\n\n<!-- Do: Error -->\n<div class=\"leading-normal\">\n  <label for=\"email\" class=\"block text-sm font-medium text-slate-900 mb-1\">メールアドレス <span class=\"text-[#e93766] ml-0.5\">*</span></label>\n  <input type=\"email\" id=\"email\" aria-required=\"true\" aria-invalid=\"true\" aria-describedby=\"email-error\" value=\"invalid@\"\n    class=\"w-full h-9 px-2 text-[12px] font-medium tracking-[0.24px] border border-[#e93766] rounded-sm bg-white text-[#3e5062] outline-none caret-[#2661cf] transition-colors\" />\n  <p id=\"email-error\" role=\"alert\" class=\"mt-1 text-xs text-[#e93766] flex items-center gap-1\">\n    <svg class=\"w-3.5 h-3.5 shrink-0\" fill=\"currentColor\" viewBox=\"0 0 24 24\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z\"/></svg>\n    有効なメールアドレスを入力してください\n  </p>\n</div>\n\n<!-- Do: NumberInput（スピナーコンテナ w-7 shrink-0 / input min-w-0） -->\n<div class=\"relative flex h-9 w-40 border border-[#c4cdd9] rounded-sm overflow-hidden bg-white focus-within:border-[#2661cf] transition-colors\">\n  <input type=\"number\" value=\"1\" class=\"flex-1 min-w-0 px-2 text-[12px] font-medium tracking-[0.24px] text-[#3e5062] bg-transparent outline-none caret-[#2661cf] [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none\" />\n  <div class=\"flex flex-col w-7 shrink-0 border-l border-[#c4cdd9]\">\n    <button type=\"button\" aria-label=\"増やす\" class=\"flex-1 flex items-center justify-center bg-white hover:bg-[#edf0f3] active:bg-[#c4cdd9] transition-colors border-b border-[#c4cdd9]\">\n      <svg class=\"w-3 h-3 text-[#3e5062]\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" stroke-width=\"2.5\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M5 15l7-7 7 7\"/></svg>\n    </button>\n    <button type=\"button\" aria-label=\"減らす\" class=\"flex-1 flex items-center justify-center bg-white hover:bg-[#edf0f3] active:bg-[#c4cdd9] transition-colors\">\n      <svg class=\"w-3 h-3 text-[#3e5062]\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\" stroke-width=\"2.5\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19 9l-7 7-7-7\"/></svg>\n    </button>\n  </div>\n</div>\n```\n\n**Don't**: `<label>` 省略 / プレースホルダーのみでラベル代替 / `focus:ring-*`（→ `focus:border-[#2661cf]` のみ）/ `rounded-lg`（→ `rounded-sm`）/ `py-2 text-base`（→ `h-9 text-[12px]`）/ SelectBox でネイティブ矢印。\n\n---\n\n## 10. Implementation Notes\n- SelectBox は単一選択の固定リスト。詳細は `Dropdown.md` を参照\n- CopyTextField のコピー挙動は `Copy button.md` を参照\n- エラー/警告アイコンは Lucide。エラー `w-3.5 h-3.5`\n- トークン参照は `guidelines/TOKEN_GUIDE.md`。フォーム全体は `Form.md` を参照\n", "base/form/Dropdown.md": "# Component Guideline: Dropdown\n\n> NestUI Select / Dropdown 仕様。Tailwind CSS。値は `tokens/`（色は `color.border.*` / `color.primary.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Dropdown（= Select。固定リストからの単一選択）\n- **Variants**: ネイティブ `<select>` / プレフィックスアイコン付き / グループ付き（`<optgroup>`）\n- **Responsibility**:\n  - する: 5つ以上の固定選択肢から1つを選ぶ。送信で確定する\n  - しない: 4つ以下の選択肢（→ Radio）、フリーテキスト入力（→ Text field）、即時フィルタ（→ Filter Group。確定ボタンが要る場合は明示）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 選択肢が多いときの第一選択（5つ以上はDropdown / 4つ以下はRadio）/ 特別なUIが不要ならネイティブ `<select>` 要素を優先しOS操作性を活かす（**ただし矢印だけは `appearance: none` で消してカスタムシェブロンを重ねる** → §3）/ プレースホルダーで何を選ぶか明示 / 選択変更だけで遷移・送信しない（確定操作が必要）。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 説明 | 用途 |\n|---------|------|------|\n| ネイティブセレクト | `<select>` 要素を使用（**矢印は `appearance: none` で消し、カスタムシェブロンを重ねる**。素の `<select>` のままにしない） | 標準フォーム（推奨） |\n| プレフィックスアイコン付き | 左端にアイコンを配置 | カテゴリ選択・国選択 |\n| グループ付き | `<optgroup>` で選択肢をグループ化 | 大量の選択肢 |\n\n> 選択肢が20を超える場合は検索機能付きのカスタムセレクトを検討する。ネイティブでも `<optgroup>` でグループ化して探しやすくする。\n\n**States**\n\n| State | ボーダー | 背景 | テキスト |\n|-------|----------|------|----------|\n| Enable | `border-[#c4cdd9]` | `bg-white` | `text-[#3e5062]` |\n| Hover | `border-[#c4cdd9]` | `bg-[#f7f9fb]` | `text-[#3e5062]` |\n| Focus | `focus:border-[#2661cf]` | `bg-white` | `text-[#3e5062]`（ring なし・ボーダー変化のみ） |\n| Error | `border-[#e93766]` | `bg-white` | `text-[#3e5062]` + `aria-invalid=\"true\"` |\n| Warning | `border-[#ee8c29]` | `bg-white` | `text-[#3e5062]` |\n| Disable | `border-[#c4cdd9]` | `bg-[#f7f9fb]` | `text-[#a1afc0]` + `disabled` |\n\n---\n\n## 3. サイズ / Anatomy\n\n| サイズ | 高さ | class | 用途 |\n|--------|------|-------|------|\n| Middle（既定） | 36px | `h-[36px] pl-[8px] pr-8 text-[12px]` | 標準フォーム |\n| Small | 28px | `h-[28px] pl-[8px] pr-8 text-[12px]` | テーブル内・密なレイアウト |\n\n共通: `w-full appearance-none font-medium tracking-[0.24px] border rounded-[2px] outline-none transition-colors cursor-pointer`。\n\n**Anatomy**: Label（`<label>`）+ Required マーク（`*`）+ Select Container + Leading Icon（任意）+ Selected Value + Chevron + Option / Option Group + Helper Text / Error Text。\n\n> **必須**: `appearance-none` + `pr-8` + カスタム SVG シェブロン（`absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5`）は必須。ネイティブ矢印はブラウザ間で位置・余白が不安定。\n\n---\n\n## 4. Composition Rules\n\n許可: `<option>` / `<optgroup>`（グループ見出し）/ 左端 Leading アイコン（`<svg>`）/ 上部 `<label>` / 下部 Helper・Error テキスト。\n禁止: `<option value=\"\">` をプレースホルダーとして送信可能にすること / `<label>` の省略 / 選択変更だけでのページ遷移・フォーム送信。\nAnti-pattern: 選択肢が4個以下で Dropdown を使う（→ Radio。可視性が高い）/ 50個以上を検索なしで出す（探せない → 検索付きカスタムセレクト）。\n\n---\n\n## 5. Layout & Spacing\n\n- 高さ: Middle 36px / Small 28px。左 `pl-[8px]`、右はシェブロン用に `pr-8`\n- Label と Container の間: `gap-[4px]`（`flex flex-col`）\n- Helper / Error テキストは Container 直下\n- 角丸 `rounded-[2px]`（`rounded-lg` 禁止）\n\n**シェブロンの寸法（Tailwind を使わない実装はこの実値を使う）**\n\n| 項目 | Tailwind | 実値 | トークン |\n|---|---|---|---|\n| シェブロン右余白（枠線内側 → アイコン右端） | `right-2` | 8px | `spacing.2` |\n| シェブロンの一辺 | `w-5 h-5` | 20px | `spacing.5` |\n| `<select>` の右パディング | `pr-8` | 32px | `spacing.8` |\n| 縦位置 | `top-1/2 -translate-y-1/2` | 中央 | — |\n\n> 右パディング 32px = 右余白 8px + アイコン 20px + テキストとの逃げ 4px。**この 3 つは連動する**ので、片方だけ変えない。右余白が 0 に見える実装は、ほぼ `appearance: none` の付け忘れ（ネイティブ矢印が枠に張り付いている）。\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| ボーダー（標準） | `color.border.default`（#c4cdd9） |\n| ボーダー（フォーカス） | `color.border.focus`（#2661cf = primary-700） |\n| 背景 / hover | `color.surface.input`(#fff) / `color.surface.base`(#f7f9fb) |\n| テキスト | `#3e5062`（`colo

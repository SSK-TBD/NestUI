          nodes.forEach(n => {
            n.onclick = (e) => {
              if (e.target.closest('.ds-tree__twisty')) { toggle(n); return; }
              nodes.forEach(x => x.setAttribute('aria-selected', String(x === n)));
              toggle(n);
            };
            n.onkeydown = (e) => {
              if (e.key === 'ArrowRight' && n.getAttribute('aria-expanded') === 'false') { e.preventDefault(); toggle(n); }

        name: 'インクリメンタル検索',
        desc: '2 文字以上で候補を出す。↑↓ で移動、Enter で確定、Esc で閉じる。読み込み中はスピナーを右端に出す。',
        render: () => `
          <div class="ds-search ds-w-md" data-search>
            <span class="ds-search__icon">${I.search}</span>
            <input class="ds-input" type="text" placeholder="商品名を入力" role="combobox" aria-expanded="false" aria-autocomplete="list" autocomplete="off">
          </div>
          <p class="ds-note">「こ」「た」「ち」などを入れると候補が出る（ひらがな入力でカタカナの商品名にも当たる）。</p>`,
        js: `(() => {
          const root = document.querySelector('[data-search]');
          const input = root.querySelector('input');
          const DATA = ['コーヒー豆 200g', 'コットンタオル', '紅茶ティーバッグ', 'タオルケット', 'チョコレートクッキー', 'ちりめん山椒', 'テーブルクロス'];
          // ひらがな入力でカタカナの商品名にも当てるため、比較の前にカナを揃える
          const norm = (s) => s.replace(/[\u30a1-\u30f6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
          let menu = null, idx = -1, timer = null;
          const close = () => { if (menu) menu.remove(); menu = null; idx = -1; input.setAttribute('aria-expanded', 'false'); root.querySelector('.ds-search__spinner')?.remove(); };
          const open = (q) => {
            close();
            const nq = norm(q);
            const hits = DATA.filter(d => norm(d).includes(nq));
            menu = document.createElement('ul');
            menu.className = 'ds-search__menu';
            menu.setAttribute('role', 'listbox');
            menu.innerHTML = hits.length
              ? hits.map((h) => {
                  const at = norm(h).indexOf(nq);
                  const marked = at < 0 ? h : h.slice(0, at) + '<mark>' + h.slice(at, at + q.length) + '</mark>' + h.slice(at + q.length);
                  return '<li class="ds-search__opt" role="option" aria-selected="false">' + marked + '</li>';
                }).join('')
              : '<li class="ds-search__empty">該当する商品がありません</li>';
            root.appendChild(menu);
            input.setAttribute('aria-expanded', 'true');
            menu.querySelectorAll('.ds-search__opt').forEach(o => o.onmousedown = () => { input.value = o.textContent; close(); });
          };
          const move = (d) => {
            const opts = menu ? [...menu.querySelectorAll('.ds-search__opt')] : [];
            if (!opts.length) return;
            idx = (idx + d + opts.length) % opts.length;
            opts.forEach((o, i) => o.setAttribute('aria-selected', String(i === idx)));
          };
          input.oninput = () => {
            clearTimeout(timer); close();
            const q = input.value.trim();
            if (q.length < 1) return;
            const sp = document.createElement('span');
            sp.className = 'ds-search__spinner';
            sp.innerHTML = '<span class="ds-spinner ds-spinner--sm"></span>';
            root.appendChild(sp);
            timer = setTimeout(() => open(q), 350);
          };
          input.onkeydown = (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
            else if (e.key === 'Enter' && idx >= 0) { e.preventDefault(); input.value = menu.querySelectorAll('.ds-search__opt')[idx].textContent; close(); }
            else if (e.key === 'Escape') close();
          };
          input.onblur = () => setTimeout(close, 120);
        })();`,
      },
    ],
  };

            <p class="ds-note" style="margin-top:12px">開いたら Tab でフォーカスが枠内を巡り、Esc・背景クリック・× で閉じる。</p>
          </div>`,
        js: `(() => {
          const stage = document.querySelector('[data-modal-stage]');
          const opener = stage.querySelector('[data-open]');
          let scrim = null;
          const close = () => { if (!scrim) return; scrim.remove(); scrim = null; opener.focus(); document.removeEventListener('keydown', onKey); };
          const onKey = (e) => {
            if (e.key === 'Escape') { close(); return; }
            if (e.key !== 'Tab' || !scrim) return;
            const f = [...scrim.querySelectorAll('button, [href], input, select, textarea')].filter(x => !x.disabled);
            if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          };
          opener.onclick = () => {
            scrim = document.createElement('div');
            scrim.className = 'ds-scrim';
            scrim.innerHTML = '<div class="ds-modal" role="dialog" aria-modal="true" aria-labelledby="mt">' +
              '<div class="ds-modal__head"><h2 class="ds-modal__title" id="mt">注文をキャンセルする</h2><button class="ds-modal__close" type="button" aria-label="閉じる">×</button></div>' +

              '<button class="ds-btn ds-btn--primary" type="button" data-ok>送信する</button></div></div>';
            stage.appendChild(scrim);
            scrim.onclick = (e) => { if (e.target === scrim) close(); };
            scrim.querySelector('.ds-modal__close').onclick = close;
            scrim.querySelector('[data-cancel]').onclick = close;
            scrim.querySelector('[data-ok]').onclick = close;
            document.addEventListener('keydown', onKey);
            scrim.querySelector('.ds-modal__close').focus();
          };
        })();`,
      },
    ],
  };

            };
          });
        })();`,

<script data-embedded="app">
/* ギャラリー本体。一覧・動く見本・ドキュメント・目次を 1 画面に出す */

(function () {
  'use strict';

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ==========================================================================
   * 1. Markdown → HTML（この画面で使う範囲だけの実装）
   * ======================================================================== */

  const CELL_PIPE = '@@CELLPIPE@@';

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, h) => '<a href="' + h + '" data-mdlink>' + t + '</a>')
      .replace(/&lt;br\s*\/?&gt;/g, '<br>');
  }

  function splitRow(line) {
    return line
      .replace(/\\\|/g, CELL_PIPE)
      .split('|')
      .slice(1, -1)
      .map((c) => inline(c.trim()).split(CELL_PIPE).join('|'));
  }

  function mdToHtml(md) {
    const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
    const out = [];
    const toc = [];
    let i = 0;
    let para = [];
    const listStack = [];

    const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const closeLists = (toDepth) => { while (listStack.length > toDepth) out.push(listStack.pop() === 'ol' ? '</ol>' : '</ul>'); };
    const flush = () => { flushPara(); closeLists(0); };

    while (i < lines.length) {
      const line = lines[i];

      const fence = line.match(/^\s*```(\w*)\s*$/);
      if (fence) {
        flush();
        const lang = fence[1] || '';
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push('<figure class="md-code"><figcaption>' + esc(lang || 'text') + '</figcaption>' +
          '<button class="md-copy" type="button" data-copy>コピー</button>' +
          '<pre><code>' + esc(buf.join('\n')) + '</code></pre></figure>');
        continue;
      }

      // Usage Do / Don't の見出し。**Do** / **Don't**（括弧書きの補足つきも可）だけの行を
      // 緑／赤のラベルにする
      const dodont = line.match(/^\s*\*\*(Do|Don['’]t)(（[^）]*）|\([^)]*\))?\*\*\s*$/);
      if (dodont) {
        flush();
        const kind = dodont[1] === 'Do' ? 'do' : 'dont';
        out.push('<p class="dodont dodont--' + kind + '"><span class="dodont__label">' + (kind === 'do' ? 'Do' : 'Don’t') + '</span>' +
          (dodont[2] ? '<span class="dodont__note">' + esc(dodont[2].replace(/^[（(]|[）)]$/g, '')) + '</span>' : '') + '</p>');
        i++;
        continue;
      }

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flush();
        const level = h[1].length;
        const text = h[2].replace(/\s*#+\s*$/, '');
        const id = 'h-' + toc.length;
        if (level >= 2 && level <= 3) toc.push({ id: id, level: level, text: text.replace(/[*`]/g, '') });
        out.push('<h' + level + ' id="' + id + '" class="md-h md-h' + level + '">' + inline(text) + '</h' + level + '>');
        i++;
        continue;
      }

      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        flush();
        const head = splitRow(line.trim());
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(splitRow(lines[i++].trim()));
        out.push('<div class="md-tablewrap"><table class="md-table"><thead><tr>' +
          head.map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') +
          '</tbody></table></div>');
        continue;
      }

      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); out.push('<hr class="md-hr">'); i++; continue; }

      if (/^\s*>\s?/.test(line)) {
        flush();
        const buf = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
        out.push('<blockquote class="md-quote">' + mdToHtml(buf.join('\n')).html + '</blockquote>');
        continue;
      }

      const li = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
      if (li) {
        flushPara();
        const depth = Math.floor(li[1].length / 2) + 1;
        const kind = /\d/.test(li[2]) ? 'ol' : 'ul';
        while (listStack.length < depth) { out.push(kind === 'ol' ? '<ol class="md-list">' : '<ul class="md-list">'); listStack.push(kind); }
        closeLists(depth);
        out.push('<li>' + inline(li[3]) + '</li>');
        i++;
        continue;
      }

      if (!line.trim()) { flush(); i++; continue; }

      closeLists(0);
      para.push(line.trim());
      i++;
    }
    flush();
    return { html: out.join('\n'), toc: toc };
  }

  /* ==========================================================================
   * 2. トークン JSON → CSS 変数
   * ======================================================================== */

  const kebab = (s) => String(s).replace(/([a-z0-9])([A-Z])/g, '$1-$2').replace(/[_\s]+/g, '-').toLowerCase();

  function flattenTokens(json) {
    const out = [];
    (function walk(node, path) {
      for (const k of Object.keys(node)) {
        if (k.charAt(0) === '$') continue;
        const v = node[k];
        if (v && typeof v === 'object' && '$value' in v) out.push({ path: path.concat(k), value: v.$value, type: v.$type, desc: v.$description });
        else if (v && typeof v === 'object') walk(v, path.concat(k));
      }
    })(json, []);
    return out;
  }

  // `{color.primitive.neutral.900}` のような参照（alias）を実値に解決する。
  // 参照先は全トークンファイルから探す（typography.scale.*.fontWeight → typography.fontWeight など）。
  // 解決できなかった alias は value を undefined にして落とす（CSS に `{…}` を書かない）。
  function resolveTokens(tokenFiles) {
    const all = [];
    const byPath = new Map();
    for (const name of Object.keys(tokenFiles)) {
      if (!tokenFiles[name]) continue;
      for (const t of flattenTokens(tokenFiles[name])) { t.file = name; all.push(t); byPath.set(t.path.join('.'), t); }
    }
    const isAlias = (v) => typeof v === 'string' && /^\{[^}]+\}$/.test(v);
    for (const t of all) {
      if (!isAlias(t.value)) continue;
      let v = t.value, hops = 0;
      while (isAlias(v) && hops++ < 10) {
        const ref = byPath.get(v.slice(1, -1));
        if (!ref) break;
        v = ref.value;
      }
      t.alias = t.value;
      t.value = isAlias(v) ? undefined : v;
    }
    return all;
  }

  // トークンのパスから CSS 変数名を作る。慣用の短名とフルパス名の両方を出す
  // （md の CSS フェンスが --shadow-sm と --elevation-shadow-sm のどちらも書いているため）
  function varNames(path) {
    const p = path.map(kebab);
    const full = '--' + p.join('-');
    const head = p[0];
    const rest = p.slice(1).join('-');
    const list = [full];
    if (head === 'typography' || head === 'elevation' || head === 'motion' || head === 'sizing') list.push('--' + rest);
    if (head === 'breakpoint') list.push('--breakpoint-' + rest);
    if (head === 'spacing' && p[1] === 'layout') list.push('--layout-' + p.slice(2).join('-'));
    return list.filter((v, i, a) => a.indexOf(v) === i);
  }

  // preview CSS と md の css フェンスが参照している CSS 変数のうち、
  // tokens/*.json に無いものを拾う。DS を移植したときに「このプロジェクトには
  // そのトークンが無い」ことを黙って壊れる代わりに見せるための検査。
  // フォールバック付き（`var(--x, 既定)`）は落ちないので対象外。
  function collectMissingVars(tokenDefined) {
    // preview.*.css の :root などで宣言した変数（`--x: …;`）も定義済みとみなす。
    // base が参照する名前をプロジェクト側でこの DS のトークンへ橋渡しできるようにするため
    const defined = new Set(tokenDefined);
    const declRe = /(--[a-z0-9-]+)\s*:/g;
    for (const css of [state.previewCss.base, state.previewCss.project]) {
      let d;
      while ((d = declRe.exec(css || ''))) defined.add(d[1]);
    }
    const need = new Map();   // 変数名 -> 参照元の集合
    const scan = (css, where) => {
      const re = /var\(\s*(--[a-z0-9-]+)\s*\)/g;
      let m;
      while ((m = re.exec(css || ''))) {
        if (defined.has(m[1])) continue;
        if (!need.has(m[1])) need.set(m[1], new Set());
        need.get(m[1]).add(where);
      }
    };
    scan(state.previewCss.base, 'プレビュー用 CSS（汎用）');
    scan(state.previewCss.project, 'プレビュー用 CSS（NestUI 固有）');
    for (const path of Object.keys(state.docs)) {
      for (const css of extractFences(state.docs[path]).css) scan(css, path);
    }
    return [...need.entries()].map((e) => ({ name: e[0], where: [...e[1]] })).sort((a, b) => a.name.localeCompare(b.name));
  }

  function tokensToCss(tokenFiles) {
    const decls = [];
    for (const t of resolveTokens(tokenFiles)) {
      if (t.value == null || typeof t.value === 'object') continue;
      for (const n of varNames(t.path)) decls.push(n + ': ' + t.value + ';');
    }
    return ':root {\n  ' + decls.join('\n  ') + '\n}';
  }

  // tokens/*.json が定義する CSS 変数名の一覧（未定義参照の検査に使う）
  function definedVarNames(tokenFiles) {
    const set = new Set();
    for (const t of resolveTokens(tokenFiles)) {
      if (t.value == null || typeof t.value === 'object') continue;
      for (const n of varNames(t.path)) set.add(n);
    }
    return set;
  }

  /* ==========================================================================
   * 3. component-index.md のパース（画面の目次の正）
   * ======================================================================== */

  function parseIndex(md) {
    const cats = [];
    let cur = null;
    for (const raw of String(md || '').split('\n')) {
      const h = raw.match(/^##\s+(.+?)\s*$/);
      if (h) {
        const name = h[1];
        if (/^(凡例|レビュー時の運用ルール|トークン乖離)/.test(name)) { cur = null; continue; }
        cur = { name: name.replace(/（.*/, '').trim(), label: name, items: [] };
        cats.push(cur);
        continue;
      }
      if (!cur) continue;
      const cells = raw.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      // 4 列（Component | 状態 | When to use | File）でも 3 列（状態なし）でも読む。File 列はバッククォート付き
      if (cells.length < 3 || cells.length > 4) continue;
      const fileCell = cells[cells.length - 1].match(/^`([^`]+)`$/);
      if (!fileCell) continue;
      const name = cells[0];
      if (name === 'Component' || /^-+$/.test(name)) continue;
      const status = cells.length === 4 ? cells[1] : '';
      const when = cells[cells.length - 2];
      const file = fileCell[1];
      const path = /^(base|specific)\//.test(file) ? file : 'base/' + file;
      if (cur.items.some((it) => it.path === path)) continue;   // index の重複行は 1 件にまとめる
      cur.items.push({ name: name, status: status.trim(), when: when, path: path });
    }
    return cats.filter((c) => c.items.length);
  }

  const STATUS = {
    '✅': { key: 'done', label: '実装あり' },
    '🟡': { key: 'partial', label: '部分実装' },
    '⚪': { key: 'none', label: '実装なし' },
  };
  const statusOf = (s) => STATUS[String(s || '').trim()] || { key: 'unknown', label: s || '—' };
  // index に状態列があるか（3 列の index なら状態の色点・チップ・集計を出さない）
  const hasStatus = () => (state.cats || []).some((c) => c.items.some((it) => it.status));

  /* ==========================================================================
   * 4. データ読み込み（live / snapshot）
   * ======================================================================== */

  // ギャラリーの設定。設定が無くても動くよう既定を持つ
  const CFG = Object.assign({
    brand: 'Design System',
    mark: 'DS',
    dsPath: 'design-system',
    serveCmd: 'python3 -m http.server 8000',
    accent: '',   // chrome のアクセント色。'color.brand.primary' のようなトークンのパスか、CSS の色。空なら既定の緑
    homeDoc: '',  // 「はじめに」の先頭に全文を出す md（gallery/ からの相対パス）。空なら出さない
    homeLead: '', // 「はじめに」の見出し直下の説明文（プレーンテキスト。\n で改行）。空なら既定の文
    homeArt: '',  // 「はじめに」の見出し直下に等幅で出す文字絵（アスキーアートのロゴ等）。空なら出さない
  }, window.__DS_CONFIG__ || {});

  // 設定の accent を chrome（--g-accent 系）に反映する。トークンのパスなら
  // 読み込んだ tokens から実値を引く（同期のたびに呼ばれるので、トークンを直せば chrome も追従する）
  // 色の実値（CSS で書ける色なら何でも）を [r,g,b] にする。ブラウザに解釈させる
  function parseColor(css) {
    const el = document.createElement('span');
    el.style.color = css;
    document.body.appendChild(el);
    const m = getComputedStyle(el).color.match(/[\d.]+/g);
    el.remove();
    return m && m.length >= 3 ? m.slice(0, 3).map(Number) : null;
  }
  const luminance = (rgb) => { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]); };
  const contrast = (a, b) => { const x = luminance(a), y = luminance(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const mixRgb = (a, b, t) => a.map((v, i) => Math.round(v * (1 - t) + b[i] * t));
  const rgbCss = (c) => 'rgb(' + c.join(', ') + ')';

  // 指定色を、与えた地（白と、淡い地）のどれに対しても 4.5:1（WCAG AA の本文）以上になるまで黒に寄せる。
  // 十分濃ければそのまま返す。明るいブランド色を chrome の文字・ボタン・フォーカス枠に使うと読めなくなるので、その系統だけ濃くする
  function inkFor(rgb, bgs, min) {
    for (let t = 0; t <= 0.95; t += 0.01) {
      const c = mixRgb(rgb, [0, 0, 0], t);
      if (bgs.every((bg) => contrast(c, bg) >= (min || 4.5))) return c;
    }
    return [0, 0, 0];
  }

  function applyAccent() {
    const want = String(CFG.accent || '').trim();
    const root = document.documentElement.style;
    const names = ['--g-accent', '--g-accent-ink', '--g-accent-mark-ink', '--g-accent-soft', '--g-accent-deep', '--g-ok-bg', '--g-ok-line', '--g-ok-ink'];
    if (!want) { names.forEach((n) => root.removeProperty(n)); return; }
    let value = want;
    if (/^[a-z][a-z0-9]*(\.[a-z0-9]+)+$/i.test(want)) {
      const hit = resolveTokens(state.tokens || {}).find((t) => t.path.join('.') === want);
      if (!hit || hit.value == null || typeof hit.value === 'object') { console.warn('[gallery] accent トークンが見つかりません: ' + want); return; }
      value = String(hit.value);
    }
    const rgb = parseColor(value);
    if (!rgb) { console.warn('[gallery] accent を色として解釈できません: ' + value); return; }
    const soft = mixRgb(rgb, [255, 255, 255], 0.9);     // 淡い地（選択中の枠・folder バッジ）
    const okBg = mixRgb(rgb, [255, 255, 255], 0.88);    // ok 系の地（LIVE バッジ・同期成功バナー・実装ありチップ）
    const ink = inkFor(rgb, [[255, 255, 255], soft, okBg], 4.5);   // 文字・リンク・ボタン地・フォーカス枠。淡い地の上でも AA
    const deep = mixRgb(ink, [0, 0, 0], 0.18);          // ボタンの hover
    // ブランドマーク（指定色の地に 1〜2 文字）は、白と墨のうち対比が高いほうを文字色にする
    const markInk = contrast(rgb, [255, 255, 255]) >= 4.5 ? [255, 255, 255] : parseColor(getComputedStyle(document.documentElement).getPropertyValue('--g-ink') || '#1d2433') || [29, 36, 51];
    root.setProperty('--g-accent', rgbCss(rgb));
    root.setProperty('--g-accent-ink', rgbCss(ink));
    root.setProperty('--g-accent-mark-ink', rgbCss(markInk));
    root.setProperty('--g-accent-soft', rgbCss(soft));
    root.setProperty('--g-accent-deep', rgbCss(deep));
    root.setProperty('--g-ok-bg', rgbCss(okBg));
    root.setProperty('--g-ok-line', rgbCss(mixRgb(rgb, [255, 255, 255], 0.55)));
    root.setProperty('--g-ok-ink', rgbCss(ink));
  }

  const TOKEN_FILES = ['color', 'typography', 'spacing', 'radius', 'elevation', 'sizing', 'motion', 'breakpoint'];
  // ガイドラインの一覧。
  // 表が無い DS ではこの既定の並びを使う
  const GUIDES = ['FOUNDATIONS.md', 'COMPONENT_GUIDE.md', 'TOKEN_GUIDE.md'];

  function parseGuideIndex(md) {
    const list = [];
    const meta = {};
    for (const raw of String(md || '').split('\n')) {
      if (!/^\|/.test(raw)) continue;
      const cells = raw.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const at = cells.findIndex((c) => /`[\w.-]+\.(md|ya?ml)`/.test(c));
      if (at < 0) continue;
      const name = cells[at].match(/`([\w.-]+\.(?:md|ya?ml))`/)[1];
      if (/^README\.md$/i.test(name) || list.includes(name)) continue;
      list.push(name);
      meta[name] = { role: cells[at + 1] || '', answers: cells[at + 2] || '' };
    }
    return { list: list, meta: meta };
  }
  // レイアウトの骨組み（任意）。layout_patterns/layout-index.md（無ければ index.md）が一覧の正で、
  // 表の File 列が指す HTML を縮小 iframe でライブ表示する。無い DS では出ない
  const LAYOUT_DIR = '../layout_patterns/';
  const LAYOUT_GRANS = [['l', 'Pane structure']];
  const LAYOUT_INDEX_FILES = ['layout-index.md', 'index.md'];   // この順に探す

  const state = {
    mode: null,
    generatedAt: null,
    syncedAt: null,
    index: '',
    cats: [],
    docs: {},
    guides: {},
    guideList: [],    // 表示順
    guideMeta: {},    // name -> { role, answers }
    homeDoc: '',      // 「はじめに」の先頭に出す md の本文（CFG.homeDoc。無ければ空）
    layouts: {},      // 粒度 -> layout-index.md（または index.md）の本文
    layoutFiles: {},  // 粒度 -> 実際に読めた index のファイル名
    layoutHtml: {},   // ファイル名 -> 骨組み HTML の本文（スナップショットに取り込んだもの）
    tokens: {},
    tokenCss: '',
    previewCss: { base: '', project: '' },
    changed: new Set(),
    missingVars: [],
    autoSync: false,
    query: '',
  };

  /* --- 読み手：live は fetch、folder は File System Access API ------------------
   * どちらも「gallery/ からの相対パス」を受ける。folder のときは選んだフォルダから
   * DS ディレクトリまでのパス（dsParts）＋ 'gallery' を起点に '..' を解決する。 */
  const STANDALONE = !!window.__DS_STANDALONE__;   // 単一ファイル版。同期を持たない
  const FOLDER_API = !STANDALONE && typeof window.showDirectoryPicker === 'function';
  const folder = { root: null, dsParts: null, saved: null };   // saved: 権限が切れていて再接続待ちの保存済みハンドル

  async function fetchText(url) {
    const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(url + ' → ' + r.status);
    return r.text();
  }
  function folderParts(rel) {
    const out = [];
    for (const p of folder.dsParts.concat(['gallery'], String(rel).split('/'))) {
      if (!p || p === '.') continue;
      if (p === '..') { if (!out.length) throw new Error(rel + ' は選んだフォルダの外にあるので読めません'); out.pop(); continue; }
      out.push(p);
    }
    return out;
  }
  async function folderText(rel) {
    const parts = folderParts(rel);
    let dir = folder.root;
    for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p);
    const file = await (await dir.getFileHandle(parts[parts.length - 1])).getFile();
    return file.text();
  }
  const getText = (rel) => (folder.root ? folderText(rel) : fetchText(rel));

  // 選んだフォルダの中で DS ディレクトリ（components/component-index.md を持つ）を探し、そこまでのパスを返す。
  // 選んだのが DS そのものなら []。gallery/ を選んでいたら親が要るので null（ハンドルから上へは辿れない）
  async function findDsDir(root) {
    const has = async (dir) => { try { await (await dir.getDirectoryHandle('components')).getFileHandle('component-index.md'); return true; } catch (e) { return false; } };
    if (await has(root)) return [];
    const segs = String(CFG.dsPath || '').split('/').filter(Boolean);   // dsPath の末尾から候補を作る（designsystem → docs/designsystem → …）
    for (let i = segs.length - 1; i >= 0; i--) {
      try { let d = root; for (const p of segs.slice(i)) d = await d.getDirectoryHandle(p); if (await has(d)) return segs.slice(i); } catch (e) { /* 次の候補へ */ }
    }
    try { for await (const [name, h] of root.entries()) if (h.kind === 'directory' && await has(h)) return [name]; } catch (e) { /* 列挙できなければ諦める */ }
    return null;
  }

  // ハンドルの保存先（IndexedDB）。file:// でも使える。壊れていても起動は止めない
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('nestui-gallery', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(key) {
    const db = await idb();
    return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  }
  async function idbSet(key, value) {
    const db = await idb();
    return new Promise((res, rej) => { const q = db.transaction('kv', 'readwrite').objectStore('kv').put(value, key); q.onsuccess = () => res(); q.onerror = () => rej(q.error); });
  }

  async function connectFolder(root, dsParts) {
    if (!dsParts) dsParts = await findDsDir(root);
    if (!dsParts) {
      throw new Error('選んだフォルダに components/component-index.md が見つかりません。' + (CFG.dsPath ? '`' + CFG.dsPath + '` を選んでください' : ''));
    }
    folder.root = root; folder.dsParts = dsParts; folder.saved = null;
    try { await idbSet('folder', { root: root, dsParts: dsParts }); } catch (e) { console.warn('[gallery] フォルダの記憶に失敗: ' + e); }
  }
  // ユーザー操作の中で呼ぶ（ブラウザのフォルダ選択ダイアログ）
  async function pickFolder() {
    const root = await window.showDirectoryPicker({ id: 'nestui-gallery', mode: 'read' });
    await connectFolder(root, null);
  }
  // 保存済みハンドルを復元する。interactive のときだけ権限を求め直す（ユーザー操作が要る）
  async function restoreFolder(interactive) {
    let saved = folder.saved;
    if (!saved) { try { saved = await idbGet('folder'); } catch (e) { return false; } }
    if (!saved || !saved.root || !saved.root.queryPermission) return false;
    let perm = await saved.root.queryPermission({ mode: 'read' });
    if (perm !== 'granted' && interactive) perm = await saved.root.requestPermission({ mode: 'read' });
    if (perm !== 'granted') { folder.saved = saved; return false; }
    // 選び直しや移動で中身が変わっていることがあるので、DS ディレクトリを確かめ直す
    await connectFolder(saved.root, await findDsDir(saved.root) || saved.dsParts);
    return true;
  }
  const freshMode = () => (folder.root ? 'folder' : 'live');

  async function loadLive() {
    const index = await getText('../components/component-index.md');
    const cats = parseIndex(index);
    const paths = cats.reduce((a, c) => a.concat(c.items.map((it) => it.path)), []);
    const gi = parseGuideIndex('');
    const guideList = gi.list.length ? gi.list : GUIDES;
    const results = await Promise.all([
      Promise.all(paths.map((p) => getText('../components/' + p).catch(() => null))),
      Promise.all(guideList.map((g) => getText('../guidelines/' + g).catch(() => null))),
      Promise.all(TOKEN_FILES.map((t) => getText('../tokens/' + t + '.json').then(JSON.parse).catch(() => null))),
      Promise.resolve(window.__DS_SNAPSHOT__.previewCss.base),   // プレビュー用 CSS は取り込んだものを使う
      Promise.resolve(window.__DS_SNAPSHOT__.previewCss.project || ''),
      Promise.all(LAYOUT_GRANS.map((g) => LAYOUT_INDEX_FILES.reduce(
        (p, f) => p.catch(() => getText(LAYOUT_DIR + f).then((t) => ({ file: f, text: t }))), Promise.reject()
      ).catch(() => null))),
      // homeDoc がサーバのルート（DS ディレクトリ）より上にあると live では取れないので、その場合は snapshot に焼いた本文で代用する
      CFG.homeDoc ? getText(CFG.homeDoc).catch(() => (window.__DS_SNAPSHOT__ && window.__DS_SNAPSHOT__.homeDoc) || '') : Promise.resolve(''),
    ]);
    const docs = {};
    const guides = {};
    const tokens = {};
    const layouts = {};
    const layoutFiles = {};
    paths.forEach((p, i) => { if (results[0][i] != null) docs[p] = results[0][i]; });
    guideList.forEach((g, i) => { if (results[1][i] != null) guides[g] = results[1][i]; });
    TOKEN_FILES.forEach((t, i) => { if (results[2][i] != null) tokens[t] = results[2][i]; });
    LAYOUT_GRANS.forEach((g, i) => { if (results[5][i] != null) { layouts[g[0]] = results[5][i].text; layoutFiles[g[0]] = results[5][i].file; } });
    return {
      index: index, cats: cats, docs: docs, guides: guides, guideList: guideList.filter((g) => guides[g]), guideMeta: gi.meta, tokens: tokens, layouts: layouts, layoutFiles: layoutFiles,
      homeDoc: results[6], previewCss: { base: results[3], project: results[4] }, generatedAt: null,
    };
  }

  function loadSnapshot() {
    const s = window.__DS_SNAPSHOT__;
    if (!s) throw new Error('取り込んだデータが読み込まれていません');
    return {
      index: s.index, cats: parseIndex(s.index), docs: s.docs, guides: s.guides, layouts: s.layouts || {}, layoutFiles: s.layoutFiles || {}, layoutHtml: s.layoutHtml || {},
      guideList: (s.guideList || GUIDES).filter((g) => s.guides[g]), guideMeta: s.guideMeta || {}, homeDoc: s.homeDoc || '',
      tokens: s.tokens, previewCss: s.previewCss, generatedAt: s.generatedAt,
    };
  }

  function apply(data, mode) {
    const changed = new Set();
    for (const k of Object.keys(data.docs)) if (state.docs[k] && state.docs[k] !== data.docs[k]) changed.add(k);
    if (state.index && state.index !== data.index) changed.add('__index__');
    for (const g of Object.keys(data.layouts || {})) if (state.layouts[g] && state.layouts[g] !== data.layouts[g]) changed.add('layout/' + g);
    for (const g of Object.keys(data.guides || {})) if (state.guides[g] && state.guides[g] !== data.guides[g]) changed.add('guide/' + g);
    if (state.homeDoc && data.homeDoc && state.homeDoc !== data.homeDoc) changed.add('__home__');
    Object.assign(state, data, { mode: mode, changed: changed, syncedAt: new Date() });
    state.tokenCss = tokensToCss(state.tokens);
    state.missingVars = collectMissingVars(definedVarNames(state.tokens));
    return changed;
  }

  /* ==========================================================================
   * 5. プレビュー枠（iframe）
   * ======================================================================== */

  // md の html / css フェンスを抜き出す（specific は md 側が markup の正）
  function extractFences(md) {
    const html = [];
    const css = [];
    const re = /```(html|css)\n([\s\S]*?)```/g;
    let m;
    while ((m = re.exec(String(md || '')))) (m[1] === 'html' ? html : css).push(m[2].replace(/\s+$/, ''));
    return { html: html, css: css };
  }

  let frameSeq = 0;

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'ds-frame-height') return;
    const f = document.getElementById(d.id);
    if (f) f.style.height = Math.max(d.h, 48) + 'px';
  });

  const CLOSE_SCRIPT = '</' + 'script>';

  function buildFrameDoc(bodyHtml, o) {
    return '<!doctype html><html class="no-icon-font"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">' +
      '<style>' + state.tokenCss + '</style>' +
      '<style>' + state.previewCss.base + '</style>' +
      '<style>' + state.previewCss.project + '</style>' +
      '<style>' + (o.css || '') + '</style>' +
      '<style>body{padding:' + (o.pad == null ? 24 : o.pad) + 'px}</style>' +
      '</head><body class="' + (o.frameClass || '') + '">' + bodyHtml +
      // 見本のスクリプトが落ちたら、黙って動かないのではなく枠の中に理由を出す
      // （見本の定義を直したときに気づけるようにするため）
      '<script>try{' + (o.js || '') + 'document.documentElement.dataset.demoJs="ran"}' +
      'catch(e){document.documentElement.dataset.demoJs="error";document.documentElement.dataset.demoError=String(e&&e.message||e);' +
      'var b=document.createElement("p");b.setAttribute("data-demo-error","");' +
      'b.style.cssText="margin:0 0 12px;padding:8px 12px;border-radius:6px;background:#ffdfd8;color:#8a2600;font-size:12px";' +
      'b.textContent="この見本のスクリプトが落ちました: "+(e&&e.message||e);' +
      'document.body.insertBefore(b,document.body.firstChild);console.error("[demo]",e)}' + CLOSE_SCRIPT +
      '<script>(function(){' +
      'var send=function(){parent.postMessage({type:"ds-frame-height",id:' + JSON.stringify(o.id) + ',' +
      'h:Math.ceil(document.documentElement.getBoundingClientRect().height)},"*")};' +

      'new ResizeObserver(send).observe(document.documentElement);addEventListener("load",send);send();' +

  function makeFrame(bodyHtml, opts) {
    const id = 'dsframe-' + (++frameSeq);
    const o = Object.assign({ id: id }, opts || {});
    const f = document.createElement('iframe');
    f.className = 'demo-frame';
    f.id = id;
    f.title = o.title || 'プレビュー';
    // allow-top-navigation は付けない ── 見本の JS がギャラリー自体を遷移させないため。
    // allow-same-origin は付ける（中身は自リポジトリのコードなので、親から高さを測ったり
    // DevTools で中を触れるほうが利点が大きい）。
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups');
    f.style.height = (o.height || 160) + 'px';
    f.srcdoc = buildFrameDoc(bodyHtml, o);
    return f;
  }

  const els = {};

  function initEls() {
    els.sidebar = $('#sidebar-nav');

  function itemByPath(path) {
    for (const c of state.cats) for (const it of c.items) if (it.path === path) return { item: it, cat: c };
    return null;
  }

  function renderSidebar() {
    const q = state.query.trim().toLowerCase();
    const hit = (t) => !q || String(t).toLowerCase().includes(q);
    const route = currentRoute();
    const parts = [];

    parts.push('<div class="nav-group"><p class="nav-group__h">概要</p><ul class="nav-list">' +
      navLink('#/', 'はじめに', route.kind === 'home') +
      navLink('#/tokens', 'デザイントークン', route.kind === 'tokens',
        state.missingVars.length ? state.missingVars.length + ' 件の未定義' : '') +
      '</ul></div>');

    // ガイドラインは概要の直下に、独立したグループとして置く（コンポーネント群より前）
    const guides = state.guideList.filter((g) => state.guides[g] && (hit(g) || hit('ガイドライン') || hit((state.guideMeta[g] || {}).role)));
    if (guides.length) {
      parts.push('<div class="nav-group"><p class="nav-group__h">ガイドライン</p><ul class="nav-list">' +
        guides.map((g) => navLink('#/g/' + encodeURIComponent(g), g.replace(/\.(md|ya?ml)$/, ''), route.kind === 'guide' && route.path === g)
          .replace('</a></li>', (state.changed.has('guide/' + g) ? '<span class="nav-changed" title="前回の同期から変わった">●</span>' : '') + '</a></li>')).join('') +
        '</ul></div>');
    }
    // Layout patterns: layout-index.md がある粒度だけ出す
    const grans = LAYOUT_GRANS.filter((g) => state.layouts[g[0]] && (hit(g[1]) || hit('layout') || hit('レイアウト')));
    if (grans.length) {
      parts.push('<div class="nav-group"><p class="nav-group__h">Layout patterns</p><ul class="nav-list">' +
        grans.map((g) => navLink('#/l/' + g[0], g[1], route.kind === 'layout' && route.g === g[0]).replace('</a></li>',
          (state.changed.has('layout/' + g[0]) ? '<span class="nav-changed" title="前回の同期から変わった">●</span>' : '') + '</a></li>')).join('') +
        '</ul></div>');
    }

    // Components: index の分類（Navigation / Form / …）を 1 つのセクションに束ね、分類は小見出しにする
    let compHits = 0;
    const subs = [];
    for (const cat of state.cats) {
      const items = cat.items.filter((it) => hit(it.name) || hit(it.when) || hit(it.path));
      if (!items.length) continue;
      compHits += items.length;
      subs.push('<div class="nav-sub"><p class="nav-sub__h">' + esc(cat.name) + '</p><ul class="nav-list">' +
        items.map((it) => {
          const st = statusOf(it.status);
          const active = route.kind === 'component' && route.path === it.path;
          const dot = state.changed.has(it.path) ? '<span class="nav-changed" title="前回の同期から変わった">●</span>' : '';
          return '<li><a class="nav-link' + (active ? ' is-active' : '') + '" href="#/c/' + encodeURIComponent(it.path) + '">' +
            (hasStatus() ? '<span class="st st--' + st.key + '" title="' + esc(st.label) + '" aria-hidden="true"></span>' : '') +
            '<span class="nav-link__t">' + esc(it.name) + '</span>' + dot + '</a></li>';
        }).join('') + '</ul></div>');
    }
    if (subs.length) parts.push('<div class="nav-group"><p class="nav-group__h">Components</p>' + subs.join('') + '</div>');

    if (q && !compHits) parts.push('<p class="nav-empty">「' + esc(q) + '」に一致するコンポーネントはありません。</p>');
    els.sidebar.innerHTML = parts.join('');

  function navLink(href, label, active, warn) {
    return '<li><a class="nav-link' + (active ? ' is-active' : '') + '" href="' + href + '">' +
      '<span class="nav-link__t">' + esc(label) + '</span>' +
      (warn ? '<span class="nav-warn" title="' + esc(warn) + '">!</span>' : '') + '</a></li>';

  /* --- ドキュメント（読み物）の描画 -------------------------------------- */

  function renderDoc(md, baseDir) {
    const r = mdToHtml(md);
    const wrap = document.createElement('div');
    wrap.className = 'doc';
    wrap.innerHTML = r.html;

    // md 内の相対リンクをギャラリー内の遷移に置き換える
    $$('a[data-mdlink]', wrap).forEach((a) => {
      const href = a.getAttribute('href');
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      if (!/\.md(#.*)?$/.test(href)) return;
      const resolved = resolvePath(baseDir, href.replace(/#.*$/, ''));
      const guideName = resolved.replace(/^guidelines\//, '');
      if (itemByPath(resolved)) a.setAttribute('href', '#/c/' + encodeURIComponent(resolved));
      else if (/^guidelines\//.test(resolved) && state.guides[guideName]) a.setAttribute('href', '#/g/' + encodeURIComponent(guideName));
      else a.classList.add('is-dead');
    });

    $$('[data-copy]', wrap).forEach((b) => {
      b.onclick = () => {
        const code = $('code', b.closest('figure')).textContent;
        navigator.clipboard.writeText(code).then(() => {
          b.textContent = 'コピーしました';
          setTimeout(() => { b.textContent = 'コピー'; }, 1400);
        });
      };
    });

    return { node: wrap, toc: r.toc };
  }

  // 'specific/display' + '../../base/display/Badge.md' → 'base/display/Badge.md'
  function resolvePath(baseDir, rel) {
    const seg = (baseDir ? baseDir.split('/') : []).concat(rel.split('/'));
    const out = [];
    for (const s of seg) {
      if (!s || s === '.') continue;
      if (s === '..') out.pop();
      else out.push(s);
    }
    return out.join('/');
  }

  function renderToc(toc, extra) {
    const rows = (extra || []).concat(toc.map((t) => ({ id: t.id, text: t.text, level: t.level })));
    if (!rows.length) { els.toc.innerHTML = ''; return; }
    els.toc.innerHTML = '<p class="toc__h">このページの内容</p><ul class="toc__list">' +
      rows.map((t) => '<li class="toc__i toc__i--' + (t.level || 2) + '"><a href="#' + t.id + '" data-toc>' + esc(t.text) + '</a></li>').join('') +
      '</ul>';
    $$('[data-toc]', els.toc).forEach((a) => {
      a.onclick = (e) => {
        e.preventDefault();
        const el = document.getElementById(a.getAttribute('href').slice(1));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
  }

  function renderExample(ex, ctx, idx) {
    const sec = document.createElement('section');

      '<div class="demo__head"><h3 class="demo__title" id="' + headId + '">' + esc(ex.name) + '</h3>' +

      '<div class="demo__tabs" role="tablist">' +
      '<button class="demo__tab is-on" type="button" role="tab" data-code="html">HTML</button>' +

    const panel = $('.demo__panel', sec);
    const codeBox = $('.demo__code', sec);

    // props の初期値
    const props = {};
    if (ex.props) for (const k of Object.keys(ex.props)) props[k] = ex.props[k].value;

    let currentHtml = '';
    const paint = () => {
      currentHtml = ex.render(props);

    // props パネル

      panel.hidden = false;
      panel.innerHTML = '<p class="demo__panel-h">プロパティ</p>' + Object.keys(ex.props).map((k) => {
        const c = ex.props[k];

          return '<div class="ctl"><label class="ctl__row" for="' + id + '"><input type="checkbox" id="' + id + '" data-prop="' + k + '"' + (c.value ? ' checked' : '') + '><span>' + esc(c.label || k) + '</span></label></div>';
        }
        if (c.type === 'select') {
          return '<div class="ctl"><label class="ctl__l" for="' + id + '">' + esc(c.label || k) + '</label>' +
            '<select class="ctl__f" id="' + id + '" data-prop="' + k + '">' +
            c.options.map((o) => '<option' + (o === c.value ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></div>';
        }
        if (c.type === 'number') {
          return '<div class="ctl"><label class="ctl__l" for="' + id + '">' + esc(c.label || k) + ' <b data-out="' + k + '">' + c.value + '</b></label>' +
            '<input class="ctl__f" type="range" id="' + id + '" data-prop="' + k + '" min="' + (c.min != null ? c.min : 0) + '" max="' + (c.max != null ? c.max : 100) + '" value="' + c.value + '"></div>';
        }

  // 見本の HTML をインデントし直して読める形にする（テンプレートの改行はまちまちなので）
  function formatHtml(html) {
    const VOID = /^(area|base|br|col|embed|hr|img|input|link|meta|source|track|wbr)$/i;
    const tokens = String(html).replace(/>\s+</g, '><').trim().split(/(<[^>]+>)/).filter((s) => s.trim());
    let depth = 0;
    const out = [];
    for (const t of tokens) {
      if (/^<\//.test(t)) depth = Math.max(0, depth - 1);
      out.push('  '.repeat(depth) + t.trim());
      if (/^<[^/!]/.test(t) && !/\/>$/.test(t) && !VOID.test((t.match(/^<(\w+)/) || [])[1] || '')) depth++;
    }
    return out.join('\n');
  }

  /* --- コンポーネントのページ --------------------------------------------- */

      fences.html.forEach((h, i) => {

        $('.demo__stage', box).appendChild(makeFrame(h, { css: mdCss, frameClass: demo && demo.frameClass, title: 'Canonical Markup ' + (i + 1) }));

  /* --- ガイドラインのページ ------------------------------------------------ */

  function pageGuide(name) {
    const md = state.guides[name];
    if (!md) return pageMissing('ガイドライン「' + name + '」を読み込めませんでした。');
    const meta = state.guideMeta[name] || {};
    const root = document.createElement('div');
    root.className = 'page';
    root.innerHTML = '<header class="page__head"><p class="page__eyebrow">ガイドライン' + (meta.role ? ' — ' + esc(meta.role) : '') + '</p>' +
      '<h1 class="page__title">' + esc(name.replace(/\.(md|ya?ml)$/, '')) + '</h1>' +
      (meta.answers ? '<p class="page__when">' + inline(meta.answers) + '</p>' : '') +
      '<div class="page__meta"><code class="page__path">' + esc(CFG.dsPath) + '/guidelines/' + esc(name) + '</code>' +
      (state.changed.has('guide/' + name) ? '<span class="chip chip--changed">前回の同期から更新あり</span>' : '') +
      '</div></header>';
    if (/\.ya?ml$/.test(name)) {
      const r = renderRuleYaml(md);
      r.nodes.forEach((n) => root.appendChild(n));
      renderToc([], r.toc);
      return root;
    }
    const sec = document.createElement('section');
    sec.className = 'block';
    root.appendChild(sec);
    const d = renderDoc(md, 'guidelines');
    sec.appendChild(d.node);
    renderToc(d.toc, []);
    return root;
  }

  /* --- 機械判定禁則の yaml -------------------------------------------------------
   * `rules:` の配列（- id: … の項目）と、その直前のコメント（根拠）を読んでカードにする。
   * yaml の一般パーサではない: 1 行のスカラー・`["a", "b"]` 形式の配列・引用符だけを扱う。
   * この形でない yaml はコードブロックとしてそのまま出す */
  function parseRuleYaml(text) {
    const lines = String(text || '').replace(/\r\n/g, '\n').split('\n');
    const intro = [];
    const rules = [];
    let i = 0;
    const isRule = (l) => /^\s*rules\s*:\s*$/.test(l);
    for (; i < lines.length && !isRule(lines[i]); i++) {
      const m = lines[i].match(/^\s*#\s?(.*)$/);
      if (m && !/^[=\-]{3,}\s*$/.test(m[1])) intro.push(m[1]);
    }
    if (i >= lines.length) return null;
    i++;
    let section = '';
    let pending = [];
    let cur = null;
    const val = (s) => {
      s = s.trim();
      if (!/^["'\[]/.test(s)) s = s.replace(/\s+#.*$/, '').trim();
      if (/^\[.*\]$/.test(s)) return (s.slice(1, -1).match(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|[^,]+/g) || []).map((x) => x.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
      if (/^".*"$/.test(s) || /^'.*'$/.test(s)) return s.slice(1, -1);
      return s;
    };
    for (; i < lines.length; i++) {
      const line = lines[i];
      const sec = line.match(/^\s*#\s*---\s*(.+?)\s*---\s*$/);
      if (sec) { section = sec[1]; pending = []; continue; }
      const cm = line.match(/^\s*#\s?(.*)$/);
      if (cm) { pending.push(cm[1]); continue; }
      const start = line.match(/^\s*-\s+(\w+)\s*:\s*(.*)$/);
      if (start) {
        // 直前のコメントのうち、「AP-01 / name」のようなラベル行は id/name と重複するので落とす
        const desc = pending.filter((l) => !/^[A-Z]{1,4}-\d+\s*\/\s*\S+\s*$/.test(l) && l.trim());
        cur = { section: section, fields: [], desc: desc };
        cur.fields.push([start[1], val(start[2])]);
        rules.push(cur); pending = []; continue;
      }
      const kv = line.match(/^(\s{2,})(\w+)\s*:\s*(.*)$/);
      if (kv && cur) {
        // ブロックスカラー（>- / |- 等）: キーより深く字下げされた続きの行を 1 つの値にまとめる
        const block = kv[3].trim().match(/^([>|])[+-]?\s*(#.*)?$/);
        if (block) {
          const indent = kv[1].length;
          const buf = [];
          while (i + 1 < lines.length && (!lines[i + 1].trim() || /^\s+/.test(lines[i + 1]) && lines[i + 1].match(/^\s*/)[0].length > indent)) { buf.push(lines[i + 1].trim()); i++; }
          while (buf.length && !buf[buf.length - 1]) buf.pop();
          cur.fields.push([kv[2], block[1] === '>' ? buf.join(' ').replace(/\s{2,}/g, ' ') : buf.join('\n')]);
          continue;
        }
        cur.fields.push([kv[2], val(kv[3])]); continue;
      }
    }
    for (const r of rules) { r.get = (k) => { const f = r.fields.find((x) => x[0] === k); return f ? f[1] : undefined; }; }
    return { intro: intro, rules: rules };
  }

  function renderRuleYaml(text) {
    const parsed = parseRuleYaml(text);
    const nodes = [];
    const toc = [];
    if (!parsed || !parsed.rules.length) {
      const sec = document.createElement('section');
      sec.className = 'block';
      sec.innerHTML = '<figure class="md-code"><figcaption>yaml</figcaption><pre><code>' + esc(text) + '</code></pre></figure>';
      return { nodes: [sec], toc: toc };
    }
    if (parsed.intro.length) {
      const sec = document.createElement('section');
      sec.className = 'block';
      sec.innerHTML = '<details class="rule-intro"><summary>ファイル冒頭の説明（位置づけ・方針・語彙の凡例）</summary><pre>' + esc(parsed.intro.join('\n').trim()) + '</pre></details>';
      nodes.push(sec);
    }
    // 見出しは「# --- xxx ---」の節、無ければ category の値
    const groups = [];
    for (const r of parsed.rules) {
      const key = r.section || String(r.get('category') || 'rules');
      let g = groups.find((x) => x.key === key);
      if (!g) { g = { key: key, rules: [] }; groups.push(g); }
      g.rules.push(r);
    }
    const shown = new Set(['id', 'name', 'category', 'severity', 'introduced_at']);
    for (const g of groups) {
      const id = 'rules-' + String(g.key).toLowerCase().replace(/[^\w\u3040-\u9fff-]+/g, '-');
      toc.push({ id: id, text: g.key, level: 2 });
      const sec = document.createElement('section');
      sec.className = 'block';
      sec.innerHTML = '<h2 class="block__h" id="' + id + '">' + esc(g.key) + '<span class="block__count">' + g.rules.length + '</span></h2>' +
        g.rules.map((r) => {
          const sev = String(r.get('severity') || '');
          const meta = r.fields.filter((f) => !shown.has(f[0]));
          return '<article class="rule" id="' + esc(String(r.get('id') || '')) + '">' +
            '<div class="rule__head"><code class="rule__id">' + esc(String(r.get('id') || '')) + '</code>' +
            '<b class="rule__name">' + esc(String(r.get('name') || '')) + '</b>' +
            (sev ? '<span class="chip chip--sev-' + esc(sev) + '">' + esc(sev) + '</span>' : '') +
            (r.get('category') && r.section && !r.section.startsWith(String(r.get('category'))) ? '<span class="rule__cat">' + esc(String(r.get('category'))) + '</span>' : '') +
            (r.get('introduced_at') ? '<span class="rule__date">' + esc(String(r.get('introduced_at'))) + '</span>' : '') + '</div>' +
            (r.desc.length ? '<p class="rule__desc">' + r.desc.map((l) => inline(l)).join('<br>') + '</p>' : '') +
            '<dl class="rule__meta">' + meta.map((f) => '<div><dt>' + esc(f[0]) + '</dt><dd>' +
              (Array.isArray(f[1]) ? f[1].map((v) => '<code class="rule__term">' + esc(v) + '</code>').join(' ') : inline(String(f[1]))) + '</dd></div>').join('') + '</dl>' +
            '</article>';
        }).join('');
      nodes.push(sec);
    }
    return { nodes: nodes, toc: toc };
  }

  /* --- レイアウトの骨組み（layout_patterns/）------------------------------------ */

  // layout-index.md（または index.md）の表から、File 列が `*.html` の行を拾う。列名はそのまま使う（粒度ごとに違う）
  // 表は複数あってよい（節ごとに分かれている index もある）。列名は各表の見出し行から取り、行ごとに持たせる
  function parseLayoutIndex(md) {
    const lines = String(md || '').split('\n');
    let columns = [];
    let inTable = false;
    const rows = [];
    for (const raw of lines) {
      if (!/^\|/.test(raw)) { inTable = false; continue; }
      const cells = raw.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      if (/^:?-+:?$/.test(cells[0])) continue;                   // 区切り行
      const file = cells[0].match(/^`([^`]+\.html)`$/);
      if (!inTable) { inTable = true; if (!file) { columns = cells.slice(1); continue; } }
      if (!file) continue;                                        // html を指さない行は一覧に出さない
      rows.push({ file: file[1], cells: cells.slice(1), columns: columns });
    }
    return { rows: rows };
  }

  // 縮小 iframe を枠の幅に合わせる（枠は 16:10、中身は 1280×800 で描いて縮める）
  const LP_W = 1280;
  function fitLayoutThumbs() {
    $$('.lp-thumb').forEach((t) => {
      const s = t.clientWidth / LP_W;
      const f = $('iframe', t);
      if (f) f.style.transform = 'scale(' + s + ')';
    });
  }
  window.addEventListener('resize', () => { if (currentRoute().kind === 'layout') fitLayoutThumbs(); });

  function pageLayout(g) {
    const label = (LAYOUT_GRANS.find((x) => x[0] === g) || [g, g])[1];
    const md = state.layouts[g];
    if (!md) return pageMissing('レイアウト「' + g + '」の layout-index.md（または index.md）を読み込めませんでした。');
    const idx = parseLayoutIndex(md);
    const dir = 'layout_patterns/';
    const indexFile = state.layoutFiles[g] || 'layout-index.md';
    const bust = state.mode !== 'snapshot' ? '?t=' + Date.now() : '';
    const root = document.createElement('div');
    root.className = 'page';
    root.innerHTML = '<header class="page__head"><p class="page__eyebrow">Layout patterns</p>' +
      '<h1 class="page__title">' + esc(label) + '</h1>' +
      '<p class="page__when">一覧の正は <code>' + esc(indexFile) + '</code>、見た目の正は各 HTML。サムネイルは実物を縮小して表示している（クリックで実寸を開く）。<br>' +
      '※ 付属のテンプレートは、サービス固有の情報を含まないよう、ペインの骨格だけに抽象化している。そのため、これを元に生成した画面は、ペインの中身の組み方が実行ごとにぶれやすい。</p>' +
      '<div class="page__meta"><code class="page__path">' + esc(CFG.dsPath) + '/' + esc(dir) + esc(indexFile) + '</code>' +
      (state.changed.has('layout/' + g) ? '<span class="chip chip--changed">前回の同期から更新あり</span>' : '') +
      '</div></header>';

    const sec = document.createElement('section');
    sec.className = 'block';
    sec.innerHTML = '<h2 class="block__h" id="lp-list">骨組み<span class="block__count">' + idx.rows.length + '</span></h2>' +
      (idx.rows.length ? '<div class="lp-grid">' + idx.rows.map((r) => {
        // 取り込んだ HTML があればそれを使う（ギャラリー単体で開いても骨組みが出る）
        const src = state.layoutHtml && state.layoutHtml[r.file];
        const href = src ? URL.createObjectURL(new Blob([src], { type: 'text/html' })) : LAYOUT_DIR + r.file;
        return '<article class="lp-card">' +
          '<a class="lp-thumb" href="' + esc(href) + '" target="_blank" rel="noopener" title="実寸で開く">' +
          '<iframe ' + (src ? 'srcdoc="' + esc(src) + '"' : 'src="' + esc(href + bust) + '"') + ' loading="lazy" sandbox="allow-scripts allow-same-origin" tabindex="-1" aria-hidden="true"></iframe></a>' +
          '<div class="lp-body"><p class="lp-name"><code>' + esc(r.file) + '</code></p>' +
          '<dl class="lp-meta">' + r.columns.map((c, i) => r.cells[i] ? '<div><dt>' + esc(c) + '</dt><dd>' + inline(r.cells[i]) + '</dd></div>' : '').join('') + '</dl>' +
          '</div></article>';
      }).join('') + '</div>'
      : '<p class="nav-empty">' + esc(indexFile) + ' の表に <code>*.html</code> の行がありません（1 列目がバッククォート付きの <code>*.html</code> である表だけを読む）。</p>');
    root.appendChild(sec);

    const docSec = document.createElement('section');
    docSec.className = 'block';
    docSec.innerHTML = '<h2 class="block__h" id="lp-doc">ドキュメント</h2>';
    const d = renderDoc(md, dir.replace(/\/$/, ''));
    docSec.appendChild(d.node);
    root.appendChild(docSec);
    renderToc(d.toc, [{ id: 'lp-list', text: '骨組み', level: 2 }, { id: 'lp-doc', text: 'ドキュメント', level: 2 }]);
    return root;
  }

  /* --- トークンのページ ---------------------------------------------------- */

  function pageTokens() {
    const root = document.createElement('div');
    root.className = 'page';
    root.innerHTML = '<header class="page__head"><p class="page__eyebrow">Foundations</p>' +
      '<h1 class="page__title">デザイントークン</h1>' +
      '<p class="page__when">プレビュー枠に流し込んでいる CSS 変数の一覧。値は <code>' + esc(CFG.dsPath) + '/tokens/*.json</code> が正で、同期するとここも変わる。</p></header>';
    const toc = [];

    if (state.missingVars.length) {
      toc.push({ id: 'tok-missing', text: '未定義の CSS 変数', level: 2 });
      const sec = document.createElement('section');
      sec.className = 'block';
      sec.innerHTML = '<h2 class="block__h" id="tok-missing">未定義の CSS 変数<span class="block__count">' + state.missingVars.length + '</span></h2>' +
        '<p class="block__note">CSS が参照しているのに <code>tokens/*.json</code> に無い変数。' +
        'そこは値が効かないので、<b>トークンを足す</b>か、<b>参照側をこの DS にある名前へ直す</b>か、' +
        '<code>var(--x, 既定値)</code> でフォールバックを書く。</p>' +
        '<div class="md-tablewrap"><table class="md-table"><thead><tr><th>CSS 変数</th><th>参照している場所</th></tr></thead><tbody>' +
        state.missingVars.map(function (v) {
          return '<tr><td><code>' + esc(v.name) + '</code></td><td>' +
            v.where.map(function (w) { return '<code>' + esc(w) + '</code>'; }).join('<br>') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      root.appendChild(sec);
    }

    const resolved = resolveTokens(state.tokens);
    for (const name of TOKEN_FILES) {
      const json = state.tokens[name];
      if (!json) continue;
      const rows = resolved.filter((t) => t.file === name && t.value != null && typeof t.value !== 'object');
      const id = 'tok-' + name;
      toc.push({ id: id, text: name, level: 2 });
      const sec = document.createElement('section');
      sec.className = 'block';
      sec.innerHTML = '<h2 class="block__h" id="' + id + '">' + esc(name) + '<span class="block__count">' + rows.length + '</span></h2>' +
        '<div class="md-tablewrap"><table class="md-table tok-table"><thead><tr><th></th><th>トークン</th><th>CSS 変数</th><th>値</th><th>説明</th></tr></thead><tbody>' +
        rows.map((t) => {
          const varn = varNames(t.path);
          const v = String(t.value);
          return '<tr><td class="tok-sw">' + swatch(name, t, v) + '</td>' +
            '<td><code>' + esc(t.path.join('.')) + '</code></td>' +
            '<td>' + varn.map((n) => '<code>' + esc(n) + '</code>').join('<br>') + '</td>' +
            '<td><code>' + esc(v) + '</code>' + (t.alias ? '<br><small>' + esc(t.alias) + '</small>' : '') + '</td>' +
            '<td class="tok-desc">' + (t.desc ? inline(String(t.desc).split('\n')[0]) : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      root.appendChild(sec);
    }
    renderToc(toc, []);
    return root;
  }

  function swatch(file, t, v) {
    if (file === 'color') return '<span class="sw" style="background:' + esc(v) + '"></span>';
    if (file === 'radius') return '<span class="sw sw--box" style="border-radius:' + esc(v) + '"></span>';
    if (file === 'elevation' && /shadow/.test(t.path.join('.'))) return '<span class="sw sw--box" style="box-shadow:' + esc(v) + ';border-color:transparent"></span>';
    if (file === 'spacing' && /^\d+$/.test(t.path[t.path.length - 1])) return '<span class="sw sw--bar" style="width:' + esc(v) + '"></span>';
    return '';
  }

  /* --- はじめに ------------------------------------------------------------ */

  function pageHome() {
    const total = state.cats.reduce((a, c) => a + c.items.length, 0);
    const withDemo = state.cats.reduce((a, c) => a + c.items.filter((i) => window.__DS_DEMOS__[i.path]).length, 0);
    const counts = { done: 0, partial: 0, none: 0, unknown: 0 };
    state.cats.forEach((c) => c.items.forEach((i) => { counts[statusOf(i.status).key]++; }));
    const guideNames = state.guideList.filter((g) => state.guides[g]);
    const layoutRows = LAYOUT_GRANS.filter((g) => state.layouts[g[0]]).map((g) => ({ g: g[0], label: g[1], n: parseLayoutIndex(state.layouts[g[0]]).rows.length }));
    const layoutTotal = layoutRows.reduce((a, r) => a + r.n, 0);
    // トークン: ファイルごとの葉の数（alias は解決後に数える。複合値は除く）
    const tokenCounts = {};
    for (const t of resolveTokens(state.tokens)) { if (t.value == null || typeof t.value === 'object') continue; tokenCounts[t.file] = (tokenCounts[t.file] || 0) + 1; }
    const tokenRows = TOKEN_FILES.filter((f) => tokenCounts[f]).map((f) => ({ f: f, n: tokenCounts[f] }));
    const tokenTotal = tokenRows.reduce((a, r) => a + r.n, 0);
    const noDemo = total - withDemo;

    const root = document.createElement('div');
    root.className = 'page';
    root.innerHTML =
      '<header class="page__head"><p class="page__eyebrow">Design System</p>' +
      '<h1 class="page__title">' + esc(CFG.brand) + ' Gallery</h1>' +
      // 文字絵（ロゴ）。見出しの直下・説明文の上に出す。飾りなので読み上げない
      (CFG.homeArt ? '<pre class="home-art" aria-hidden="true">' + esc(String(CFG.homeArt).replace(/^\n+|\s+$/g, '')) + '</pre>' : '') +
      '<p class="page__when">' + (CFG.homeLead
        ? esc(CFG.homeLead).replace(/\n/g, '<br>')   // 改行はそのまま改行として出す
        : '<code>' + esc(CFG.dsPath) + '/</code> の md とトークンを、そのまま見た目と挙動で確認するための画面。' +
          'このギャラリーは md を書き換えない ── 仕様の正は md のままで、ここは読んで見せるだけ。') + '</p></header>' +
      (state.mode === 'snapshot' && !STANDALONE
        ? '<div class="banner banner--warn banner--alert" role="status">' +
          '<svg class="banner__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 4.3 2.6 17.6a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>' +
          '<div><p class="banner__title">スナップショット表示中</p>' +
          (FOLDER_API
            ? '<p>file:// では md を fetch できないので、取り込んだ内容を出している。' +
              (folder.saved ? '前回選んだフォルダの読み取り権限が切れています。' : '') +
              '<b>ヘッダーの「同期」</b>（または下のボタン）で DS ディレクトリ <code>' + esc(CFG.dsPath) + '</code> を選ぶと、' +
              'そのフォルダを直接読んで同期できるようになる（次回以降は権限が残っていればそのまま同期できる）。</p>' +
              '<p><button class="btn btn--primary" type="button" data-pick-folder>' + (folder.saved ? 'フォルダに再接続して同期' : 'フォルダを選んで同期') + '</button></p>'
            : '<p>file:// では md を読み直せない。md を直した後に表示を更新するには、<code>' + esc(CFG.serveCmd) + '</code> で開いて、同期ボタンを押してください' +
              '（Chrome / Edge なら、同期ボタンでフォルダを選んで file:// のまま同期できる）。</p>') +
          '</div></div>'
        : '') +
      (state.mode === 'folder'
        ? '<div class="banner banner--info banner--alert" role="status">' +
          '<div><p class="banner__title">フォルダを直接読んでいます（file://）</p>' +
          '<p><code>' + esc((folder.root && folder.root.name) || '') + (folder.dsParts && folder.dsParts.length ? '/' + esc(folder.dsParts.join('/')) : '') + '</code> の md・トークン・CSS を、同期のたびに読み直す。' +
          'フォルダを選び直すときは、ブラウザのアドレスバー左のサイト設定でファイルシステムの許可を外してから同期を押す。</p></div></div>'
        : '') +
      '<section class="block"><div class="md-tablewrap"><table class="md-table home-table">' +

      '<tr><td>デザイントークン</td><td class="num">' + tokenTotal + '</td>' +
      '<td>' + tokenRows.map((r) => esc(r.f) + ' ' + r.n).join(' / ') + '</td></tr>' +
      '<tr><td>ガイドライン</td><td class="num">' + guideNames.length + '</td>' +
      '<td>' + guideNames.map((g) => esc(g.replace(/\.(md|ya?ml)$/, ''))).join(' / ') + '</td></tr>' +
      '<tr><td>Layout patterns</td><td class="num">' + layoutTotal + '</td>' +
      '<td>' + layoutRows.map((r) => esc(r.label) + ' ' + r.n).join(' / ') + '</td></tr>' +
      '<tr><td>コンポーネント</td><td class="num">' + total + '</td>' +
      '<td>' + state.cats.map((c) => esc(c.name) + ' ' + c.items.length).join(' / ') +
      (noDemo ? '<br><small>動く見本なし ' + noDemo + '</small>' : '') +
      (hasStatus() ? '<br><small>✅ 実装あり ' + counts.done + ' / 🟡 部分実装 ' + counts.partial + ' / ⚪ 実装なし ' + counts.none + '</small>' : '') +
      '</td></tr>' +

      (STANDALONE ? '' :

      b.onclick = () => navigator.clipboard.writeText($('code', b.closest('figure')).textContent).then(() => {
        b.textContent = 'コピーしました';
        setTimeout(() => { b.textContent = 'コピー'; }, 1400);
      });
    });
    return root;
  }

  function pageMissing(msg) {
    const root = document.createElement('div');
    root.className = 'page';
    root.innerHTML = '<header class="page__head"><h1 class="page__title">見つかりません</h1><p class="page__when">' + esc(msg) + '</p></header>';
    renderToc([], []);
    return root;
  }

  /* ==========================================================================
   * 7. ルーティング
   * ======================================================================== */

  function currentRoute() {
    const h = location.hash.replace(/^#/, '');
    if (h.startsWith('/c/')) return { kind: 'component', path: decodeURIComponent(h.slice(3)) };
    if (h.startsWith('/g/')) return { kind: 'guide', path: decodeURIComponent(h.slice(3)) };
    if (h.startsWith('/l/')) return { kind: 'layout', g: decodeURIComponent(h.slice(3)) };
    if (h === '/tokens') return { kind: 'tokens' };
    return { kind: 'home' };
  }

  function render() {
    applyAccent();
    const r = currentRoute();
    els.main.innerHTML = '';
    let node;
    if (r.kind === 'component') node = pageComponent(r.path);
    else if (r.kind === 'guide') node = pageGuide(r.path);
    else if (r.kind === 'layout') node = pageLayout(r.g);
    else if (r.kind === 'tokens') node = pageTokens();
    else node = pageHome();
    els.main.appendChild(node);
    window.scrollTo(0, 0);
    renderSidebar();
    document.title = (r.kind === 'component' ? r.path.split('/').pop().replace(/\.md$/, '') + ' — ' : '') +
      (r.kind === 'layout' ? 'Layout patterns ' + r.g + ' — ' : '') +
      CFG.brand + ' Gallery';
    if (r.kind === 'layout') fitLayoutThumbs();
  }

  /* ==========================================================================
   * 8. 同期
   * ======================================================================== */

  function stamp() {
    const t = state.syncedAt;
    const hhmm = t ? String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ':' + String(t.getSeconds()).padStart(2, '0') : '—';
    // バッジは live / folder のときだけ出す（snapshot の案内は「はじめに」に置いてある）
    els.modeBadge.hidden = state.mode === 'snapshot';
    els.modeBadge.textContent = state.mode;
    els.modeBadge.className = 'mode mode--' + state.mode;
    els.syncInfo.textContent = state.mode !== 'snapshot'
      ? '最終同期 ' + hhmm
      : STANDALONE ? '' : '最終更新 ' + (state.generatedAt || '日時不明');   // 単体版は生成日時を出さない
    els.syncBtn.title = state.mode === 'snapshot' && FOLDER_API
      ? 'DS ディレクトリを選んで、そのフォルダを直接読む'
      : 'md とトークンを読み直す';
  }

  function banner(html, kind) {
    if (!html) { els.banner.hidden = true; els.banner.innerHTML = ''; return; }
    els.banner.hidden = false;
    els.banner.className = 'banner banner--' + (kind || 'info');
    els.banner.innerHTML = html;
  }

  let syncing = false;
  async function sync(opts) {
    if (syncing) return;
    const silent = opts && opts.silent;
    syncing = true;
    els.syncBtn.disabled = true;
    if (!silent) { els.syncLabel.textContent = '同期中…'; els.syncBtn.classList.add('is-syncing'); }
    try {
      if (state.mode === 'snapshot' && !folder.root) {   // まだフォルダに繋いでいないときだけ選ばせる
        if (!FOLDER_API) throw new Error('このブラウザはフォルダの読み取り（File System Access API）に対応していません');
        if (!(await restoreFolder(true))) await pickFolder();   // 保存済みなら権限を求め直す。無ければ選ばせる
      }
      const data = await loadLive();
      const changed = apply(data, freshMode());
      render();
      stamp();
      if (!silent) {
        banner(changed.size
          ? '<b>' + changed.size + " 件</b>の md が前回から変わっていた。左の一覧の ● が付いた項目。"
          : '同期しました。前回から変わった md はありません。', changed.size ? 'ok' : 'info');
        setTimeout(() => banner(''), 6000);
      }
    } catch (err) {
      if (err && err.name === 'AbortError') {
        banner('');   // フォルダ選択をキャンセルしただけ
      } else if (state.mode === 'snapshot') {
        banner('<b>同期できません。</b>' + esc(String(err.message || err)) +
          (FOLDER_API
            ? '<br>もう一度「同期」を押して、<code>' + esc(CFG.dsPath) + '</code>（components/ と tokens/ を持つディレクトリ）を選んでください。'
            : '<br>file:// で開いていると md を読み直せません。<code>' + esc(CFG.serveCmd) + '</code> で開き直してください。'), 'warn');
      } else {
        banner('<b>同期に失敗しました。</b>' + esc(String(err.message || err)), 'warn');
      }
    } finally {
      syncing = false;
      els.syncBtn.disabled = false;
      els.syncLabel.textContent = '同期';
      els.syncBtn.classList.remove('is-syncing');
    }
  }

  // 自動同期：いま開いている md だけを見に行き、変わっていたら全体を同期する
  let autoTimer = null;
  function setAutoSync(on) {
    state.autoSync = on;
    clearInterval(autoTimer);
    if (!on) return;
    autoTimer = setInterval(async () => {
      if (state.mode === 'snapshot' || syncing || document.hidden) return;
      const r = currentRoute();
      const url = r.kind === 'component' ? '../components/' + r.path
        : r.kind === 'guide' ? '../guidelines/' + r.path
          : '../components/component-index.md';
      const known = r.kind === 'component' ? state.docs[r.path]
        : r.kind === 'guide' ? state.guides[r.path]
          : state.index;
      try {
        const text = await getText(url);
        if (known && text !== known) await sync({ silent: false });
      } catch (e) { /* 落ちても静かに次の周回へ */ }
    }, 3000);
  }

  /* ==========================================================================
   * 9. 起動
   * ======================================================================== */

  async function boot() {
    initEls();
    $('#brand-mark').textContent = CFG.mark;
    $('.brand__t').textContent = CFG.brand + ' Gallery';
    $('#sidebar-title').textContent = CFG.brand;

    let loaded = false;
    if (STANDALONE) {   // 単一ファイル版：fetch もフォルダも使わず、埋め込みだけで動く。同期 UI は出さない
      els.syncBtn.hidden = true;
      els.autoSync.closest('label').hidden = true;
    } else {
      try { apply(await loadLive(), 'live'); loaded = true; } catch (err) { /* file:// など。次へ */ }
    }
    if (!loaded && FOLDER_API) {
      // 前回選んだフォルダの権限が残っていれば、聞かずにそのまま読む（切れていれば同期ボタンで求め直す）
      try { if (await restoreFolder(false)) { apply(await loadLive(), 'folder'); loaded = true; } }
      catch (err) { console.warn('[gallery] 保存済みフォルダから読めませんでした: ' + err); folder.root = null; folder.dsParts = null; }
    }
    if (!loaded) {
      try {
        apply(loadSnapshot(), 'snapshot');   // 案内は「はじめに」のページにだけ出す（pageHome）
      } catch (e2) {
        document.body.innerHTML = '<p style="padding:40px;font:14px system-ui">読み込みに失敗しました：' + esc(String(e2.message || e2)) + '</p>';
        return;
      }
    }

    state.changed = new Set();
    render();
    stamp();

    els.search.addEventListener('input', () => { state.query = els.search.value; renderSidebar(); });
    els.syncBtn.addEventListener('click', () => sync({}));
    document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('[data-pick-folder]')) sync({}); });   // 「はじめに」のボタン
    window.__DS_GALLERY__ = { connectFolder: connectFolder, sync: sync, state: state };   // 検証用（テストからハンドルを差し込む）
    els.autoSync.addEventListener('change', () => setAutoSync(els.autoSync.checked));
    window.addEventListener('hashchange', render);
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== els.search) { e.preventDefault(); els.search.focus(); els.search.select(); }
      if (e.key === 'Escape' && document.activeElement === els.search) { els.search.value = ''; state.query = ''; renderSidebar(); els.search.blur(); }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>

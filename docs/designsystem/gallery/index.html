UI Avatar 仕様。Tailwind CSS。値は `tokens/`（イニシャル背景は `color.primary.50`）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Avatar\n- **Variants**: 画像（image） / イニシャル（initials） / グループ（group）（+ ステータスドット）\n- **Responsibility**:\n  - する: ユーザーのプロフィール画像またはイニシャルを表示し、本人を識別させる\n  - しない: クリック操作のトリガー単体（→ ボタン/メニューと組み合わせる）/ 装飾アイコン（→ Icon）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: ユーザー識別 / フォールバック（画像がなければイニシャル）/ ステータス表示（オンライン/離席/オフラインをドットで）/ グループ対応（複数アバターを左→右に重ねる）。\n\n---\n\n## 2. Variants & States\n\n**Variants**（コンテンツ）\n\n| 種類 | 説明 | class |\n|------|------|-------|\n| 画像 | `<img>` でプロフィール画像 | `rounded-full object-cover` + `alt` |\n| イニシャル | 画像がない場合の代替 | `rounded-full bg-primary-50 flex items-center justify-center font-medium text-primary-500` + `role=\"img\"` `aria-label` |\n| グループ | 複数アバターを重ねる | `flex -space-x-2` + 各 `border-2 border-white`。残数は `bg-slate-100 text-body`「+N」 |\n\n**ステータスドット**（任意）\n\n| 状態 | 色 | aria-label |\n|------|-----|-----------|\n| Online | `bg-emerald-500` | `\"オンライン\"` |\n| Away | `bg-amber-400` | `\"離席中\"` |\n| Offline | `bg-slate-300` | `\"オフライン\"` |\n\n共通: `absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white`。\n\n静的表示のためインタラクション状態（hover/active）は持たない。\n\n---\n\n## 3. サイズ / Props\n\n| サイズ | class | px | イニシャル文字 |\n|--------|-------|-----|---------------|\n| Small | `w-8 h-8` | 32px | `text-xs` |\n| Medium（既定） | `w-10 h-10` | 40px | `text-sm` |\n| Large | `w-12 h-12` | 48px | `text-base` |\n\n主な Props（参考）: `src`/`alt`（画像）/ `name`（イニシャル生成）/ `size`（sm/md/lg）/ `status`（online/away/offline）。\n\n---\n\n## 4. Composition Rules\n\n許可: `<img>` または イニシャルテキスト / ステータスドット（`<span>`）。\n禁止: 画像なし・イニシャルなしの空アバター / `w-10 h-10` 以外をデフォルトにする（S/M/L の3段階固定）/ グループの重なり方向を右→左にする（左→右・`-space-x-2`）。\n配置: ステータスドット付きは `relative inline-block` で包む。\n\n---\n\n## 5. Layout & Spacing\n\n- 角丸は `rounded-full` 固定\n- グループ重なりは `-space-x-2`（左→右）、各アバターに `border-2 border-white` で区切る\n- ステータスドット: 右下 `bottom-0 right-0`、`w-3 h-3`、白ボーダー `border-2 border-white`\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| イニシャル背景 | `color.primary.50` |\n| イニシャル文字 | `color.primary.500` |\n| グループ残数背景 | `color.surface.sunken` 近傍（slate-100） |\n| ステータス online | `color.status.success.fill` 近傍（emerald-500） |\n| ステータス away | `color.status.warning.base` 近傍（amber-400） |\n| ステータス offline | `color.content.disabled` 近傍（slate-300） |\n| ドット白ボーダー | `color.surface.raised`（white） |\n| 角丸 | `radius.full` |\n\n---\n\n## 7. Accessibility\n\n| 属性 | 値 |\n|------|-----|\n| `alt` | 画像に必ず代替テキスト（装飾的な場合は `alt=\"\"`） |\n| `role=\"img\"` + `aria-label` | イニシャルアバターにユーザー名 |\n| `aria-label` | ステータスドットに状態（「オンライン」等） |\n| グループ | 各アバターに個別の `alt` |\n\n- 色だけでステータスを伝えない（`aria-label` 併用）\n\n## 8. Content Guidelines\n- イニシャルは姓名の頭文字（2文字目安）\n- ステータスは状態を明示するラベルを付与\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 画像アバター（M） -->\n<img src=\"...\" alt=\"サンプル 太郎\" class=\"w-10 h-10 rounded-full object-cover\">\n\n<!-- Do: イニシャルアバター -->\n<div role=\"img\" aria-label=\"サンプル 太郎\" class=\"w-10 h-10 rounded-full bg-primary-50 flex items-center justify-center text-sm font-medium text-primary-500\">TK</div>\n\n<!-- Do: ステータスドット付き -->\n<div class=\"relative inline-block\">\n  <img src=\"...\" alt=\"サンプル 太郎\" class=\"w-10 h-10 rounded-full object-cover\">\n  <span class=\"absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white bg-emerald-500\" aria-label=\"オンライン\"></span>\n</div>\n\n<!-- Do: アバターグループ（左→右に重ねる） -->\n<div class=\"flex -space-x-2\">\n  <img src=\"...\" alt=\"ユーザー 1\" class=\"w-10 h-10 rounded-full border-2 border-white object-cover\">\n  <img src=\"...\" alt=\"ユーザー 2\" class=\"w-10 h-10 rounded-full border-2 border-white object-cover\">\n  <div class=\"w-10 h-10 rounded-full border-2 border-white bg-slate-100 flex items-center justify-center text-xs font-medium text-body\">+3</div>\n</div>\n```\n\n**Don't**: `aria-label` 省略（`role=\"img\"` と併用必須）/ 画像なし・イニシャルなしの空アバター / `w-10 h-10` 以外をデフォルト / グループ重なりを右→左にする。\n\n---\n\n## 10. Implementation Notes\n- 画像読み込み失敗時はイニシャルにフォールバック（`onerror`）\n- サイドバーのアカウントカードでは `w-[32px] h-[32px] rounded-full bg-[#ee8c29] text-white`（オレンジ）パターンも使われる\n- コメント・アクティビティ内の小アバターは `w-6 h-6`（`Activity.md` 参照）\n", "base/display/Alerts.md": "# Component Guideline: Alerts\n\n> NestUI Alert 仕様。Tailwind CSS。値は `tokens/`（色は `color.semantic.*` / `color.status.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Alerts\n- **Variants**: `primary`（情報・参照） / `red`（エラー・警告） / `gray`（中立・補足）\n- **Responsibility**:\n  - する: ページ内にインライン常駐するシステムメッセージ・状態通知を表示する。操作・ページ遷移まで残る\n  - しない: 一時的なフィードバック（→ Toast）/ フォームフィールドのエラー（入力欄直下に表示）/ レイアウト容器\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 常時表示（Toast と対の存在）/ 色+アイコン併用で種類を伝える（色だけで伝達しない）/ ボタンはオプション。\n\n**Alert と Toast の違い**\n\n|  | Alerts | Toast |\n|--|--------|-------|\n| 表示方式 | インライン（ページ内フロー） | オーバーレイ（`fixed`） |\n| 永続性 | 操作・遷移まで残る | 自動消去（5秒） |\n| 用途 | 状態・参照情報の通知 | 操作結果のフィードバック |\n| 出現 | ページ読み込み時 or 状態変化時 | ユーザー操作の直後 |\n\n---\n\n## 2. Variants & States\n\n**Variants**（カラー）\n\n| Variant | 背景 | アイコン色 | ボタン種別 | role |\n|---------|------|-----------|-----------|------|\n| `primary` | `#f0f7fe`（primary-50） | `#2661cf` | Primary（`bg-[#2661cf] text-white`） | `status`（`aria-live=\"polite\"`） |\n| `red` | `#fef2f4`（danger container） | `#e93766` | Neutral（`bg-[#f7f9fb] text-[#3e5062]`） | `alert`（`aria-live=\"assertive\"`） |\n| `gray` | `#f7f9fb`（neutral container） | `#5a6c7f` | Neutral | `status`（`aria-live=\"polite\"`） |\n\nテキスト色は全カラー共通: `#081a27`（`color.content.primary`）。\n\n**States / ボタン配置**\n\n| 項目 | 値 |\n|------|-----|\n| Horizontal | ボタンをテキスト右横に並べる（`flex items-center` + ボタンに `flex-shrink-0`） |\n| Vertical | ボタンをテキスト下に積む（`flex flex-col items-start`） |\n| ボタンなし | アクション不要時はボタンを省略 |\n\nボーダーは使わない（`border-t-4` / `border-l-4` のカラーバーも全周ボーダーも不可）。variant は背景色 + アイコン色で区別する。\n\n---\n\n## 3. サイズ / Props\n\n| サイズ | パディング | gap | アイコン | 見出し（title） | 本文（description） | ボタン |\n|--------|-----------|-----|---------|----------------|--------------------|--------|\n| Medium | `px-4 py-3` | `gap-3` | `w-6 h-6` | `text-[14px] font-bold leading-6 tracking-[0.03em]` | `text-[14px] leading-[1.75]` | M（`h-9` / `rounded`） |\n| Small | `px-2 py-1.5` | `gap-1` | `w-5 h-5` | `text-[11px] font-bold leading-5 tracking-[0.03em]` | `text-[11px] leading-[1.75]` | S（`h-7` / `rounded-sm`） |\n\n**見出しと本文のタイポ**\n- 見出しと本文は**同じサイズ**にし、差は**ウェイトだけ**でつける（見出し `bold` 700 / 本文 `regular` 400）。Alert は画面に残り、本文に「なぜできないか」が書かれるので、本文を小さくして読みにくくしない（本文を 1 段小さくする Toast とはここが違う）\n- 見出しの行の高さはアイコンと同じにする（Medium 24px / Small 20px）。アイコンと見出し行の中心がそろう\n- `bold` にするのは**見出しと本文の両方があるときの見出しだけ**。本文だけ・見出しだけの 1 要素の Alert は `regular` で書く\n- `semibold`(600) は使わない（FOUNDATIONS のウェイト規定に従う）\n\n**縦方向のそろえ**\n- テキストが 1 行: `items-center`\n- 見出し + 本文の 2 行以上: `items-start`。アイコンは見出し行にそろえ、横並びのボタン・リンクは `self-center` で縦中央に置く\n\n主な Props（参考）: `variant`（primary/red/gray）/ `size`（md/sm）/ `title`/`description` / `action`（ボタン）/ `layout`（horizontal/vertical）/ `icon`（省略時は variant 標準アイコン）。\n\n---\n\n## 4. Composition Rules\n\n許可（テキスト内）: テキスト / `<a>` リンク / `<strong>` 強調 / アクションボタン。\n禁止: フォーム要素 / `<Alert>` の入れ子 / アイコンなしのアラート（色だけで伝達不可）。\n配置: 関連コンテンツの直前（フォーム上部・セクション先頭）。複数並べる場合は `space-y-3`。\n\n**Anti-patterns**\n- NG: 左端に色付きの縦アクセントバー（border-left 等）を付ける → variant は背景色とアイコン色で区別する\n\n---\n\n## 5. Layout & Spacing\n\n- ページコンテンツのフロー内にインラインで配置\n- 同種の Alert を同一ページに重複表示しない（3個以上の積み重ね禁止）\n- 角丸は `rounded`（Medium）/ `rounded-sm`（Small ボタン）。`rounded-lg` 禁止\n\n> variant の識別は 背景色 + アイコン色 で行う。左ボーダー（左端の縦アクセントバー）は使わない。\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| primary 背景 / アイコン | `color.semantic.infoBg`(#F0F7FE) / `color.primary.700`(#2661CF) |\n| red 背景 / アイコン | `color.status.danger.container`(#FEF2F4) / `color.status.danger.base`(#E93766) |\n| gray 背景 / アイコン | `color.surface.base`(#F7F9FB) / `color.content.secondary`(#5A6C7F) |\n| テキスト（共通） | `color.content.primary`(#081A27) |\n| 見出し / 本文のウェイト | `typography.fontWeight.bold`(700) / `typography.fontWeight.regular`(400) |\n| 見出しの字間 | `typography.letterSpacing.title`(0.03em) |\n| primary ボタン | `color.primary.700` 背景 / `color.content.inverse` |\n| red・gray ボタン | `color.surface.base` / `#3e5062`（content 補助） |\n| padding / radius | `spacing.4`/`spacing.3` / `radius.sm`(rounded) |\n\n---\n\n## 7. Accessibility\n- **Role**: `status`（primary/gray・情報）/ `alert`（red・エラー緊急）\n- `aria-live`: red=`assertive` / primary・gray=`polite`（省略禁止）\n- ボタンラベルは操作内容を明示（「参照を解除」「詳細を確認」）\n- 色だけで種類を伝達しない（アイコン必須）。テキスト・アイコンは WCAG AA (4.5:1)\n\n## 8. Content Guidelines\n\n文言は **見出し（`title`）/ 本文（`description`）/ 対応方法（`action`）** の3要素で書く。\n\n- **title**: 結果を端的に。語尾は「〜できません」（禁止・失敗）／「〜を確認してください」（要修正）の2型。15字程度まで。**「エラー」「失敗」は使わない**（想定外系のみ「エラーが発生しました」を定型で使う）。句点は付けない\n- **description**: 「なぜダメか」を1文で書く。具体名（部署名・金額など）は差し込まず固定文言にする。専門用語・内部名称は避ける。句点は 1 文なら付けない／2 文なら切れ目のみ\n- **action**: 次に取れる行動を1つ。遷移先の画面が実在する場合のみボタン・リンクにする。遷移先がない・未確定なら文言のみとし `action` を省略する\n  - **ボタンで出す場合は体言止め**（「使用中の請求・支払を確認」）\n  - **テキストリンクで出す場合は動詞で終える**（「使用中の請求・支払を確認する」）── §1 の例外。「〜はこちら」は使わない\n- フォーム送信後の BE エラーは**フォーム上部に `red` を1つ置いて集約する**。フィールド単位に散らさない\n\n- 見出しと本文の見た目の差（ウェイト・サイズ）は §3 の「見出しと本文のタイポ」に従う\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Primary・Medium・Horizontal（ボタンあり） -->\n<div role=\"status\" aria-live=\"polite\" class=\"flex items-center gap-3 px-4 py-3 bg-[#f0f7fe] rounded\">\n  <svg class=\"w-6 h-6 text-[#2661cf] flex-shrink-0\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n    <circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 16v-4\"/><path d=\"M12 8h.01\"/>\n  </svg>\n  <p class=\"flex-1 text-[14px] leading-[1.75] text-[#081a27]\">物件情報を参照しています。新規登録する場合は「物件名」から参照を解除してください。</p>\n  <button class=\"inline-flex items-center justify-center gap-1 h-9 px-3 text-[14px] font-medium tracking-[0.28px] bg-[#2661cf] text-white rounded flex-shrink-0 hover:bg-primary-600 active:bg-primary-800 cursor-pointer\">参照を解除</button>\n</div>\n\n<!-- Do: Red・Medium（見出し + 本文 + 対応方法） -->\n<div role=\"alert\" aria-live=\"assertive\" class=\"flex items-start gap-3 px-4 py-3 bg-[#fef2f4] rounded\">\n  <svg class=\"w-6 h-6 text-[#e93766] flex-shrink-0\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n    <circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"/><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"/>\n  </svg>\n  <div class=\"flex-1\">\n    <p class=\"text-[14px] font-bold leading-6 tracking-[0.03em] text-[#081a27]\">削除できません</p>\n    <p class=\"text-[14px] leading-[1.75] text-[#081a27]\">この部署は請求・支払で使用されているため、削除できません</p>\n  </div>\n  <a href=\"#\" class=\"text-[14px] font-medium leading-[1.75] tracking-[0.28px] text-primary-700 underline hover:text-primary-600 transition-colors flex-shrink-0 self-center\">使用中の請求・支払を確認する</a>\n</div>\n```\n\n**Don't**: `border-l-4` / `border-t-4` のカラーバー・全周ボーダー（→ ボーダーなし。背景色 + アイコン色で区別）/ `bg-red-50`・`bg-amber-50` 等の汎用カラー（→ トークンの HEX）/ `rounded-lg`（→ `rounded`）/ アイコンなし表示 / `aria-live` 省略 / Warning・Info タイプ（→ Primary / Red / Gray の3カラーのみ）/ Toast の代わりに使う（一時通知は Toast）/ 見出しに「エラー」「失敗」を使う（→ §8）/ 見出しを `semibold` にする・本文を見出しより小さくする（→ §3。差はウェイトだけ）/ 1文の本文の末尾に句点を付ける。\n\n---\n\n## 10. Implementation Notes\n- アイコンは Lucide（stroke ベース・`Info` / `AlertCircle` 等）。種類はコンテキストで選択\n- `role=\"alert\"` のコンテンツ変更は SR が自動読み上げ。ページ遷移後に表示する場合は `aria-live` を確認\n- 一時通知は `Toast.md`、確認ダイアログは Modal を参照\n\n---\n\n## 11. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n| v1.1 | 左ボーダーを廃止。背景色＋アイコン色で区別する方式へ統一 | — |\n| v1.2 | Content Guidelines を見出し・本文・対応方法の 3 要素の型に揃え、Do 例を3要素構成に変更 | — |\n| v1.3 | 見出し行のタイポを確定（本文と同サイズ・bold 700。bold は見出しと本文が両方あるときだけ）。2 行以上は `items-start` にそろえる | — |\n", "base/display/Toast.md": "# Component Guideline: Toast\n\n> NestUI Toast / Notification 仕様。Tailwind CSS。値は `tokens/`（色は `color.semantic.*` / `color.status.*`、z-index は `elevation.z.toast`）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Toast\n- **Variants**: `success`（成功・情報） / `error`（失敗） / `loading`（処理中）\n- **Responsibility**:\n  - する: ユーザー操作の結果を一時的にオーバーレイ（`fixed`）通知する。非侵入的でフローを中断しない\n  - しない: ページ内常駐メッセージ（→ Alerts）/ 確認を要するダイアログ（→ Modal）/ フォームバリデーションの唯一の表示\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 操作結果のフィードバック / 非侵入的（操作を要求しない）/ 自動消去（Success は一定時間で消える。Error / Loading は手動閉じまで残す）/ スタック表示（古い順に積む）。\n\n---\n\n## 2. Variants & States\n\n**Variants**（種類）\n\n| 種類 | アイコン（Lucide） | 背景 | ボーダー（全辺） | テキスト | role / aria-live |\n|------|------|------|----------|----------|------|\n| `success` | `check` | `bg-primary-50`(#f0f7fe) | `border-primary-700`(#2661cf) | `text-primary-700` | `status` / `polite` |\n| `error` | `triangle-alert` | `bg-[#fef2f4]` | `border-[#e93766]` | `text-[#e93766]` | `alert` / `assertive` |\n| `loading` | `loader-circle`（`animate-spin`） | `bg-[#f7f9fb]` | `border-[#a1afc0]` | `text-[#5a6c7f]` | `status` / `polite` |\n\n> Warning・Info タイプは使用しない。情報通知は Success（blue）で代替する。\n\n**バリエーション**: シンプル（タイトルのみ）/ 説明付き（タイトル + 説明テキスト）。\n\n**States / 振る舞い**\n\n| 動作 | ルール |\n|------|--------|\n| 表示アニメーション | 右からスライドイン + フェードイン（`translateX(100%)`→`translateX(0)`） |\n| 自動消去 | Success: 5秒後に自動消去。Error / Loading: 手動閉じのみ |\n| 手動閉じ | × ボタンクリック、または Escape（フォーカス中） |\n| ホバー時 | 自動消去タイマーを一時停止 |\n| スタック | 同時最大5つ。超過時は最古を消去。間隔 `gap-3` |\n| 永続性 | SPA ルート変更後も維持。フルリロードで消去 |\n\n---\n\n## 3. サイズ / Props\n\n| パーツ | 仕様 |\n|--------|------|\n| Container | `flex items-center gap-2 px-4 py-3 border border-solid rounded-sm` + shadow + `w-full max-w-[360px]` |\n| Title | `text-[14px] font-bold leading-[1.5] tracking-[0.28px]` |\n| Description（任意） | `text-[12px] font-normal leading-[1.75] tracking-[0.24px]` |\n| Icon | `w-5 h-5 flex-shrink-0`（`stroke=\"currentColor\"`） |\n| Close btn | `w-5 h-5 flex-shrink-0 inline-flex items-center justify-center rounded-sm cursor-pointer hover:bg-black/5` + `aria-label=\"閉じる\"` |\n\n主な Props（参考）: `variant`（success/error/loading）/ `title`/`description` / `duration`（ms、`null` で自動消滅なし＝error 推奨）/ `action` / `onClose`。\n\n---\n\n## 4. Composition Rules\n\n許可: タイトル・説明テキスト / Status Icon / Close Button / アクションボタン。\n禁止: フォーム要素 / `<Toast>` の入れ子 / 確認が必要なアクションの処理（→ Modal）。\n配置: 表示位置 — 右上 `fixed top-4 right-4`（推奨）/ 上中央 / 下中央（モバイル）。コンテナ: `fixed top-4 right-4 z-50 flex flex-col gap-3 w-full max-w-[360px]`。\n\n**Anti-patterns**\n- NG: 左端だけに色付きの縦アクセントバー（border-left のみ）を付ける → variant は淡色背景＋全辺の semantic ボーダー（枠）＋アイコン色で区別する\n\n---\n\n## 5. Layout & Spacing\n\n- padding `px-4 py-3`、アイコン-テキスト `gap-2`、Toast 間 `gap-3`\n- border-width（全辺）1px（`border border-solid`、variant の semantic 色）\n- max-width 360px、角丸 `rounded-sm`\n- shadow: `shadow-[0px_10px_15px_-5px_rgba(10,10,10,0.1),0px_5px_5px_-2px_rgba(10,10,10,0.05)]`（`elevation.shadow.md`）\n- z-index: `z-50`（`elevation.z.toast`）\n\n> variant の識別は 淡色背景 + 全辺の semantic ボーダー（枠 1px）+ アイコン色 で行う。オーバーレイで浮くため枠で輪郭を補強する。左端のみのアクセントバー（border-left のみ）は使わない。\n\n---\n\n## 6. Token Mapping\n\n| Variant | 背景 | ボーダー（全辺）/ テキスト |\n|---------|------|---------|\n| success | `color.semantic.infoBg`(#F0F7FE) | `color.primary.700`(#2661CF) |\n| error | `color.status.danger.container`(#FEF2F4) | `color.status.danger.base`(#E93766) |\n| loading | `color.surface.base`(#F7F9FB) | `color.content.disabled`(#A1AFC0) / `color.content.secondary`(#5A6C7F) |\n| shadow / z | `elevation.shadow.md` / `elevation.z.toast` |\n| radius / padding | `radius.sm` / `spacing.4`・`spacing.3` |\n\n---\n\n## 7. Accessibility\n- **Role**: success/loading=`role=\"status\"` + `aria-live=\"polite\"`。error=`role=\"alert\"` + `aria-live=\"assertive\"`（省略禁止）\n- 閉じるボタン: `aria-label=\"閉じる\"` 必須\n- フォーカスはトースト表示時に移動しない（非侵入的）。フォーカス中 Escape で閉じる\n- 自動消去は SR 読み上げに十分な時間（最低5秒）を確保。`prefers-reduced-motion` でアニメーション無効化\n- コントラスト 4.5:1 以上\n\n## 8. Content Guidelines\n- description は1〜2文以内。詳細はリンク/アクションへ誘導\n- success: 「保存しました」（過去形）/ error: 見出し「〜できませんでした」+ 説明「〜してください」（原因＋対処法）\n- 1つの文字列にまとめる場合は「〜できませんでした。〜してください」。句点は文の切れ目のみで、末尾には付けない\n- 「失敗」は使わず「〜できませんでした」で書く\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Success（説明付き） -->\n<div role=\"status\" aria-live=\"polite\" class=\"flex items-center gap-2 px-4 py-3 bg-primary-50 border border-primary-700 rounded-sm shadow-[0px_10px_15px_-5px_rgba(10,10,10,0.1),0px_5px_5px_-2px_rgba(10,10,10,0.05)]\">\n  <svg class=\"w-5 h-5 text-primary-700 flex-shrink-0\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n  <div class=\"flex-1 min-w-0 text-primary-700\">\n    <p class=\"text-[14px] font-bold leading-[1.5] tracking-[0.28px]\">保存しました</p>\n    <p class=\"text-[12px] font-normal leading-[1.75] tracking-[0.24px]\">変更内容が正常に保存されました</p>\n  </div>\n  <button type=\"button\" aria-label=\"閉じる\" class=\"w-5 h-5 flex-shrink-0 inline-flex items-center justify-center rounded-sm text-primary-700 hover:bg-primary-100 cursor-pointer transition-colors\">\n    <svg class=\"w-5 h-5\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>\n  </button>\n</div>\n\n<!-- Do: Error（手動閉じ・assertive） -->\n<div role=\"alert\" aria-live=\"assertive\" class=\"flex items-center gap-2 px-4 py-3 bg-[#fef2f4] border border-[#e93766] rounded-sm shadow-[0px_10px_15px_-5px_rgba(10,10,10,0.1),0px_5px_5px_-2px_rgba(10,10,10,0.05)]\">\n  <svg class=\"w-5 h-5 text-[#e93766] flex-shrink-0\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z\"/><path d=\"M12 9v4\"/><path d=\"M12 17h.01\"/></svg>\n  <div class=\"flex-1 min-w-0 text-[#e93766]\">\n    <p class=\"text-[14px] font-bold leading-[1.5] tracking-[0.28px]\">保存できませんでした</p>\n    <p class=\"text-[12px] font-normal leading-[1.75] tracking-[0.24px]\">時間をおいてもう一度お試しください</p>\n  </div>\n  <button type=\"button\" aria-label=\"閉じる\" class=\"w-5 h-5 flex-shrink-0 inline-flex items-center justify-center rounded-sm text-[#e93766] hover:bg-[#fccfd9] cursor-pointer transition-colors\">\n    <svg class=\"w-5 h-5\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18M6 6l12 12\"/></svg>\n  </button>\n</div>\n```\n\n**Don't**: Warning / Info タイプの使用（→ Success / Error / Loading の3タイプ）/ `aria-live` 省略 / 色のみでタイプ識別（アイコン必須）/ 閉じるボタンの `aria-label` 省略 / エラーを自動消去（→ 手動閉じ）/ 自動消去を3秒未満にする / 確認が必要なアクションを Toast で処理（→ Modal）。\n\n---\n\n## 10. Implementation Notes\n- Toast Manager をグローバルに管理（Context API + `useToast()`）。同時表示最大5件・超過分はキュー\n- アイコンは Lucide（`w-5 h-5`、`stroke=\"currentColor\"`）。Loading は `loader-circle` + `animate-spin`\n- ページ内常駐は `Alerts.md`、ローディング単体は `Loader.md` を参照\n\n---\n\n## 11. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n| v1.1 | 左端のみのアクセントバー（border-left のみ）を廃止。全辺ボーダー＝枠方式へ変更（淡色背景＋全辺 semantic ボーダー＋アイコン色） | — |\n| v1.2 | Error の Do 例が Content Guidelines（「〜できませんでした」）に反して「保存に失敗しました」だった問題を修正。Success と同じ 見出し+説明 構造にし、次の一手を明記 | — |\n", "base/display/Tooltip.md": "# Component Guideline: Tooltip\n\n> NestUI Tooltip 仕様。Tailwind CSS。値は `tokens/`（背景は `color.content.secondary`）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Tooltip\n- **Variants**: 方向 `top`（既定） / `bottom` / `left` / `right`（+ タイトル有無）\n- **Responsibility**:\n  - する: ラベルやボタンの補足情報を、ホバーまたはフォーカスで一時表示する\n  - しない: リッチコンテンツ・インタラクティブ要素の表示（→ Popover）/ 確認ダイアログ（→ Modal）/ 長文説明\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 補足情報（ホバー/フォーカスで表示）/ 非侵入的（閲覧のみ・インタラクティブ要素を含めない）/ 4方向対応 / キーボード対応（フォーカスでも表示・Escape で非表示）。\n\n---\n\n## 2. Variants & States\n\n**Variants**（方向）\n\n| 方向 | カレット位置 | 配置クラス |\n|------|------------|----------|\n| Top（既定） | 下辺中央（下向き） | `bottom-full mb-[6px] left-1/2 -translate-x-1/2` |\n| Bottom | 上辺中央（上向き） | `top-full mt-[6px] left-1/2 -translate-x-1/2` |\n| Left | 右辺中央（右向き） | `right-full mr-[6px] top-1/2 -translate-y-1/2` |\n| Right | 左辺中央（左向き） | `left-full ml-[6px] top-1/2 -translate-y-1/2` |\n\n**タイトル**: オプション。使う場合 12px Bold（本文 12px Medium）+ 上下 `gap-[8px]`。テキストのみの場合はタイトル要素を DOM から省略。\n\n**States**: hidden（既定 `opacity-0 pointer-events-none`）/ hover・focus（`opacity-100`）。アニメーション `transition-opacity duration-200`。\n\n---\n\n## 3. サイズ / Props\n\n| プロパティ | 値 |\n|-----------|-----|\n| 背景色 | `bg-[#5a6c7f]`（`color.content.secondary`） |\n| テキスト色 | `text-white` |\n| フォント（本文） | `text-[12px] font-medium tracking-[0.24px] leading-[1.3]` |\n| フォント（タイトル） | `text-[12px] font-bold` |\n| テキスト揃え | `text-center` |\n| 角丸 | `rounded-[8px]` |\n| padding | `p-[8px]` |\n| 最大幅 | `max-w-[256px]`（`w-max` で内容に合わせる） |\n| z-index | `z-20` |\n| トリガーからの間隔 | 6px（カレット含む） |\n\n主な Props（参考）: `label`（必須）/ `placement`（top/bottom/left/right）/ `title`（任意）/ `delay`（既定 400ms）/ `isDisabled`。\n\n---\n\n## 4. Composition Rules\n\n許可（トリガー = children）: `<button>` / アイコンボタン / テキスト / 任意の HTML 要素。\n禁止（tooltip 内）: インタラクティブ要素（ボタン・リンク）/ リッチコンテンツ（リスト・フォーム）→ Popover を使う。\n配置: トリガーを `relative inline-block` で包み、tooltip を絶対配置する。\n\n---\n\n## 5. Layout & Spacing\n\n- shadow: `shadow-[0px_4px_10px_0px_rgba(10,10,10,0.1),0px_2px_5px_0px_rgba(10,10,10,0.05)]`\n- カレットはインライン SVG（コンテナと同色 `#5a6c7f`）。Top/Bottom は 14×6px、Left/Right は 6×14px\n- トリガーから本体まで 6px 空ける（方向別マージン上記）\n\n### カレット SVG（方向別）\n\n| 方向 | path | 配置 |\n|------|------|------|\n| Top（下向き） | `M7 6L0 0H14L7 6Z` | `bottom-[-6px] left-1/2 -translate-x-1/2` |\n| Bottom（上向き） | `M7 0L14 6H0L7 0Z` | `top-[-6px] left-1/2 -translate-x-1/2` |\n| Left（右向き） | `M6 7L0 0V14L6 7Z` | `right-[-6px] top-1/2 -translate-y-1/2` |\n| Right（左向き） | `M0 7L6 0V14L0 7Z` | `left-[-6px] top-1/2 -translate-y-1/2` |\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| 背景・カレット | `color.content.secondary`(#5A6C7F) |\n| テキスト | `color.content.inverse`（white） |\n| 角丸 | `radius.lg`（8px / `rounded-[8px]`） |\n| padding | `spacing.2`（8px） |\n| z-index | `elevation.z.dropdown`（`z-20`） |\n| アニメーション | `motion.duration.normal`（200ms） |\n\n---\n\n## 7. Accessibility\n\n| 属性 | 値 |\n|------|-----|\n| `role` | `\"tooltip\"`（tooltip 要素・`id` 付与） |\n| `aria-describedby` | トリガー要素に tooltip の id を参照（省略禁止） |\n| 表示トリガー | hover + focus（hover のみは不可。フォーカスでも表示必須） |\n| Escape | 全ツールチップを非表示 |\n| アイコンボタン | `aria-label` 必須（テキストがないため） |\n\n- コントラスト 4.5:1 以上\n\n## 8. Content Guidelines\n- 40文字以内の短い説明にする\n- キーボードショートカットの補足に有効（例: `保存 (Ctrl+S)`）\n- 重要な情報はツールチップのみに入れない（ホバーしないと見えない）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: Top・テキストのみ -->\n<div class=\"relative inline-block\">\n  <button aria-describedby=\"tooltip-1\"\n    onmouseenter=\"showTooltip('tooltip-1')\" onmouseleave=\"hideTooltip('tooltip-1')\"\n    onfocus=\"showTooltip('tooltip-1')\" onblur=\"hideTooltip('tooltip-1')\"\n    class=\"inline-flex items-center justify-center h-9 px-3 text-[14px] font-medium bg-primary-700 text-white rounded cursor-pointer\">ボタン</button>\n  <div id=\"tooltip-1\" role=\"tooltip\"\n    class=\"absolute bottom-full mb-[6px] left-1/2 -translate-x-1/2 w-max max-w-[256px] bg-[#5a6c7f] text-white text-[12px] font-medium tracking-[0.24px] leading-[1.3] text-center rounded-[8px] p-[8px] shadow-[0px_4px_10px_0px_rgba(10,10,10,0.1),0px_2px_5px_0px_rgba(10,10,10,0.05)] z-20 opacity-0 pointer-events-none transition-opacity duration-200\">\n    ツールチップの内容\n    <svg class=\"absolute bottom-[-6px] left-1/2 -translate-x-1/2\" width=\"14\" height=\"6\" viewBox=\"0 0 14 6\" fill=\"none\" aria-hidden=\"true\"><path d=\"M7 6L0 0H14L7 6Z\" fill=\"#5a6c7f\"/></svg>\n  </div>\n</div>\n```\n\n```javascript\nfunction showTooltip(id){var el=document.getElementById(id);if(el){el.classList.remove('opacity-0','pointer-events-none');el.classList.add('opacity-100');}}\nfunction hideTooltip(id){var el=document.getElementById(id);if(el){el.classList.remove('opacity-100');el.classList.add('opacity-0','pointer-events-none');}}\ndocument.addEventListener('keydown',function(e){if(e.key==='Escape'){document.querySelectorAll('[role=\"tooltip\"]').forEach(function(t){t.classList.remove('opacity-100');t.classList.add('opacity-0','pointer-events-none');});}});\n```\n\n**Don't**: tooltip 内にインタラクティブ要素を置く（→ Popover）/ hover のみでフォーカス非対応 / `bg-slate-600`（→ `bg-[#5a6c7f]`）/ `rounded-lg`（→ `rounded-[8px]`）/ `max-w-xs`（→ `max-w-[256px]`）/ `aria-describedby` 省略 / 重要な情報をツールチップのみに入れる。\n\n---\n\n## 10. Implementation Notes\n- `<Portal>` で body 直下にレンダリングすると overflow/z-index 問題を回避できる\n- `delay` のデフォルト 400ms はホバーのチラつきを防ぐ\n- リッチコンテンツが必要なら Popover を参照\n", "base/display/Skeleton.md": "# Component Guideline: Skeleton\n\n> NestUI Skeleton / ローディング系プレースホルダー仕様。Tailwind CSS。値は `tokens/` を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Skeleton\n- **Variants**: `card`（カード型） / `list`（リスト型） / `table`（テーブル型）（+ パーツ: Circle / Bar）。関連ローダーとして `inline-spinner`（ボタン内）・`dot-loader`（部分読み込み）を含む\n- **Responsibility**:\n  - する: コンテンツの形状を予告し、読み込み完了後のレイアウトを示すプレースホルダーを表示する\n  - しない: 形状不明のローディング（→ Loader）/ 進捗表示（→ Progress）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: Effortless（形状を予告し認知コストを下げる）/ Whisper（アニメーションは控えめに。pulse 1.5s のみ）/ Inclusive（`prefers-reduced-motion` で停止）/ 差し替え前提（実コンテンツ到着で即置換）。\n\n---\n\n## 2. Variants & States\n\n**Variants**（スケルトン）\n\n| Variant | 用途 | 行数目安 |\n|---------|------|----------|\n| `card` | アバター + テキスト2行 + 本文2行 | 4〜6行 |\n| `list` | アバター + テキスト1行 を繰り返す | 3〜5アイテム |\n| `table` | ヘッダー + 行を繰り返す | 3〜5行 |\n\n**パーツ**\n\n| パーツ | 役割 | class |\n|--------|------|-------|\n| Container | スケルトン全体 | `space-y-4` + `aria-busy=\"true\"` `role=\"status\"` |\n| Circle | アバター等の円形 | `rounded-full bg-slate-200 skeleton-pulse` |\n| Bar | テキスト行 | `rounded-md bg-slate-200 skeleton-pulse` + 高さ（h-3〜h-4） |\n| SR-only text | 読み込み状態テキスト | `<span class=\"sr-only\">読み込み中</span>` |\n\n**関連ローダー**\n\n| 種類 | 用途 | class |\n|------|------|-------|\n| inline-spinner | ボタン内の処理中（`disabled` + `opacity-60` + `cursor-not-allowed`） | `.inline-spinner`（CSS: clip-path arc） |\n| dot-loader | ページの一部領域だけの読み込み（全画面占有禁止） | `.dot-loader` > `<span>` × 3 |\n\n**States**: loading（pulse アニメーション）/ 表示・非表示は親で制御。\n\n---\n\n## 3. サイズ / Props\n\n| 要素 | 高さ目安 |\n|------|----------|\n| Bar（見出し） | `h-4`（約16px） |\n| Bar（本文） | `h-3`（約12px） |\n| Circle（アバター） | `w-10 h-10`（40px、`rounded-full`） |\n\n主な Props（参考）: `variant`（card/list/table）/ `width` / `height` / `lines`（行数）/ `isAnimated`（`prefers-reduced-motion` 時は false）。text 最終行は幅 60〜80% にして自然な見た目を再現。\n\n---\n\n## 4. Composition Rules\n\n許可: Circle / Bar の組み合わせ。\n禁止: 実コンテンツと大きく異なる形状（レイアウトシフトの原因）/ ローディング完了後の常時表示。\n配置: コンテナを `aria-busy=\"true\" role=\"status\"` で包む。\n\n---\n\n## 5. Layout & Spacing\n\n- text 行間 `space-y-2`（`spacing.2`）\n- 角丸: text/Bar = `rounded-md`（`radius.sm`）/ Circle = `rounded-full`\n- カードラッパー: `bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4`\n\n### CSS（SSOT: `guidelines/INTERACTION_STATES`「Loading」相当）\n\n```css\n@keyframes skeletonPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }\n.skeleton-pulse { animation: skeletonPulse 1.5s ease-in-out infinite; }\n\n.inline-spinner {\n  width: 1em; aspect-ratio: 1; border-radius: 50%;\n  border: 2.5px solid currentColor;\n  animation: spinnerClip 0.8s infinite linear alternate, spinnerRotate 1.6s infinite linear;\n}\n\n.dot-loader { display: flex; align-items: center; gap: 5px; height: 34px; }\n.dot-loader span {\n  width: 9px; height: 17px; background: var(--color-primary-500, #2b70ef);\n  border-radius: 3px; animation: dotWave 1.2s infinite ease-in-out;\n}\n.dot-loader span:nth-child(2) { animation-delay: 0.2s; }\n.dot-loader span:nth-child(3) { animation-delay: 0.4s; }\n\n@media (prefers-reduced-motion: reduce) {\n  .skeleton-pulse { animation: none; opacity: 0.6; }\n  .inline-spinner { animation: none; border-style: dotted; }\n  .dot-loader span { animation: none; }\n}\n```\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| プレースホルダー色 | `color.surface.raised` 近傍（slate-200。NestUI は `bg-slate-200` 固定） |\n| dot-loader バー色 | `color.primary.500`（`--color-primary-500`） |\n| 角丸 text/Bar | `radius.sm`（`rounded-md`） |\n| 角丸 Circle | `radius.full` |\n| 行間 / padding | `spacing.2` / `spacing.6` |\n\n> NestUI ではスケルトン色は `bg-slate-200` 固定。他色の使用は禁止。\n\n---\n\n## 7. Accessibility\n\n| 属性 | 値 | 対象 |\n|------|-----|------|\n| `aria-busy` | `\"true\"` | スケルトンのコンテナ |\n| `role` | `\"status\"` | スケルトン / dot-loader のコンテナ |\n| SR-only text | `<span class=\"sr-only\">読み込み中</span>` | コンテナ内 |\n| `disabled` | — | スピナー表示中のボタン |\n| `aria-busy` 解除 | `\"false\"` | 実コンテンツ到着時に必ず解除 |\n\n## 8. Content Guidelines\n- 形状は実際のコンテンツに近づける（ユーザーの期待を作る）\n- text の最終行は幅 60〜80% に\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: カードスケルトン -->\n<div aria-busy=\"true\" role=\"status\" class=\"bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4\">\n  <span class=\"sr-only\">読み込み中</span>\n  <div class=\"flex items-center gap-3\">\n    <div class=\"w-10 h-10 rounded-full bg-slate-200 skeleton-pulse\"></div>\n    <div class=\"flex-1 space-y-2\">\n      <div class=\"h-4 bg-slate-200 rounded-md w-3/4 skeleton-pulse\"></div>\n      <div class=\"h-3 bg-slate-200 rounded-md w-1/2 skeleton-pulse\"></div>\n    </div>\n  </div>\n  <div class=\"space-y-2\">\n    <div class=\"h-3 bg-slate-200 rounded-md w-full skeleton-pulse\"></div>\n    <div class=\"h-3 bg-slate-200 rounded-md w-5/6 skeleton-pulse\"></div>\n  </div>\n</div>\n\n<!-- Do: インラインスピナー（ボタン内） -->\n<button disabled class=\"inline-flex items-center gap-1 h-9 px-3 text-[14px] font-medium tracking-[0.28px] text-white bg-primary-700 rounded opacity-60 cursor-not-allowed\">\n  <div class=\"inline-spinner\"></div>送信中...\n</button>\n```\n\n**Don't**: `bg-slate-200` 以外の色を使う / 常時回転スピナーのみの全画面表示（→ スケルトン or プログレスバーを併用）/ `aria-busy=\"true\"` 省略 / 実コンテンツ到着後に `aria-busy` を解除しない / コンテンツと全く異なる形状。\n\n---\n\n## 10. Implementation Notes\n- スタンドアロンの回転インジケーターは `Loader.md`（`ds-spinner`）を参照。ボタン loading は `inline-spinner`\n- 進捗が計測可能なら `Progress.md` を使用\n- `prefers-reduced-motion` で全アニメーションを停止（上記 CSS 参照）\n", "base/display/Loader.md": "# Component Guideline: Loader\n\n> NestUI Loader（= Spinner）仕様。Tailwind CSS / 専用 CSS クラス。値は `tokens/`（アーク色は `color.brand.500`）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Loader（Spinner）\n- **Variants**: スタンドアロン `ds-spinner`（S / M / L / XL の4サイズ） / インライン `inline-spinner`（ボタン内）\n- **Responsibility**:\n  - する: 形状が不明な非同期処理中・読み込み中を回転インジケーターで示す\n  - しない: コンテンツ形状が明確な場合（→ Skeleton）/ 進捗が計測可能な処理（→ Progress）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: Brand（アーク色は Brand Blue `#0098B9` = `brand-500` で統一）/ Minimal（「何かが起きている」ことだけを伝える。テキストは原則不要）/ Accessible（`role=\"status\"` + `aria-label=\"読み込み中\"` 必須）/ Context-adaptive（ボタン内は `inline-spinner` で `currentColor` に追従）。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| 種別 | 用途 | 実装 |\n|------|------|------|\n| スタンドアロン `ds-spinner` | カード・パネル・モーダル中央、テーブルリフレッシュ等の単体ローディング | `div.ds-spinner.ds-spinner-{s\\|m\\|l\\|xl}` + `role=\"status\"` |\n| インライン `inline-spinner` | ボタンの loading 状態専用。Contained / Outlined / Neutral 問わず自動適応 | `<div class=\"inline-spinner\">` + 親 `<button disabled>` |\n\n**パーツ**: Track（リング背景 `#dde3eb`）/ Arc（回転する弧 `#0098B9` = brand-500）/ Container（サイズ指定 + `role=\"status\"`）。\n\n**States**: loading（回転アニメーション 0.75s linear infinite）。`prefers-reduced-motion` で自動停止。\n\n---\n\n## 3. サイズ / Props\n\n| サイズ名 | 直径 | border-width | class |\n|---------|------|-------------|-------|\n| S（Small） | 14px | 1.5px | `ds-spinner ds-spinner-s` |\n| M（Medium） | 18px | 2px | `ds-spinner ds-spinner-m` |\n| L（Large） | 24px | 2.5px | `ds-spinner ds-spinner-l` |\n| XL（XLarge） | 32px | 3px | `ds-spinner ds-spinner-xl` |\n\nインライン: `width: 1em`（親のフォントサイズに追従）。主な Props（参考）: `variant`（spinner/fullPage）/ `size`（s/m/l/xl）/ `label`（aria-label、既定「読み込み中」）/ `color`（既定 currentColor）。\n\n---\n\n## 4. Composition Rules\n\n許可: なし（単体表示。ラベルが必要な場合は別要素で併置）。\n禁止: `ds-spinner` をボタン内で使う（サイズ固定になるため → `inline-spinner`）/ 全画面占有をスピナーのみで行う（→ Skeleton or Progress を併用）/ Spinner のみを常時表示し続ける（タイムアウト処理必須）。\n\n---\n\n## 5. Layout & Spacing\n\n- スタンドアロンは中央配置（カード・モーダルは中央、テーブルはヘッダー右）\n- fullPage オーバーレイ: 背景 `color.surface.base` 80% opacity、スピナーは L（または XL）、z-index は `elevation.z.modal`\n- インラインは `gap-2` でラベルと並べる\n\n### CSS\n\n```css\n@keyframes loader-spin { to { transform: rotate(360deg); } }\n\n/* スタンドアロン */\n.ds-spinner {\n  display: inline-block; flex-shrink: 0; border-radius: 50%;\n  border-style: solid; border-color: #dde3eb; border-top-color: #0098B9;\n  animation: loader-spin 0.75s linear infinite;\n}\n.ds-spinner-s  { width: 14px; height: 14px; border-width: 1.5px; }\n.ds-spinner-m  { width: 18px; height: 18px; border-width: 2px; }\n.ds-spinner-l  { width: 24px; height: 24px; border-width: 2.5px; }\n.ds-spinner-xl { width: 32px; height: 32px; border-width: 3px; }\n\n/* インライン（ボタン内） */\n.inline-spinner {\n  width: 1em; aspect-ratio: 1; border-radius: 50%; flex-shrink: 0;\n  border: 2px solid transparent; border-top-color: currentColor;\n  animation: loader-spin 0.75s linear infinite;\n}\n```\n\n`prefers-reduced-motion: reduce` でアニメーションは自動停止する。\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| Arc（弧の色） | `color.brand.500`(#0098B9) |\n| Track（リング背景） | `color.border.subtle`(#DDE3EB) |\n| インライン色 | `currentColor`（親要素のテキスト色に追従） |\n| fullPage 背景 | `color.surface.base` 80% opacity |\n| z-index（fullPage） | `elevation.z.modal` |\n\n---\n\n## 7. Accessibility\n\n| 属性 | 値 | 必須 |\n|------|-----|------|\n| `role` | `\"status\"` | 必須 |\n| `aria-label` | `\"読み込み中\"`（処理内容があれば「保存中...」等） | 必須 |\n| `aria-live` | `\"polite\"` | 推奨 |\n| ボタン内スピナー | 親 `<button>` に `disabled` | 必須 |\n| SR-only 補足 | ページ全体 loading 時は `<span class=\"sr-only\">読み込み中</span>` | 推奨 |\n\n- 非テキストコントラスト: スピナー色 vs 背景 3:1 以上\n\n## 8. Content Guidelines\n- `label` は処理内容を示す（「データを読み込み中...」「保存中...」）\n- fullPage 時はスピナー下部にテキストを視覚的にも表示する\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: スタンドアロン（L・中央配置） -->\n<div class=\"ds-spinner ds-spinner-l\" role=\"status\" aria-label=\"読み込み中\"></div>\n\n<!-- Do: ボタン内（Inline） -->\n<button disabled class=\"inline-flex items-center gap-2 h-9 px-3 text-[14px] font-medium text-white bg-primary-700 rounded opacity-60 cursor-not-allowed\">\n  <div class=\"inline-spinner\"></div>送信中...\n</button>\n```\n\n**使い分け**: ボタン操作後＝`inline-spinner` / カード・パネル＝`ds-spinner-l` / ページ初期ロード＝Skeleton 優先 / テーブルリフレッシュ＝`ds-spinner-m` / モーダル内＝`ds-spinner-l`。\n\n**Don't**: `role=\"status\"` 省略 / `aria-label` 省略 / `ds-spinner` をボタン内で使用 / 全画面をスピナーのみで占有 / Spinner を常時表示し続ける（タイムアウト必須）/ コンテンツ形状が明確な場合に使用（→ Skeleton）。\n\n---\n\n## 10. Implementation Notes\n- CSS アニメーション（`@keyframes loader-spin`）で実装。JS より軽量\n- コンテンツ形状が明確なら `Skeleton.md`、進捗が計測可能なら `Progress.md` を参照\n", "base/display/Progress.md": "# Component Guideline: Progress\n\n> NestUI Progress（リニアプログレスバー）仕様。Tailwind CSS。値は `tokens/`（色は `color.primary.*` / `color.status.*`）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Progress\n- **Variants**: `primary`（既定） / `success` / `warning` / `error`（+ 確定 / 不確定の表示形態）\n- **Responsibility**:\n  - する: 操作・プロセスの進行状況を 0〜100% のバーで視覚化する\n  - しない: ローディング状態（→ Loader）/ ステップ進行（→ Steps）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 進捗の可視化 / 4色で意味を伝える / 不確定対応（完了時間が不明な場合はアニメーションループ）/ ラベル付き（進捗率テキストで正確な情報を補助）。\n\n---\n\n## 2. Variants & States\n\n**Variants**（カラー）\n\n| 種類 | フィル色 | 用途 |\n|------|----------|------|\n| `primary` | `bg-primary-500` | デフォルト。一般的な進捗 |\n| `success` | `bg-emerald-600` | 完了・成功系（`color.status.success.fill`） |\n| `warning` | `bg-amber-600` | 注意が必要（`color.status.warning.base`） |\n| `error` | `bg-red-500` | エラー・危険レベル（`color.status.danger.base`） |\n\n**表示形態 / States**\n\n| 形態 | 説明 |\n|------|------|\n| 確定（default） | `style=\"width: N%\"` で進捗値を指定 |\n| 不確定（indeterminate） | CSS アニメーションでループ表示。`aria-valuenow` を省略 |\n\nパーツ: Track（背景トラック・全体の範囲）/ Fill（進捗フィル）/ Label（上部テキスト・任意）/ Percentage（進捗率数値・任意）。\n\n---\n\n## 3. サイズ / Props\n\n| プロパティ | 値 |\n|-----------|-----|\n| 高さ | `h-2`（8px） |\n| 角丸 | `rounded-full` |\n| アニメーション | `transition-all`（値変更時のスムーズ遷移） |\n| Label | `text-sm font-medium text-slate-700` |\n\n主な Props（参考）: `value`（0〜100、省略で indeterminate）/ `variant`（primary/success/warning/error）/ `showLabel`（boolean）/ `label`（説明テキスト）。\n\n---\n\n## 4. Composition Rules\n\n許可: Label / Percentage の併置（props のみで制御）。\n禁止: 計測不能な処理に確定 `value` を設定する（→ indeterminate を使う）/ プログレスバーのみで残り時間を伝える（テキスト併用）。\n配置: ラベルは `flex justify-between items-center mb-1` で左にラベル・右に進捗率。\n\n---\n\n## 5. Layout & Spacing\n\n- Track: `bg-slate-200 rounded-full h-2`、Fill: `rounded-full h-2 transition-all`\n- ラベル-バー gap: `mb-1`（`spacing.1` 相当）\n- 不確定時は Track に `overflow-hidden` を付与\n\n### 不確定アニメーション CSS\n\n```css\n@keyframes indeterminate {\n  0% { transform: translateX(-100%); }\n  100% { transform: translateX(400%); }\n}\n.progress-indeterminate { animation: indeterminate 1.5s ease-in-out infinite; width: 25%; }\n```\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| Track（背景） | `color.surface.sunken` 近傍（slate-200） |\n| Fill（primary） | `color.primary.500` |\n| Fill（success） | `color.status.success.fill`(#5EB62C) |\n| Fill（warning） | `color.status.warning.base`(#EE8C29) |\n| Fill（error） | `color.status.danger.base`(#E93766) |\n| ラベルテキスト | `color.content.secondary` 近傍（slate-700） |\n| 角丸 | `radius.full` |\n\n---\n\n## 7. Accessibility\n\n| 属性 | 値 |\n|------|-----|\n| `role` | `\"progressbar\"` |\n| `aria-valuenow` | 現在値（0〜100）。不確定時は省略 |\n| `aria-valuemin` / `aria-valuemax` | `\"0\"` / `\"100\"` |\n| `aria-label` | 進捗の説明テキスト |\n\n- 色だけで状態を伝えない。バー色 vs トラック色 3:1 以上。`prefers-reduced-motion` で indeterminate アニメーション停止\n\n## 8. Content Guidelines\n- `label` はプロセスの名前（「ファイルをアップロード中」「ビルド中」）\n- `showLabel` が true の場合は `value%` を表示\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: ラベル付き確定 -->\n<div>\n  <div class=\"flex justify-between items-center mb-1\">\n    <span class=\"text-sm font-medium text-slate-700\">アップロード中</span>\n    <span class=\"text-sm font-medium text-slate-700\">65%</span>\n  </div>\n  <div class=\"bg-slate-200 rounded-full h-2\" role=\"progressbar\" aria-valuenow=\"65\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-label=\"アップロード進捗\">\n    <div class=\"bg-primary-500 rounded-full h-2 transition-all\" style=\"width: 65%\"></div>\n  </div>\n</div>\n\n<!-- Do: 不確定 -->\n<div class=\"bg-slate-200 rounded-full h-2 overflow-hidden\" role=\"progressbar\" aria-label=\"読み込み中\">\n  <div class=\"bg-primary-500 rounded-full h-2 progress-indeterminate\"></div>\n</div>\n```\n\n**Don't**: `aria-valuenow` / `aria-valuemin` / `aria-valuemax` 省略 / `aria-label` 省略 / `prefers-reduced-motion` 未対応（indeterminate）/ プログレスバーのみで残り時間を伝える / 計測不能な処理に作り物の `value` を設定（→ indeterminate）。\n\n---\n\n## 10. Implementation Notes\n- indeterminate は CSS `@keyframes` で実装（JS より軽量）\n- ローディング状態は `Loader.md`、形状が分かるなら `Skeleton.md` を参照\n", "base/display/Steps.md": "# Component Guideline: Steps\n\n> NestUI Steps（Stepper）仕様。Tailwind CSS。値は `tokens/`（操作色は `color.primary.700` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Steps（Stepper）\n- **Variants**: `horizontal`（水平）/ `vertical`（垂直）\n- **Responsibility**:\n  - する: マルチステップのウィザード・フローの全体ステップ数と現在位置・進捗を示す\n  - しない: 単純な進捗バー（→ `Progress`）、タブ切り替え（→ `Tabs`）、ステップ間のナビゲーション（移動はフォーム内ボタンで制御）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: プロセス可視化（全体ステップ数と現在位置を常に把握できる）/ 3状態を色＋ボーダーで明確に区分（色だけに頼らない）/ クリック不可が基本（進捗表示であってナビゲーションではない）/ 全状態でステップ番号を表示（チェックアイコンは使用しない）。\n\n---\n\n## 2. Variants & States\n\n**Variants（方向）**\n\n| Variant | 用途 | レイアウト |\n|---------|------|------|\n| `horizontal`（既定） | ウィザード・チェックアウト。4ステップ以下に適する | ステップを横に並べる |\n| `vertical` | サイドバー内・長い説明付き。5ステップ以上 | ステップを縦に並べる |\n\n**States（各ステップ）**\n\n| State | 説明 | Indicator（Medium） | ラベル色 |\n|-------|------|----------------------|----------|\n| `completed` | 完了済み | `border-2 border-[#dde3eb]` + 番号（`text-[#081a27]`） | `text-[#3e5062]` |\n| `current` | 現在のステップ | `bg-primary-700` + 番号（`text-white`）+ `aria-current=\"step\"` | `text-[#081a27]` |\n| `upcoming` | 未着手 | `bg-[#edf0f3]` + 番号（`text-[#a1afc0]`） | `text-[#a1afc0]` |\n| `disabled` | 非活性（スキップ不可） | `bg-[#edf0f3]` + 番号（`text-[#a1afc0]`） | `text-[#a1afc0]` |\n\n> 全状態でステップ番号を表示する。`completed` をチェックアイコンで代替しない。\n\n---\n\n## 3. サイズ / パーツ\n\n**サイズ**\n\n| サイズ | Indicator | 番号 | 用途 |\n|--------|-----------|------|------|\n| Medium（既定） | `w-6 h-6`（24px） | あり | 通常のウィザード |\n| Small | `w-4 h-4`（16px） | なし | 狭いスペース（ラベルなしでも可） |\n\n**Indicator 共通 class**: `rounded-full inline-flex items-center justify-center flex-shrink-0`（Medium は `+ text-[13px] font-bold`）\n\n**パーツ**\n\n| パーツ | 役割 | 必須 |\n|--------|------|------|\n| Container | Steps 全体のラッパー（`role=\"list\"`） | Yes |\n| Step | 個々のステップ = Indicator + Label（`role=\"listitem\"`） | Yes |\n| Indicator | 状態を示す円形インジケーター（番号） | Yes |\n| Label | ステップ名称（`text-[14px] font-medium tracking-[0.28px]`） | Yes |\n| Description | 補足説明（vertical のみ・`text-xs text-[#a1afc0] mt-0.5`） | No |\n| Connector | ステップ間の接続線。端は `opacity-0` で非表示 | Yes（最初・最後以外） |\n\n---\n\n## 4. Composition Rules\n\n許可: props（ステップ定義）のみ。Indicator + Label（+ vertical の Description）。\n禁止: ウィザードのコンテンツを Steps 内に格納すること（Steps はナビゲーション表示のみ。コンテンツはページ/別コンポーネントで管理）/ チェックアイコンでの番号代替 / `w-4 h-4`（Small）未満の Indicator / Connector への `mx-*` 余白付与（端は `opacity-0` で対応）。\n配置: ステップ数が 8 個を超える場合は複数ページ・サブステップに分割する。Connector は各ステップ内に左右2本持ち、全区間 `bg-[#dde3eb]` で統一する。\n\n---\n\n## 5. Layout & Spacing\n\n- Indicator サイズ: Medium `w-6 h-6`(24px) / Small `w-4 h-4`(16px)\n- Indicator-Label gap（horizontal）: `gap-2`(8px)\n- Indicator-Description 間（vertical）: `gap-4`(16px)、Description は `mt-0.5`\n- Connector 太さ: `h-[2px]`（horizontal）/ `w-[2px]`（vertical）。`flex-1` で区間を埋める\n- ラベル font-size: `text-[14px]`（`typography.fontSize.sm` 近傍）、font-weight `font-medium`、`tracking-[0.28px]`\n- 外側 `margin` は持たない。ステップ間の距離は `flex-1` の Connector / 親レイアウトの `gap` で確保する\n\n**Connector（horizontal）**: `flex-1 h-[2px] bg-[#dde3eb]`（全区間同色）。最初のステップの Left と最後のステップの Right に `opacity-0`。\n**Connector（vertical）**: `w-[2px] flex-1 mt-2 bg-[#dde3eb]`。最後のステップにはコネクター不要。\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| current Indicator 背景 | `color.primary.700`（#2661cf・`bg-primary-700`） |\n| current Indicator 文字 | `color.content.inverse`（white・`text-white`） |\n| current ラベル | `color.content.primary`（#081a27・`text-[#081a27]`） |\n| completed Indicator ボーダー | `color.border.default`（#dde3eb・`border-[#dde3eb]`） |\n| completed Indicator 文字 | `color.content.primary`（#081a27） |\n| completed ラベル | `color.content.secondary`（#3e5062・`text-[#3e5062]`） |\n| upcoming / disabled Indicator 背景 | `color.surface.sunken`（#edf0f3・`bg-[#edf0f3]`） |\n| upcoming / disabled 文字・ラベル | `color.content.disabled`（#a1afc0・`text-[#a1afc0]`） |\n| Connector（全区間） | `color.border.default`（#dde3eb・`bg-[#dde3eb]`） |\n| Description（vertical） | `color.content.disabled`（#a1afc0） |\n\n> Connector はステップ状態にかかわらず全区間 `#dde3eb` 固定。\n\n---\n\n## 7. Accessibility\n\n| 項目 | 要件 |\n|------|------|\n| Container | `role=\"list\"` を付与（`<ol>` で実装可） |\n| Step | `role=\"listitem\"` を付与 |\n| current ステップ | `aria-current=\"step\"` を付与（必須） |\n| completed Indicator | 番号に `<span class=\"sr-only\">（完了）</span>` を追加 |\n| Small（番号なし） | Indicator に `aria-label=\"ステップN（完了/進行中/未着手）\"` を付与 |\n\n- コントラスト: テキスト 4.5:1 以上。色だけでステップ状態を区別しない（ボーダー・番号を併用）\n- クリック可（完了済みステップに戻れる仕様）にする場合のみ、対象 Step に `role=\"button\"` / `tabIndex={0}` を付与し Tab → Enter/Space で移動\n\n## 8. Content Guidelines\n- ラベルは短く（3単語以内）、完了形の名詞で（「基本情報」「確認」「完了」）\n- Description は任意で補足説明を1行（vertical のみ）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 水平（3ステップ、Step 2 が current）-->\n<div role=\"list\" class=\"flex items-start\">\n  <!-- Step 1: completed -->\n  <div role=\"listitem\" class=\"flex flex-col items-center gap-2 flex-1\">\n    <div class=\"flex items-center w-full\">\n      <div class=\"flex-1 h-[2px] bg-[#dde3eb] opacity-0\"></div>\n      <div class=\"w-6 h-6 rounded-full border-2 border-[#dde3eb] inline-flex items-center justify-center flex-shrink-0 text-[13px] font-bold text-[#081a27]\">\n        <span class=\"sr-only\">（完了）</span>1\n      </div>\n      <div class=\"flex-1 h-[2px] bg-[#dde3eb]\"></div>\n    </div>\n    <span class=\"text-[14px] font-medium tracking-[0.28px] text-[#3e5062] text-center w-full leading-normal\">アカウント</span>\n  </div>\n  <!-- Step 2: current -->\n  <div role=\"listitem\" class=\"flex flex-col items-center gap-2 flex-1\" aria-current=\"step\">\n    <div class=\"flex items-center w-full\">\n      <div class=\"flex-1 h-[2px] bg-[#dde3eb]\"></div>\n      <div class=\"w-6 h-6 rounded-full bg-primary-700 inline-flex items-center justify-center flex-shrink-0 text-[13px] font-bold text-white\">2</div>\n      <div class=\"flex-1 h-[2px] bg-[#dde3eb]\"></div>\n    </div>\n    <span class=\"text-[14px] font-medium tracking-[0.28px] text-[#081a27] text-center w-full leading-normal\">プロフィール</span>\n  </div>\n  <!-- Step 3: upcoming -->\n  <div role=\"listitem\" class=\"flex flex-col items-center gap-2 flex-1\">\n    <div class=\"flex items-center w-full\">\n      <div class=\"flex-1 h-[2px] bg-[#dde3eb]\"></div>\n      <div class=\"w-6 h-6 rounded-full bg-[#edf0f3] inline-flex items-center justify-center flex-shrink-0 text-[13px] font-bold text-[#a1afc0]\">3</div>\n      <div class=\"flex-1 h-[2px] bg-[#dde3eb] opacity-0\"></div>\n    </div>\n    <span class=\"text-[14px] font-medium tracking-[0.28px] text-[#a1afc0] text-center w-full leading-normal\">確認</span>\n  </div>\n</div>\n\n<!-- Do: 垂直（ラベル + 説明付き、Step 2 current の一部）-->\n<div role=\"list\">\n  <div role=\"listitem\" class=\"flex gap-4\" aria-current=\"step\">\n    <div class=\"flex flex-col items-center\">\n      <div class=\"w-6 h-6 rounded-full bg-primary-700 inline-flex items-center justify-center flex-shrink-0 text-[13px] font-bold text-white\">2</div>\n      <div class=\"w-[2px] flex-1 mt-2 bg-[#dde3eb]\"></div>\n    </div>\n    <div class=\"pb-6\">\n      <p class=\"text-[14px] font-medium tracking-[0.28px] text-[#081a27]\">プロフィール設定</p>\n      <p class=\"text-xs text-[#a1afc0] mt-0.5\">名前とアバターを設定してください</p>\n    </div>\n  </div>\n</div>\n\n<!-- Do: Small（水平・ラベルなし、aria-label 必須）-->\n<div role=\"list\" class=\"flex items-center\">\n  <div role=\"listitem\" class=\"flex items-center flex-1\" aria-current=\"step\">\n    <div class=\"flex-1 h-[2px] bg-[#dde3eb]\"></div>\n    <div class=\"w-4 h-4 rounded-full bg-primary-700 flex-shrink-0\" aria-label=\"ステップ2（進行中）\"></div>\n    <div class=\"flex-1 h-[2px] bg-[#dde3eb]\"></div>\n  </div>\n</div>\n```\n\n**Don't**: チェックアイコンで完了ステップの番号を代替（→ 全状態で番号表示）/ 色だけでステップ状態を区別 / `aria-current=\"step\"` を current ステップに付与しない / `w-4 h-4`（Small）未満の Indicator / Connector の色をステップ状態で変える（→ 全区間 `bg-[#dde3eb]` 固定）/ Connector に `mx-*` 余白を設ける（→ 端は `opacity-0`）/ コンテンツを Steps 内に格納（→ Steps はナビ表示のみ）/ ステップ数 9 個以上（→ 分割）。\n\n---\n\n## 10. Implementation Notes\n- `current` 変更時は対応するフォームコンテンツをページ/コンポーネントで切り替える（Steps は進捗表示のみ）\n- ステップ間の移動はフォーム内の `navigation/Buttons.md` のボタンで制御する\n- `error` 等のバリデーション失敗表示が要る場合も色だけに頼らず番号・テキストを併用する\n- テストチェックリスト: completed / current / upcoming / disabled の各状態 / `aria-current=\"step\"` が current に付くこと / Connector の端 `opacity-0` / クリック可時のキーボード操作\n- 思想は `FOUNDATIONS.md`、トークン参照は `guidelines/TOKEN_GUIDE.md`、使い分けは `COMPONENT_GUIDE.md`\n", "base/display/Activity.md": "# Component Guideline: Activity\n\n> NestUI Activity（アクティビティパネル）仕様。Tailwind CSS。値は `tokens/` を正とし、以下の class はその適用例。オブジェクト詳細ドロワーに配置し、コメント投稿・ピン留め・システムログを一元表示する。\n\n## 1. Component Identity\n- **Name**: Activity\n- **Variants**: 構成パーツ — `ActivityTabs` / `CommentItem`（通常・ピン留め） / `LogItem` / `MentionTag` / `CommentInput`（Memo / Message）\n- **Responsibility**:\n  - する: 案件・物件・契約等のオブジェクトに紐づくコメント・変更履歴をチームで共有し、@メンションで通知する\n  - しない: 受信トレイ型のメッセージ送受信単体（→ inbox パターン）/ 汎用チャット / 通知センター\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**使い分け**: コメント（Memo）= チームへの申し送り・状況メモ・質問（@メンションで通知可）/ ログ（Log）= 担当変更・ステップ変更などシステムが自動生成する変更履歴（ユーザーは投稿不可・ピン留め不可）/ ピン留め = 重要なコメントを上位表示。\n\n---\n\n## 2. Variants & States\n\n**ActivityTabs**（タブフィルター）\n\n| タブ | 表示内容 |\n|------|----------|\n| すべて | CommentItem + LogItem を時系列表示 |\n| コメント | CommentItem のみ |\n| ピン留め | PinBanner 付き CommentItem のみ |\n| ログ | LogItem のみ |\n\n**CommentItem のバリアント**\n\n| バリアント | 背景色 | PinBanner |\n|------------|--------|-----------|\n| 通常 | `bg-white` | なし |\n| ピン留め | `bg-[#f0f7fe]` | `ピン留めしたコメント`（primary-700） |\n\n**CommentInput のバリアント / States**\n\n| type | placeholder | 用途 |\n|------|-------------|------|\n| Memo | コメントを追加する... | アクティビティパネル内 |\n| Message | メッセージを入力 | 受信トレイ型 2カラム詳細 |\n\n| state | Area ボーダー | 投稿ボタン |\n|-------|---------------|-----------|\n| Enable / Hover（未フォーカス） | `#c4cdd9` | Disabled（`#edf0f3` bg / `#a1afc0` text） |\n| Selected / Focus | `#2661cf`（`focus-within:border-[#2661cf]`） | Disabled |\n| Fill / Typing（入力済み） | `#c4cdd9` / `#2661cf` | Active（`bg-primary-700 text-white`） |\n| Template（テンプレート選択済み） | `#c4cdd9` + TemplateBlock 表示 | Active |\n\nアクションボタン（Pin/編集/削除）は CommentItem ホバー時のみ表示（`group-hover`）。LogItem にはアクションボタンなし。\n\n---\n\n## 3. サイズ / Props（主要パーツ）\n\n| パーツ | 主な class |\n|--------|-----------|\n| ActivityTabs | `flex border-b border-[#dde3eb]` + 各タブ `h-[40px] px-4`（選択: `border-b-2 border-primary-700 text-primary-700` / 未選択: `text-body`） |\n| CommentItem | `relative group bg-white border-b border-[#dde3eb] px-4 py-3`（ピン留めは `bg-[#f0f7fe]`） |\n| アバター | `w-6 h-6 rounded-full` + `role=\"img\"` `aria-label` |\n| 名前 | `text-[14px] font-bold text-[#081a27] leading-[1.5]` / 日時 `text-[12px] font-medium text-[#6f757d]` |\n| 本文 | `pl-[32px]`（アバター分インデント）`text-[14px] text-[#081a27] leading-[1.75]` |\n| アクションボタン | `w-7 h-7 inline-flex items-center justify-center bg-[#f7f9fb] rounded-[2px]`（削除は `hover:bg-[#fef2f4] text-[#e93766]`） |\n| LogItem | `bg-white border-b border-[#dde3eb] pl-[52px] pr-4 py-3`（アバターなし・本文 `text-[#5a6c7f]`） |\n| MentionTag | `inline-flex items-center gap-[2px] bg-[#d8f0f5] text-[#2661cf] px-[4px] py-[2px] rounded-[4px] text-[11px] font-medium tracking-[0.22px]` |\n| CommentInput Area | `border border-[#c4cdd9] rounded-[4px] bg-white p-1 focus-within:border-[#2661cf]` |\n| 投稿ボタン | `h-7 px-3 rounded-[2px]`（Disabled: `bg-[#edf0f3] text-[#a1afc0]` / Active: `bg-primary-700 text-white`） |\n\n---\n\n## 4. Composition Rules\n\n許可: ActivityTabs + （CommentItem | LogItem）リスト + CommentInput。CommentInput ツールバー: テンプレート / 添付 / @メンション の各 IconButton。\n禁止: LogItem にアクションボタン（ピン留め・編集・削除）を配置 / アクションボタンを常時表示（`group-hover` で制御）/ `<input type=\"text\">` でコメント入力（→ `<textarea>`）/ MentionTag に `border-l-4` のカラーバー。\n配置: パネル全体は `flex flex-col h-full`（タブ → スクロール領域 `flex-1 overflow-y-auto` → CommentInput）。本文はアバター分 `pl-[32px]` でインデント。\n\n---\n\n## 5. Layout & Spacing\n\n- 各アイテムは下ボーダー `border-b border-[#dde3eb]` で区切る\n- アバター（`w-6 h-6`）+ 本文インデント `pl-[32px]`、LogItem は `pl-[52px]`（アバター位置に揃える）\n- CommentInput はパネル下部に `border-t border-[#dde3eb]` で固定\n\n### @メンション\n\n1. 入力中に `@` 入力、またはツールバーの `@` ボタンで候補リスト（メンバー Dropdown）を表示\n2. 候補選択で MentionTag をテキスト内に挿入\n3. 投稿後、メンションされたメンバーの受信トレイに通知\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| 区切りボーダー | `color.border.subtle`(#DDE3EB) |\n| ピン留め背景 / PinBanner | `color.semantic.infoBg`(#F0F7FE) / `color.primary.700` |\n| 名前テキスト | `color.content.primary`(#081A27) |\n| 日時・編集済みラベル | `#6f757d`（`color.content.secondary` 近傍） |\n| LogItem 本文 | `color.content.secondary`(#5A6C7F) |\n| MentionTag 背景 / 文字 | `color.brand.100` 近傍(#D8F0F5) / `color.primary.700`(#2661CF) |\n| 削除ボタン hover / text | `color.status.danger.container`(#FEF2F4) / `color.status.danger.base`(#E93766) |\n| 投稿ボタン Active / Disabled | `color.primary.700` / `color.surface.sunken`・`color.content.disabled` |\n| Pin IsSelected | `#ddedfc`（primary-100 近傍）+ `border-[#2661cf]` |\n| 角丸 | `radius.sm`（4px）/ ボタン 2px |\n\n---\n\n## 7. Accessibility\n\n| 項目 | 要件 |\n|------|------|\n| タブリスト | `role=\"tablist\"` / 各タブ `role=\"tab\"` + `aria-selected` + `aria-controls` |\n| タブパネル | `role=\"tabpanel\"` + `aria-labelledby` |\n| アクションボタン | 各 IconButton に `aria-label=\"ピン留め\"` 等。ピン ON 時は `aria-pressed=\"true\"` |\n| MentionTag | `role=\"mark\"` または `aria-label=\"@名前 をメンション\"` |\n| CommentInput | `<textarea>` に `aria-label=\"コメントを追加\"` |\n| 投稿ボタン Disabled | `disabled` + `aria-disabled=\"true\"` |\n| LogItem | `role=\"listitem\"`。変更内容を読み上げる（色だけで伝達しない） |\n| メンション候補リスト | `aria-expanded` を付与して表示 |\n\n## 8. Content Guidelines\n- LogItem は「担当者を A から B に変更しました」のように変更内容を明示\n- 編集済みコメントは「（編集済み | 日時）」を本文下に表示\n- ピン留めは PinBanner テキストを必ず表示（アイコン色だけで伝えない）\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: ActivityTabs -->\n<div role=\"tablist\" aria-label=\"アクティビティフィルター\" class=\"flex border-b border-[#dde3eb]\">\n  <button role=\"tab\" aria-selected=\"true\" aria-controls=\"tab-all\" class=\"h-[40px] px-4 inline-flex items-center justify-center relative border-b-2 border-primary-700 text-[14px] font-medium text-primary-700 tracking-[0.28px] hover:bg-primary-50 cursor-default outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">すべて</button>\n  <button role=\"tab\" aria-selected=\"false\" aria-controls=\"tab-comment\" class=\"h-[40px] px-4 inline-flex items-center justify-center relative text-[14px] font-medium text-body tracking-[0.28px] hover:bg-primary-50 cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-primary-700 focus-visible:ring-offset-1\">コメント</button>\n</div>\n\n<!-- Do: CommentItem（通常・MentionTag を含む） -->\n<div class=\"relative group bg-white border-b border-[#dde3eb] px-4 py-3\" role=\"listitem\">\n  <div class=\"absolute right-4 top-1 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity\">\n    <button aria-label=\"ピン留め\" class=\"w-7 h-7 inline-flex items-center justify-center bg-[#f7f9fb] rounded-[2px] hover:bg-[#edf0f3] cursor-pointer\">\n      <svg class=\"w-4 h-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"m12 17-1-4H7l1-4h8l1 4h-4l-1 4z\"/><path d=\"M12 17v4\"/><path d=\"M8 9V5\"/><path d=\"M16 9V5\"/><path d=\"M8 5h8\"/></svg>\n    </button>\n    <button aria-label=\"削除\" class=\"w-7 h-7 inline-flex items-center justify-center bg-[#f7f9fb] rounded-[2px] hover:bg-[#fef2f4] text-[#e93766] cursor-pointer\">\n      <svg class=\"w-4 h-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><path d=\"M10 11v6\"/><path d=\"M14 11v6\"/><path d=\"M9 6V4h6v2\"/></svg>\n    </button>\n  </div>\n  <div class=\"flex flex-col gap-1 w-full\">\n    <div class=\"flex items-center gap-2\">\n      <div class=\"w-6 h-6 rounded-full bg-[#ee8c29] flex items-center justify-center flex-shrink-0\" role=\"img\" aria-label=\"サンプル 太郎\"><span class=\"text-white text-[12px] font-medium leading-none\">サ</span></div>\n      <span class=\"text-[14px] font-bold text-[#081a27] leading-[1.5] whitespace-nowrap\">サンプル 太郎</span>\n      <span class=\"text-[12px] font-medium text-[#6f757d] tracking-[0.24px] whitespace-nowrap\">2024/12/24 14:13</span>\n    </div>\n    <div class=\"pl-[32px] flex flex-col gap-1\">\n      <p class=\"text-[14px] text-[#081a27] leading-[1.75]\">\n        <span role=\"mark\" aria-label=\"サンプル 花子 をメンション\" class=\"inline-flex items-center gap-[2px] bg-[#d8f0f5] text-[#2661cf] px-[4px] py-[2px] rounded-[4px] text-[11px] font-medium tracking-[0.22px] leading-[1.3] whitespace-nowrap\"><span aria-hidden=\"true\">@</span>サンプル 花子</span>\n        さん、〇〇の件よろしくお願いします。\n      </p>\n    </div>\n  </div>\n</div>\n\n<!-- Do: LogItem（アバターなし・アクションボタンなし） -->\n<div class=\"bg-white border-b border-[#dde3eb] pl-[52px] pr-4 py-3\" role=\"listitem\">\n  <div class=\"flex items-center gap-[6px]\">\n    <span class=\"text-[14px] font-bold text-[#3b3f45] leading-[1.5] whitespace-nowrap\">サンプル 太郎</span>\n    <span class=\"text-[12px] font-medium text-[#6f757d] tracking-[0.24px] whitespace-nowrap\">2024/12/23 09:52</span>\n  </div>\n  <p class=\"text-[14px] text-[#5a6c7f] leading-[1.75]\">担当者を サンプル 太郎 から サンプル 花子 に変更しました</p>\n</div>\n```\n\n**Don't**: LogItem にアクションボタンを配置 / アクションボタンを常時表示（→ `group-hover`）/ MentionTag に `border-l-4` のカラーバー / 投稿ボタンを未入力時にアクティブ（`bg-primary-700`）にする / ピン留めをアイコン色だけで伝える（PinBanner 必須）/ `<input type=\"text\">` で入力欄を実装（→ `<textarea>`）/ メンション候補リストを `aria-expanded` なしで表示。\n\n---\n\n## 10. Implementation Notes\n- 依存コンポーネント: Tabs（ActivityTabs）/ `Avatar.md`（AccountIcon、`w-6 h-6`）。アイコンは Lucide（`w-4 h-4 stroke=\"currentColor\" fill=\"none\"`）\n- テンプレート選択時は TemplateBlock（青バナー `bg-[#f0f7fe] border border-[#2661cf]`）を入力エリア上部に表示し、投稿ボタンをアクティブに。× で解除\n- タブ切替・投稿ボタン状態は JS で制御（`switchTab` / `handleCommentInput`）。受信トレイ型 2カラムは inbox パターンを参照\n", "base/display/Empty prompt.md": "# Component Guideline: Empty prompt\n\n## 1. Component Identity\n- **Name**: Empty prompt\n- **Variants**: `default` / `compact`\n- **Responsibility**:\n  - する: データが空の状態（0件・未設定）を一貫したレイアウトで表示し、次のアクションに誘導する\n  - しない: エラー状態の表示（Alertsを使う）・ローディング中のプレースホルダー（Skeletonを使う）\n- **Target Platform**: デスクトップ Web アプリ\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 |\n|---------|------|\n| `default` | ページ・カード内のメインコンテンツ領域が空の場合 |\n| `compact` | テーブルの空行やパネル内など、スペースが限られる場合 |\n\n**States**\n\n| State | 変化するプロパティ |\n|-------|-----------------|\n| default | 通常表示 |\n\n---\n\n## 3. Props / API\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `icon` | `ReactElement` | — | — | イラスト/アイコン（任意。省略時はデフォルトアイコン） |\n| `title` | `string` | — | ✓ | 空状態のタイトル |\n| `description` | `string` | — | — | 補足説明（任意） |\n| `action` | `ReactElement` | — | — | CTAボタン（任意） |\n| `variant` | `'default' \\| 'compact'` | `'default'` | — | バリアント |\n\n**Event Handlers**\n- action 内の `<Button>` に設定\n\n---\n\n## 4. Composition Rules\n\n**許可する子要素**\n- なし（props のみ）\n\n**Anti-patterns**\n- NG: 空状態に独自レイアウトを作る → 必ず Empty prompt を使う（一貫した体験のため）\n- NG: `title` を省略する（空の状態が何かユーザーに伝えること）\n\n---\n\n## 5. Layout & Spacing\n\n| プロパティ | トークン | 値（default） |\n|-----------|---------|-------------|\n| コンテナ padding | `spacing.12` | 48px |\n| アイコンサイズ | — | 48px（Icon xl） |\n| アイコン-タイトル gap | `spacing.4` | 16px |\n| タイトル-説明 gap | `spacing.2` | 8px |\n| 説明-アクション gap | `spacing.6` | 24px |\n| max-width | — | 400px（中央寄せ） |\n\n| プロパティ | 値（compact） |\n|-----------|-------------|\n| コンテナ padding | `spacing.8` 32px |\n| アイコンサイズ | 32px（Icon lg） |\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン | 値 |\n|------|---------|-----|\n| アイコン色 | `color.content.disabled` | — |\n| タイトル | `color.content.primary` | — |\n| 説明テキスト | `color.content.secondary` | — |\n\n---\n\n## 8. Accessibility\n\n- **Role**: `status`（空状態の動的通知）\n- **必須ARIA属性**:\n  - `role=\"status\"`, `aria-live=\"polite\"`（データが動的に空になった場合）\n- **コントラスト比**: タイトル 4.5:1、説明 4.5:1 以上\n\n---\n\n## 9. Content Guidelines\n\n- `title` はユーザーに「何が空か」を伝える（「プロジェクトがまだありません」「結果が見つかりません」）\n- `description` は理由または次のアクションを示す（「プロジェクトを作成して始めましょう」）\n- `action` の Button ラベルは具体的（「プロジェクトを作成」「フィルターをリセット」）\n\n---\n\n## 10. Usage Do / Don't\n\n**Do**\n```tsx\n// データが 0 件\n<EmptyPrompt\n  icon={<FolderIcon />}\n  title=\"プロジェクトがまだありません\"\n  description=\"新しいプロジェクトを作成して、作業を始めましょう。\"\n  action={\n    <Button variant=\"primary\" onClick={openCreateModal}>\n      プロジェクトを作成\n    </Button>\n  }\n/>\n\n// 検索結果が 0 件\n<EmptyPrompt\n  title=\"「{query}」に一致する結果はありません\"\n  description=\"検索キーワードを変えるか、フィルターを解除してください。\"\n  action={<Button variant=\"secondary\" onClick={clearFilters}>フィルターをリセット</Button>}\n/>\n```\n\n**Don't**\n```tsx\n// NG: 独自の空状態レイアウトを作る\n<div className=\"empty-state\">\n  <img src=\"/empty.svg\" />\n  <p>データがありません</p>\n</div>\n\n// NG: title を省略する\n<EmptyPrompt description=\"データがありません\" />\n```\n\n---\n\n## 11. Implementation Notes\n\n- コンポーネントは常にコンテナの中央（`text-align: center`, `display: flex`, `flex-direction: column`, `align-items: center`）に配置\n- テストチェックリスト:\n  - [ ] icon / action ありなしの見た目確認\n  - [ ] compact variant の確認\n  - [ ] `role=\"status\"` の確認\n\n---\n\n## 12. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n", "base/display/Icon.md": "# Component Guideline: Icon\n\n## 1. Component Identity\n- **Name**: Icon\n- **Variants**: `default`（SVGアイコンラッパー）\n- **Responsibility**:\n  - する: SVGアイコンを統一したサイズ・カラー・アクセシビリティ設定でレンダリングする\n  - する: アイコンは **Lucide（https://lucide.dev/icons/ / `lucide-react`）** を基本セットとし、`name` は Lucide のアイコン名（kebab-case。例 `triangle-alert` / `trash-2` / `bell` / `search` / `circle-check`）に一致させる\n  - しない: アイコンの定義・SVGの管理（アイコンライブラリで管理）・クリックハンドラ（ButtonやIconButton で包む）\n  - しない: **絵文字・dingbats・幾何学記号・矢印グリフ・`&#NNNN;`（HTML 数値文字参照）をアイコン代わりに使う**（アイコンは必ず本コンポーネント＝Lucide で表現する）\n- **Target Platform**: デスクトップ Web アプリ\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 |\n|---------|------|\n| `default` | 標準的なSVGアイコンラッパー |\n\n**States**\n\n| State | 変化するプロパティ |\n|-------|-----------------|\n| default | 親要素の `color` を継承 |\n| （Icon 単体は hover / focus を持たない。Button 等で包んで制御） | — |\n\n---\n\n## 3. Props / API\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `as` | `ReactElement` | — | ✓ | 表示するアイコンコンポーネント |\n| `size` | `'xs' \\| 'sm' \\| 'md' \\| 'lg' \\| 'xl'` | `'md'` | — | サイズ |\n| `color` | `string` | `'currentColor'` | — | アイコン色（省略時は親の color を継承） |\n| `aria-label` | `string` | — | — | 意味のあるアイコンの場合に必須 |\n| `aria-hidden` | `boolean` | `true` | — | 装飾用アイコンは true（デフォルト） |\n\n**Event Handlers**\n- なし（クリック等は `<Button>` や `<IconButton>` で包む）\n\n---\n\n## 4. Composition Rules\n\n**許可する子要素**\n- なし（`as` prop でアイコンを渡す）\n\n**Anti-patterns**\n- NG: `<Icon>` に直接 `onClick` を設定する → `<Button variant=\"ghost\">` で包む\n- NG: 意味のあるアイコン（ボタンのラベル代替）に `aria-hidden=\"true\"` を設定する → `aria-label` を付ける\n- NG: 絵文字・記号グリフ（⚠ ▲ → ★ 等）や `&#9888;` 等の HTML 数値文字参照をアイコン代わりに使う → Lucide のアイコン（例 `triangle-alert`）に置換する\n\n---\n\n## 5. Layout & Spacing\n\n| Size | px |\n|------|----|\n| `xs` | 12×12px |\n| `sm` | 16×16px |\n| `md` | 20×20px |\n| `lg` | 24×24px |\n| `xl` | 32×32px |\n\n- SVG の `viewBox` は `0 0 24 24` に統一\n- `fill=\"none\"` + `stroke=\"currentColor\"` または `fill=\"currentColor\"` を統一する\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン | 値 |\n|------|---------|-----|\n| デフォルト色（テキストと同色） | `currentColor` | 親要素の color を継承 |\n| サブテキスト色のアイコン | `color.content.secondary` | — |\n| 無効アイコン | `color.content.disabled` | — |\n| primary アクション | `color.brand.primary` | — |\n\n---\n\n## 8. Accessibility\n\n- **Role**: なし（`aria-hidden=\"true\"` が原則）\n- **必須ARIA属性**:\n  - 装飾用（ラベルと一緒に表示）: `aria-hidden=\"true\"`（デフォルト）\n  - 単体で意味を持つ（ラベルなし）: `aria-hidden=\"false\"` + `aria-label=\"[説明]\"`\n- **コントラスト比**: 意味のあるアイコン 4.5:1 以上（非テキストコントラスト 3:1 以上）\n\n---\n\n## 9. Content Guidelines\n\n- `aria-label` はアイコンが表す「アクション」または「状態」を簡潔に（「削除」「警告」「読み込み中」）\n- アイコン単体を UI 要素として使う場合、Tooltip と組み合わせて補足する\n\n---\n\n## 10. Usage Do / Don't\n\n**Do**\n```tsx\n// 装飾用（ラベルと一緒に使う）\n<Button leftIcon={<Icon as={SaveIcon} />}>保存</Button>\n\n// 意味のあるアイコン単体（aria-label 必須）\n<Icon as={WarningIcon} size=\"md\" aria-hidden={false} aria-label=\"警告\" />\n\n// クリック可能なアイコン（Button で包む）\n<Button variant=\"ghost\" accessibilityLabel=\"削除\">\n  <Icon as={TrashIcon} size=\"md\" />\n</Button>\n```\n\n**Don't**\n```tsx\n// NG: onClick を Icon に直接付ける\n<Icon as={TrashIcon} onClick={handleDelete} />\n\n// NG: 意味のあるアイコンに aria-hidden=\"true\"\n<Icon as={ErrorIcon} aria-hidden={true} />  // ← エラー状態を伝えられない\n```\n\n---\n\n## 11. Implementation Notes\n\n- アイコンライブラリは **Lucide（`lucide-react` / https://lucide.dev/icons/）に統一する**。アイコン名は Lucide のリガチャ名（kebab-case: `triangle-alert` / `trash-2` / `bell` / `search` / `circle-check` 等）に一致させる\n- 絵文字・dingbats・幾何学記号・矢印グリフ・`&#NNNN;` をアイコンに使わない（禁則。severity: error）\n- SVG は `width` / `height` を明示せず、親コンテナのサイズに追従する形で `size` prop でコントロール\n- テストチェックリスト:\n  - [ ] 5 サイズの表示確認\n  - [ ] `currentColor` 継承の確認\n  - [ ] aria-label が設定されているアイコンの読み上げ確認\n\n---\n\n## 12. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n", "base/display/Indicators.md": "# Component Guideline: Indicators\n\n## 1. Component Identity\n- **Name**: Indicators（KPI Metric）\n- **Variants**: `default` / `positive` / `negative` / `neutral`\n- **Responsibility**:\n  - する: KPI・メトリクスの数値とトレンドを表示する\n  - しない: 時系列の推移グラフ（Chartを使う）・進捗バー（Progressを使う）\n- **Target Platform**: デスクトップ Web アプリ\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 |\n|---------|------|\n| `default` | トレンドなし。数値のみ表示 |\n| `positive` | トレンド上昇（改善方向） |\n| `negative` | トレンド下降（悪化方向） |\n| `neutral` | 横ばい |\n\n**States**\n\n| State | 変化するプロパティ |\n|-------|-----------------|\n| default | 通常表示 |\n| loading | Skeleton で代替 |\n\n---\n\n## 3. Props / API\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `value` | `string \\| number` | — | ✓ | 表示する数値または文字列 |\n| `label` | `string` | — | ✓ | メトリクスのラベル |\n| `variant` | `'default' \\| 'positive' \\| 'negative' \\| 'neutral'` | `'default'` | — | トレンド種別 |\n| `change` | `string` | — | — | 変化量（例: `+12.3%`, `-5件`） |\n| `changePeriod` | `string` | — | — | 比較期間（例: `前週比`, `前月比`） |\n| `unit` | `string` | — | — | 数値の単位（例: `件`, `ms`, `%`） |\n| `isLoading` | `boolean` | `false` | — | ローディング状態 |\n\n**Event Handlers**\n- なし（非インタラクティブ）\n\n---\n\n## 4. Composition Rules\n\n**許可する子要素**\n- なし（props のみで制御）\n\n**Anti-patterns**\n- NG: `value` に長い文字列を入れる（数値・短い文字列のみ）\n- NG: トレンドの方向（positive/negative）とビジネス意味を混同する → 「エラー数が減少＝positive」なのでドメインに合わせて variant を設定\n\n---\n\n## 5. Layout & Spacing\n\n| プロパティ | トークン | 値 |\n|-----------|---------|-----|\n| value font-size | `typography.fontSize.3xl` | 24px |\n| value font-weight | `typography.fontWeight.bold` | 700 |\n| label font-size | `typography.fontSize.sm` | 12px |\n| value-label gap | `spacing.1` | 4px |\n| change font-size | `typography.fontSize.sm` | 12px |\n| change-changePeriod gap | `spacing.1` | 4px |\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン | 値 |\n|------|---------|-----|\n| value テキスト | `color.content.primary` | — |\n| label テキスト | `color.content.secondary` | — |\n| positive トレンド | `color.semantic.success` | — |\n| negative トレンド | `color.semantic.error` | — |\n| neutral トレンド | `color.content.secondary` | — |\n| unit | `color.content.secondary` | — |\n\n---\n\n## 8. Accessibility\n\n- **Role**: `status`（動的に更新される場合）\n- **必須ARIA属性**:\n  - `aria-label=\"[label]: [value][unit]\"` で数値の意味を補足\n  - トレンドアイコン: `aria-label=\"[上昇/下降/横ばい]\"` + テキストでも色以外で表現\n- **コントラスト比**: value テキスト 4.5:1 以上\n\n---\n\n## 9. Content Guidelines\n\n- `value` は右詰め整形（数値は 3 桁カンマ区切り）\n- `change` は必ず符号を付ける（`+12%` / `-5件`）\n- `changePeriod` は短く（「前週比」「前月比」「前日比」）\n\n---\n\n## 10. Usage Do / Don't\n\n**Do**\n```tsx\n<Indicators\n  label=\"API エラー数\"\n  value=\"23\"\n  unit=\"件\"\n  variant=\"positive\"  // エラーが減少＝改善方向\n  change=\"-8件\"\n  changePeriod=\"前週比\"\n/>\n```\n\n**Don't**\n```tsx\n// NG: ビジネス意味と variant を逆にする\n<Indicators\n  label=\"API エラー数\"\n  value=\"23\"\n  variant=\"negative\"  // エラー増加のみ negative。文脈次第\n/>\n\n// NG: value に長い文字列\n<Indicators value=\"接続済み (3/5)\" label=\"...\" />\n```\n\n---\n\n## 11. Implementation Notes\n\n- ダッシュボードの KPI エリアでは `<Card>` 内に配置\n- ローディング中は `<Skeleton variant=\"rect\" width=\"120px\" height=\"60px\" />`\n- テストチェックリスト:\n  - [ ] 4 variant の見た目確認\n  - [ ] トレンドアイコンの `aria-label` 確認\n\n---\n\n## 12. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n", "base/display/Range Sliders.md": "# Component Guideline: Range Sliders\n\n## 1. Component Identity\n- **Name**: Range Sliders\n- **Variants**: `single`（単一値）/ `range`（2ハンドル）\n- **Responsibility**:\n  - する: 連続した数値範囲の中から値または範囲を直感的に選択させる\n  - しない: 厳密な数値入力（Input Numberを使う）・進捗表示（Progressを使う）\n- **Target Platform**: デスクトップ Web アプリ\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 |\n|---------|------|\n| `single` | 単一値の選択（ボリューム・しきい値・タイムアウト） |\n| `range` | 範囲選択（価格帯・日数範囲・スコア範囲） |\n\n**States**\n\n| State | 変化するプロパティ |\n|-------|-----------------|\n| default | トラック: `color.surface.raised`、フィル: `color.brand.primary`、ハンドル: white |\n| hover (ハンドル) | ハンドルに shadow 追加、`transition: 100ms` |\n| focus (ハンドル) | `outline: 2px solid color.border.focus` (offset 2px) |\n| active (drag) | ハンドルサイズを拡大（20px→24px）、ツールチップ表示 |\n| disabled | `opacity: 0.4`、`cursor: not-allowed` |\n\n---\n\n## 3. Props / API\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `value` | `number` | — | — | 現在値（single 制御） |\n| `range` | `[number, number]` | — | — | 現在範囲（range 制御） |\n| `min` | `number` | `0` | — | 最小値 |\n| `max` | `number` | `100` | — | 最大値 |\n| `step` | `number` | `1` | — | ステップ幅 |\n| `variant` | `'single' \\| 'range'` | `'single'` | — | バリアント |\n| `isDisabled` | `boolean` | `false` | — | 非活性 |\n| `showTooltip` | `boolean` | `true` | — | ドラッグ中のツールチップ表示 |\n| `label` | `string` | — | — | スライダーのラベル |\n| `formatValue` | `(v: number) => string` | `v => String(v)` | — | 値のフォーマット関数 |\n| `onChange` | `(value: number) => void` | — | — | 値変更（single） |\n| `onRangeChange` | `(range: [number, number]) => void` | — | — | 範囲変更（range） |\n\n**Event Handlers**\n- `onChange(value: number)`: 値変更（single）\n- `onRangeChange(range: [number, number])`: 範囲変更（range）\n\n---\n\n## 4. Composition Rules\n\n**許可する子要素**\n- なし（props のみ）\n\n**Anti-patterns**\n- NG: `step` を細かくしすぎる（0.001 など）→ ドラッグ精度の問題。数値入力（Input Number）と組み合わせる\n- NG: `min` / `max` を設定しない\n\n---\n\n## 5. Layout & Spacing\n\n| プロパティ | トークン | 値 |\n|-----------|---------|-----|\n| トラック高さ | — | 4px |\n| ハンドル直径（default） | — | 20px |\n| ハンドル直径（active） | — | 24px |\n| ハンドル border-radius | `radius.full` | 9999px |\n| ラベル-スライダー gap | `spacing.2` | 8px |\n| ツールチップ offset | — | 8px |\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン | 値 |\n|------|---------|-----|\n| トラック（未選択） | `color.surface.raised` | — |\n| フィル（選択済み） | `color.brand.primary` | — |\n| ハンドル | white | — |\n| ハンドル border | `color.brand.primary` | — |\n| focus ring | `color.border.focus` | — |\n\n---\n\n## 8. Accessibility\n\n- **Role**: `slider`\n- **必須ARIA属性**:\n  - `role=\"slider\"`, `aria-valuenow`, `aria-valuemin`, `aria-valuemax`\n  - `aria-label=\"[label]\"` または `aria-labelledby`\n  - range: 2つの `slider` それぞれに `aria-label=\"最小値\"` / `aria-label=\"最大値\"`\n- **キーボード操作**:\n  - `←` / `↓`: 値を -step\n  - `→` / `↑`: 値を +step\n  - `Page Down` / `Page Up`: 値を -(step×10) / +(step×10)\n  - `Home` / `End`: min / max\n- **コントラスト比**: ハンドル vs トラック 3:1 以上\n\n---\n\n## 9. Content Guidelines\n\n- `formatValue` で単位を付ける（`v => v + 'ms'`、`v => '¥' + v.toLocaleString()`）\n- ツールチップに現在値を表示\n\n---\n\n## 10. Usage Do / Don't\n\n**Do**\n```tsx\n// 単一値\n<RangeSlider\n  label=\"タイムアウト\"\n  value={timeout}\n  min={100}\n  max={30000}\n  step={100}\n  formatValue={v => `${v}ms`}\n  onChange={setTimeout}\n/>\n\n// 範囲選択\n<RangeSlider\n  variant=\"range\"\n  label=\"ポート範囲\"\n  range={portRange}\n  min={0}\n  max={65535}\n  onRangeChange={setPortRange}\n/>\n```\n\n**Don't**\n```tsx\n// NG: step が非常に細かい（精度の問題）\n<RangeSlider step={0.001} min={0} max={1} />\n// → Input Number と組み合わせて精度を確保\n\n// NG: min/max なし\n<RangeSlider value={val} onChange={setVal} />\n```\n\n---\n\n## 11. Implementation Notes\n\n- ドラッグ操作は `onMouseDown` / `onTouchStart` → `mousemove` / `touchmove` → `mouseup` / `touchend` のシーケンスで制御\n- range variant: 2つのハンドルが交差しないようにバリデーション\n- テストチェックリスト:\n  - [ ] キーボードの矢印キーでの値変更確認\n  - [ ] `aria-valuenow` の更新確認\n  - [ ] range variant でハンドルが交差しないこと\n\n---\n\n## 12. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n", "base/display/Chart.md": "# Component Guideline: Chart\n\n## 1. Component Identity\n- **Name**: Chart\n- **Variants**: `line` / `bar` / `area` / `donut`\n- **Responsibility**:\n  - する: 時系列・比較・割合データを視覚化するコンテナを提供する\n  - しない: 生データのテーブル表示（Tableを使う）・KPI単体の数値表示（Indicatorsを使う）\n- **Target Platform**: デスクトップ Web アプリ\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | 用途 |\n|---------|------|\n| `line` | 時系列トレンド。複数系列の比較 |\n| `bar` | カテゴリ間の比較。horizontal/vertical |\n| `area` | 累積・ボリューム変化の可視化 |\n| `donut` | 割合・構成比（パーセント）の表示 |\n\n**States**\n\n| State | 変化するプロパティ |\n|-------|-----------------|\n| default | 通常表示 |\n| loading | Skeleton で代替（Chart 内部は空） |\n| empty | Empty prompt コンポーネントを表示 |\n| hover (data point) | ツールチップ表示、ポイント拡大 |\n\n---\n\n## 3. Props / API\n\n| Prop | Type | Default | Required | Description |\n|------|------|---------|----------|-------------|\n| `type` | `'line' \\| 'bar' \\| 'area' \\| 'donut'` | `'line'` | ✓ | チャートタイプ |\n| `data` | `ChartDataset[]` | — | ✓ | データセット |\n| `labels` | `string[]` | — | ✓ | X軸ラベル（line/bar/area）または凡例（donut） |\n| `height` | `number` | `240` | — | チャートの高さ（px） |\n| `showLegend` | `boolean` | `true` | — | 凡例を表示するか |\n| `showTooltip` | `boolean` | `true` | — | ツールチップを表示するか |\n| `isLoading` | `boolean` | `false` | — | ローディング状態 |\n| `accessibilityLabel` | `string` | — | ✓ | チャート全体の説明（スクリーンリーダー用） |\n\n**ChartDataset 型**\n```ts\ntype ChartDataset = {\n  label: string\n  data: number[]\n  color?: string  // 省略時はデザインシステムのカラーパレットから自動割り当て\n}\n```\n\n**Event Handlers**\n- `onDataPointClick(datasetIndex, dataIndex)`: データポイントクリック時（任意）\n\n---\n\n## 4. Composition Rules\n\n**許可する子要素**\n- なし（props のみで制御）\n\n**Anti-patterns**\n- NG: `accessibilityLabel` なしで Chart を使う → スクリーンリーダーが内容を認識できない\n- NG: 1つのチャートに10系列以上表示する → 視覚的に区別不可能。データを絞る\n\n---\n\n## 5. Layout & Spacing\n\n| プロパティ | トークン | 値 |\n|-----------|---------|-----|\n| コンテナ padding | `spacing.4` | 16px |\n| 凡例との gap | `spacing.3` | 12px |\n| 最小高さ | — | 120px |\n| 幅 | — | 100%（レスポンシブ） |\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン | 値 |\n|------|---------|-----|\n| グリッド線 | `color.border.subtle` | — |\n| 軸テキスト | `color.content.secondary` | — |\n| ツールチップ背景 | `color.surface.overlay` | — |\n| データカラー 1 | `color.brand.primary` | — |\n| データカラー 2 | `color.semantic.success` | — |\n| データカラー 3 | `color.semantic.warning` | — |\n| データカラー 4 | `color.semantic.info` | — |\n\n---\n\n## 8. Accessibility\n\n- **Role**: `img`（チャートコンテナ）\n- **必須ARIA属性**:\n  - `role=\"img\"`, `aria-label=\"[accessibilityLabel]\"`\n  - データテーブルフォールバック: `<details>` 内に `<table>` でデータを提供（視覚的に非表示）\n- **コントラスト比**: データカラー同士の区別は色だけでなく線種・マーカー形状でも区別\n\n---\n\n## 9. Content Guidelines\n\n- `accessibilityLabel` は「〇〇の推移（2026年1月〜3月）」のように期間・内容を含める\n- 凡例ラベルは短く（10文字以内）\n- 軸ラベルは単位を含める（「リクエスト数 / 時間」）\n\n---\n\n## 10. Usage Do / Don't\n\n**Do**\n```tsx\n<Chart\n  type=\"line\"\n  accessibilityLabel=\"API リクエスト数の推移（過去7日間）\"\n  data={[\n    { label: 'GET /api/v1', data: [120, 145, 132, ...] },\n    { label: 'POST /api/v1', data: [45, 52, 48, ...] },\n  ]}\n  labels={['月', '火', '水', '木', '金', '土', '日']}\n/>\n```\n\n**Don't**\n```tsx\n// NG: accessibilityLabel なし\n<Chart type=\"bar\" data={data} labels={labels} />\n\n// NG: 10系列以上表示\n<Chart data={Array(12).fill(...)} />\n```\n\n---\n\n## 11. Implementation Notes\n\n- チャートライブラリ: Recharts または Chart.js（プロジェクトの依存関係に準ずる）\n- ローディング中は `<Skeleton variant=\"rect\" height={240} />` で代替\n- テストチェックリスト:\n  - [ ] 4 variant の見た目確認\n  - [ ] ローディング状態（Skeleton）の確認\n  - [ ] データが空の場合の Empty prompt 表示確認\n  - [ ] `aria-label` の確認\n\n---\n\n## 12. Change Log & Deprecation\n\n| Version | 変更内容 | 対応期限 |\n|---------|---------|---------|\n| v1.0 | 初期リリース | — |\n", "base/layout/Modals.md": "# Component Guideline: Modals\n\n> NestUI Modal 仕様。Tailwind CSS。値は `tokens/`（色は `color.surface.*` 等）を正とし、以下の class はその適用例。\n\n## 1. Component Identity\n- **Name**: Modals\n- **Variants**: `confirm`（確認）/ `destroy`（破壊的確認）/ `form`（フォーム）/ `alert`（アラート）\n- **Responsibility**:\n  - する: ユーザーの注意を要する確認・フォーム・通知をオーバーレイ上に表示する\n  - しない: 一時的な通知（Toast を使う）/ サイドパネル・詳細表示（Drawer を使う）/ インライン補足（Callout / Popover を使う）\n- **Target Platform**: デスクトップ Web アプリ（業務 SaaS）\n\n**原則**: 中断を最小限に（インラインで解決できる操作には使わない）/ 1 モーダル = 1 タスク（目的を絞る）/ 脱出経路を常に提供（×ボタン・オーバーレイクリック・Escape の3経路。alert はオーバーレイクリック無効）/ コンテキストの保持（閉じても背面のスクロール位置・入力途中データを維持）。\n\n---\n\n## 2. Variants & States\n\n**Variants**\n\n| Variant | role | 用途 | 主ボタン |\n|---------|------|------|---------|\n| `confirm`（確認） | `dialog` | 通常の確認 | Contained（CTA） |\n| `destroy`（破壊的確認） | `dialog` | 削除など破壊的操作の最終確認 | Danger（アウトライン型 `text-[#e93766] border border-[#e93766]`。フィル `bg-red-*` 禁止） |\n| `form`（フォーム） | `dialog` | 簡易データ入力・編集（フィールド最大5つ程度） | Contained（CTA） |\n| `alert`（アラート） | `alertdialog` | システムからの重要通知。オーバーレイクリックで閉じない | Contained（CTA） |\n\n**サイズ**（`max-w-*`。Tailwind 標準ブレークポイント幅 `max-w-sm` 等は禁止）\n\n| サイズ | max-width | 用途 |\n|--------|-----------|------|\n| Small | `max-w-[480px]` | 確認ダイアログ・シンプルなアラート |\n| Medium（既定） | `max-w-[640px]` | フォーム入力・標準コンテンツ |\n| Large | `max-w-[800px]` | 複雑なフォーム・プレビュー |\n| Full | `max-w-[1024px]` | テーブル・大量データ |\n\n**States**: closed（非表示）/ open（表示・フォーカストラップ有効）/ loading（フッターボタンにスピナー追加・操作不可。ラベルは消さない）。\n\n---\n\n## 3. パーツ\n\n| パーツ | 要素 | 必須 | class（適用例） |\n|--------|------|:----:|------|\n| Overlay | `<div>` | Yes | `fixed inset-0 bg-black/50 z-40`。クリックで閉じる（alert は無効化） |\n| Dialog | `<div role=\"dialog\">` | Yes | `fixed inset-0 flex items-center justify-center z-50 p-4` + 本体 `bg-white rounded-[8px] w-full max-w-[640px]`。`aria-modal=\"true\"` |\n| Header | 見出し + ×ボタン | Yes | `flex gap-4 items-center pt-5 pb-3 px-6`（ヘッダーに border なし）。見出し `text-[21px] font-bold leading-[1.5] tracking-[0.63px] text-[#081a27]` |\n| ×ボタン | `<button>` | Yes | `w-6 h-6 inline-flex items-center justify-center text-[#3e5062] hover:text-[#081a27] rounded-sm focus:ring-2 focus:ring-primary-700 focus:ring-offset-1` + `aria-label=\"閉じる\"` |\n| Body | 自由コンテンツ | Yes | `px-6 pb-2`。本文 `text-[14px] text-[#3e5062] leading-[1.75]` |\n| Footer | アクションボタン群 | No | `flex gap-3 items-center border-t border-[#c4cdd9] px-4 py-3`（フッター上部に border あり） |\n\nボタン高さは `h-9`（36px）。詳細は `base/navigation/Buttons.md` を参照。\n\n---\n\n## 4. Composition Rules\n\n許可: 任意のコンテンツ / Footer のボタン群。\n配置（フッター）: Tertiary（Neutral・補助）が左端、Secondary（Outlined Primary）+ Primary（CTA）が `flex flex-1 gap-3 justify-end` で右寄せ。確認系は `Subtle/Neutral → Contained`、破壊系は `Neutral → Danger`。\n禁止: モーダルのネスト（3層以上禁止・最大2層、背面は `pointer-events-none`）/ `title` の省略 / `alert` でオーバーレイクリックを有効化 / `bg-red-500` のフィル型 Danger（→ アウトライン型）/ `max-w-sm` `max-w-lg` 等の Tailwind 標準幅。\n\n---\n\n## 5. Layout & Spacing\n\n| プロパティ | トークン | 値 |\n|-----------|---------|-----|\n| Header padding | `spacing.5` / `spacing.3` / `spacing.6` | `pt-5 pb-3 px-6` |\n| Body padding | `spacing.6` / `spacing.2` | `px-6 pb-2` |\n| Footer padding | `spacing.4` / `spacing.3` | `px-4 py-3` |\n| Header 内 gap | `spacing.4` | `gap-4` |\n| Footer 内 gap | `spacing.3` | `gap-3` |\n| Dialog radius | `radius.*`（8px） | `rounded-[8px]` |\n| Dialog padding（外） | `spacing.4` | `p-4`（ビューポート余白） |\n| Footer border-top | — | `border-t border-[#c4cdd9]` |\n\n---\n\n## 6. Token Mapping\n\n| 用途 | トークン |\n|------|---------|\n| Overlay | `rgba(0,0,0,0.5)`（`bg-black/50`） |\n| Dialog 背景 | `#ffffff`（`color.surface.overlay`） |\n| タイトルテキスト | `#081a27`（`color.content.primary`） |\n| 本文テキスト | `#3e5062`（`color.content.secondary` 近傍） |\n| ×ボタン / Footer border | `#3e5062`（`color.content.secondary`）/ `#c4cdd9`（`color.border.default`） |\n| Danger（destroy）テキスト・ボーダー / container | `color.status.danger.base`(#e93766) / `.container`(#fef2f4) / active(#fccfd9) |\n| Overlay z / Dialog z | `elevation.z.overlay`(40) / `elevation.z.modal`(50)。2層目は 60/70 |\n| Dialog radius | `radius.*`（8px） |\n\n---\n\n## 7. Accessibility\n\n- Role: `role=\"dialog\"`（通常）/ `role=\"alertdialog\"`（アラート）\n- `aria-modal=\"true\"` を Dialog に付与 / `aria-labelledby` で Header 見出しの `id` を参照 / 補足は `aria-describedby` で Body の `id` を参照\n- フォーカストラップ: モーダル内でフォーカスを循環（Tab / Shift+Tab で外に出ない）。開時に最初のフォーカス可能要素へ、閉時にトリガーへ戻す\n- Escape でモーダルを閉じる（`alert` は閉じない設計も可）\n- 背面スクロール: 表示中は `body` に `overflow-hidden` を付与\n- トリガーボタンに `aria-haspopup=\"dialog\"`\n\n---\n\n## 8. Content Guidelines\n- タイトルはモーダルの目的を示す（「このアイテムを削除しますか？」「アイテムを追加」）\n- Body で「何が起きるか」を具体的に説明する（破壊的操作は特に）\n- フォームはフィールド数を最大5つ程度に。多い場合はページ遷移や Drawer を検討\n\n---\n\n## 9. Usage Do / Don't\n\n```html\n<!-- Do: 確認ダイアログ（confirm） -->\n<div class=\"fixed inset-0 bg-black/50 z-40\" onclick=\"c
